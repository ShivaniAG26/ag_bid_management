.bm-lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bm-lh b{font:600 13.5px/1.35 var(--font-sans)}
.bm-sub{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.bm-sub li{padding:0;border:0;font-size:12px;color:var(--text-secondary);padding-left:12px;position:relative}
.bm-sub li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.bm-wait{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bm-wait button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-12);border:1px solid var(--border-subtle);width:100%;box-sizing:border-box}
.bm-wait button:hover{border-color:var(--pack);background:var(--bg-hover)}
.bm-wtx{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.bm-wtx b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-wtx small{font-size:11.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-wait svg{width:14px;height:14px;color:var(--muted);flex:none}
.bm-qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bm-qs span{display:flex;flex-direction:column;gap:1px;min-width:0}
.bm-qs b{font:500 20px/1.1 var(--f-display)}
.bm-qs small{font-size:11.5px;color:var(--text-secondary)}
@media(max-width:1100px){.c-band{grid-template-columns:minmax(0,1fr)}}

/* ===== the KPI band shared by Option A and Option C ======================= */
.d-band{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:var(--space-16);align-items:stretch}
.d-band>.d-kpi{gap:9px;padding:var(--space-20)}
.d-band .eyebrow{font:500 11.5px/1.3 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary)}
.d-band .d-kpi>b{font:500 32px/1.1 var(--f-display);letter-spacing:-.015em}
.d-band .hm-ai{margin-top:auto}
.d-kpi-book{background:var(--bg-subtle)}
.d-bookv{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.d-bookv b{font:500 32px/1.1 var(--f-display);letter-spacing:-.015em;color:var(--text-primary)}
.d-bookv .d-note{font-size:12.5px}
.d-bleg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12.5px;color:var(--text-secondary)}
.d-bleg li{display:flex;align-items:center;gap:6px;min-width:0}
.d-bleg i{width:8px;height:8px;border-radius:2px;flex:none}
.d-bleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-bleg b{margin-left:auto;font-weight:500;color:var(--text-primary);font-variant-numeric:tabular-nums;white-space:nowrap}
.dash-a{display:flex;flex-direction:column;gap:var(--space-16)}
@media(max-width:1200px){.d-band{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.d-band{grid-template-columns:1fr}}
/* ===== My work: Admin-console KPI cards over the queue ===================== */
.wkpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:var(--space-20)}
.wkpi{transition:border-color .15s,box-shadow .15s}
.wkpi.brand .akpi-ic{background:var(--brand-soft);color:var(--text-brand)}
.wkpi.on{border-color:var(--brand-border);box-shadow:var(--focus-ring)}
.wkpi .akpi-f{min-height:20px}
.wk-late{color:var(--warning-fg);font-weight:500}
.wkpi.bad .wk-late{color:var(--danger-fg)}
.wkq>.ph .seg .ct{font-size:11px;color:var(--text-muted);margin-left:2px;font-variant-numeric:tabular-nums}
.wkq .t td{vertical-align:middle}
.wkq .t tbody tr.click:hover>td{background:var(--bg-hover)}
.wk-due{white-space:nowrap}
.wk-due>span{display:block;font-variant-numeric:tabular-nums}
.wk-due .sub{font-size:11.5px;color:var(--text-muted)}
.wk-due .late{color:var(--danger-fg);font-weight:500}
.wk-due .now{color:var(--warning-fg);font-weight:500}
.wk-go{display:inline-grid;place-items:center;width:24px;height:24px;color:var(--text-muted)}
.wk-go svg{width:16px;height:16px}
.wkq .t tbody tr:hover .wk-go{color:var(--text-primary)}
.wkq .empty{gap:var(--space-12)}
/* the filter row scrolls rather than pushing the page wider */
@media (max-width:820px){.wkq>.ph,.dx-reg>.ph{flex-wrap:nowrap;align-items:flex-start}
  .wkq>.ph>.seg,.dx-reg>.ph>.seg{max-width:100%;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
  .wkq>.ph>.seg::-webkit-scrollbar,.dx-reg>.ph>.seg::-webkit-scrollbar{display:none}
  .wkq>.ph>.seg button,.dx-reg>.ph>.seg button{flex:none}}
@media (max-width:620px){.wkq>.ph,.dx-reg>.ph{flex-wrap:wrap}}
/* narrow screens: the tender and the date move under the item, so the row stays readable */
.wk-sub{display:none}
@media (max-width:760px){.wk-sub{display:block;font-size:11.5px;margin-top:2px}
  .wkq .t th:nth-child(3),.wkq .t td:nth-child(3),.wkq .t th:nth-child(4),.wkq .t td:nth-child(4){display:none}}
@media (max-width:1200px){.wkpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.wkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.wkpis{grid-template-columns:minmax(0,1fr)}}

/* ===== rename a phase, stage or tab to the house's own wording ============ */
.scrim--bare{background:transparent;backdrop-filter:none;align-items:flex-start;justify-content:flex-start;padding:0}
.renmenu{position:fixed;z-index:90;width:240px;display:flex;flex-direction:column;gap:2px;padding:var(--space-6);
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-12);box-shadow:var(--elevation-3)}
.renmenu__h{display:flex;flex-direction:column;gap:1px;padding:var(--space-8) var(--space-10) var(--space-6);border-bottom:1px solid var(--border-subtle);margin-bottom:var(--space-4);min-width:0}
.renmenu__h .eyebrow{font:500 10.5px/1.4 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
.renmenu__h b{font:500 13.5px/1.35 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.renmenu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:var(--space-8);padding:var(--space-8) var(--space-10);
  border-radius:var(--radius-8);font:400 13.5px/1.35 var(--font-sans);color:var(--text-primary)}
.renmenu button:hover{background:var(--bg-hover)}
.renmenu button:focus-visible{outline:2px solid var(--brand-solid);outline-offset:-2px}
.renmenu button .ico{width:15px;height:15px;color:var(--text-secondary);flex:none}
.modal--sm{width:min(460px,100%)}
.modal--sm .mb{padding-top:var(--space-4)}
/* the group heading is right-clickable too, so it reads as a target */
.modtabs .grp[data-ren]{cursor:context-menu}
.modtabs .grp[data-ren]:focus-visible{outline:2px solid var(--brand-solid);outline-offset:2px;border-radius:var(--radius-6)}

/* ===== Tender intelligence: a pinned readiness rail ======================
   The rail is the readiness story -- gate readiness, the value estimate, the
   fit score, key dates and what we have seen before -- so it stays on screen
   while the left column's tables scroll past it. The left column carries every
   table, one section under another, which keeps it taller than the rail. */
.tbrief .tb-rail{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);
  overflow-y:auto;overscroll-behavior:contain;padding-right:var(--space-4)}
@media (max-width:1100px){.tbrief .tb-rail{position:static;max-height:none;overflow:visible}}

/* A row's edit and delete sat one above the other, because .ibtn is a grid
   box: two of them stacked, and every editable row carried the height of two
   buttons. Side by side, the tables lose that dead band on every row. */
.t td.rowact .ibtn{display:inline-grid;vertical-align:middle}

/* Risk register: the table carries ten columns, so it takes the whole width.
   The heat map and the contingency note ride above it rather than leaving a
   half-empty column down the right of a long table. */
.rk-heatrow{display:flex;gap:var(--space-24);align-items:stretch;flex-wrap:wrap}
.rk-grid{flex:none}
.rk-legend{flex:1;min-width:240px;gap:var(--space-12);justify-content:center}
.rk-legend>p{margin:0}
@media (max-width:820px){.rk-heatrow{flex-direction:column}}

/* ===== Ask Brix: the assistant's way in, on the top bar =================== */
.brixbtn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--space-8);
  height:var(--control-height-sm);padding:0 var(--space-14) 0 var(--space-6);border-radius:var(--radius-full);
  color:#fff;white-space:nowrap;font:500 13px/1.3 var(--font-sans);position:relative;
  background:var(--ai-grad);
  transition:filter .2s ease,box-shadow .2s ease,transform .2s ease}
/* the gradient turns light in dark mode, so the ink turns dark with it */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brixbtn{color:#14180b}}
:root[data-theme="dark"] .brixbtn{color:#14180b}
/* the bloom: the same gradient, blurred, sitting behind the pill */
.brixbtn::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:inherit;
  filter:blur(12px);opacity:.75;z-index:-1;transition:opacity .2s ease,filter .2s ease}
.brixbtn:hover{transform:translateY(-1px);filter:saturate(1.1) brightness(1.05)}
.brixbtn:hover::before{opacity:1;filter:blur(17px)}
.brixbtn:active{transform:none;filter:brightness(.97)}
.brixbtn:active::before{opacity:.7;filter:blur(10px)}
/* out: the pill recedes to a hairline of the same gradient so the panel leads */
.brixbtn.is-on{color:var(--text-primary);border:1px solid transparent;padding:0 var(--space-12) 0 var(--space-4);
  background:var(--ai-wash) padding-box,var(--ai-grad) border-box;transform:none;filter:none}
.brixbtn.is-on::before{opacity:0}
.brixbtn:focus-visible{outline:2px solid var(--brand-solid);outline-offset:3px}
/* the orb rides on a light disc: it is drawn for a light surface */
.brixbtn__ic{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgb(var(--glow-ink) / .18)}
.brixbtn__ic>span{pointer-events:none}
.brixbtn__tx{min-width:0}
@media (prefers-reduced-motion:reduce){.brixbtn{transition:none}.brixbtn:hover{transform:none}}
@media (max-width:760px){.brixbtn__tx{display:none}.brixbtn{padding:0 var(--space-4)}}
/* ===== the roles an account bids in: several, one of them the lead ======= */
.rolelead{display:inline-block;margin-left:var(--space-8);padding:1px var(--space-8);border-radius:var(--radius-full);
  background:var(--brand-soft);color:var(--text-brand);font:500 10.5px/1.6 var(--font-sans);
  letter-spacing:.05em;text-transform:uppercase;vertical-align:1px}
/* the preview panel swaps in place as the pointer moves, so it keeps its height */
.wz-prev{margin-top:var(--space-4)}</style>
