/* ============================================================================
   The app's own variables, aliased onto the system. Nothing here invents a
   colour: every value is a design-system token.
   ========================================================================== */
:root{
  --bg:var(--bg-page); --surface:var(--bg-surface); --surface-2:var(--bg-muted); --surface-3:var(--bg-subtle);
  --ink:var(--text-primary); --ink-2:var(--text-secondary); --muted:var(--text-muted);
  --line:var(--border-default); --line-2:var(--border-subtle);
  --pack:var(--brand-solid); --pack-soft:var(--brand-soft-c); --pack-ink:var(--brand-on-solid);
  --accent:var(--info-fg); --accent-soft:var(--info-bg);
  --brand:var(--warning-fg); --brand-soft-c:var(--warning-bg);
  --ai:var(--text-brand); --ai-soft:var(--brand-softer);
  --ok:var(--success-fg); --ok-soft:var(--success-bg);
  --warn:var(--warning-fg); --warn-soft:var(--warning-bg);
  --bad:var(--danger-fg); --bad-soft:var(--danger-bg);
  --info:var(--info-fg); --info-soft:var(--info-bg);
  --shadow:var(--elevation-1); --shadow-lg:var(--elevation-3);
  --f-display:var(--font-flex); --f-body:var(--font-sans); --f-mono:var(--font-sans);
  --r:var(--radius-control);
  /* CAD model space keeps its drawing ink: these are layer colours, not UI chrome */
  --cad-bg:#fbfcfb; --cad-ink:#1d2b2e; --cad-thin:#7d8d90; --cad-dim:#82572b; --cad-water:#337099;
  --cad-pipe:#22594b; --cad-hatch:#b9c6c7; --cad-ai:#5e6e2a; --cad-fill:#eef3f3; --cad-fill2:#dfe9f3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cad-bg:#f4f6f5; --cad-fill:#e8eeee; --cad-fill2:#dbe6f0;
}}
:root[data-theme="dark"]{--cad-bg:#f4f6f5; --cad-fill:#e8eeee; --cad-fill2:#dbe6f0;}

/* CAD "model space" look: black background, layer colours, as in AutoCAD */
.cad.dark{--cad-bg:#0b0f12;--cad-ink:#e8eef0;--cad-thin:#7f8f96;--cad-dim:#f2b35b;--cad-water:#57a8ff;--cad-pipe:#3fe0b8;--cad-hatch:#3b4a50;--cad-ai:#ff5fc8;--cad-fill:#151c20;--cad-fill2:#13243a}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.1px}
h1{font-size:30px;font-weight:500;line-height:1.12}
h2{font-size:21px;font-weight:500;line-height:1.2}
h3{font-size:15.5px;font-weight:500}
h4{font-size:14px;font-weight:500}
p{margin:0}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#root{min-height:100%}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(360px,1fr) 1.25fr;background:var(--surface)}
.login .lf{display:flex;flex-direction:column;gap:28px;padding:32px max(24px,4vw);max-width:620px;width:100%;justify-self:center}
.login .logo{display:flex;align-items:center;gap:10px}.login .logo .mk{width:34px;height:34px;border-radius:8px;background:var(--pack);color:var(--pack-ink);display:grid;place-items:center}.login .logo .mk .ico{width:19px;height:19px}.login .logo small{display:block;color:var(--muted);font-size:12px}
.login .form{display:flex;flex-direction:column;gap:14px;margin-block:auto}
.login h1{font-size:32px}
.login .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:var(--line)}
.login .demos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.login .demos .eyebrow{grid-column:1/-1}
.login .demo{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-3);cursor:pointer;min-width:0}
.login .demo:hover{border-color:var(--pack)}.login .demo b{font-size:13px}.login .demo span{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login .rt{background:var(--hero);color:var(--hero-ink);padding:56px max(28px,4vw);display:flex;flex-direction:column;justify-content:center;gap:20px}
.login .rt .eb{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--hero-accent)}
.login .rt h2{font-size:clamp(28px,3.4vw,44px);line-height:1.08;max-width:18ch;color:var(--hero-ink)}
.login .rt p{max-width:62ch;opacity:.85;font-size:15px}
.login .facts{display:flex;flex-wrap:wrap;gap:8px}.login .facts span{border:1px solid var(--hero-line);border-radius:999px;padding:4px 12px;font-size:12.5px;font-family:var(--f-mono)}
.lgstages{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-top:8px}
.lgst{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.lgst i{display:block;width:100%;height:4px;border-radius:2px;background:var(--hero-line-soft)}.lgst i.on{background:var(--hero-accent)}
.lgst .lgg{height:18px;font:500 10.5px var(--f-mono);color:var(--hero-accent)}.lgst .lgg:not(:empty){border:1px solid var(--hero-accent);border-radius:4px;padding:1px 4px}
.lgst .lgn{font:500 12px var(--f-mono)}.lgst .lgl{font-size:10.5px;opacity:.8;line-height:1.15;word-break:break-word}
.lgstages.light .lgst i{background:var(--line)}.lgstages.light .lgst i.on{background:var(--pack)}.lgstages.light .lgg{color:var(--brand)}.lgstages.light .lgg:not(:empty){border-color:var(--brand)}
.herosw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;margin-top:12px}.herosw span{opacity:.7;margin-right:4px}
.herosw button{background:transparent;border:1px solid var(--hero-line);color:inherit;border-radius:999px;padding:4px 12px;cursor:pointer}.herosw button.on{background:var(--hero-accent);color:var(--color-brand-900);border-color:var(--hero-accent)}
.login .rt .slide{display:flex;flex-direction:column;gap:20px;animation:lgfade .3s ease}
@keyframes lgfade{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.herosw .hsec{flex-basis:100%;margin:6px 0 0;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.acct{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line-2);margin-top:8px}
@media (max-width:900px){.login{grid-template-columns:1fr}.login .rt{padding:32px 16px}.login .lf{padding:24px 16px}.lgstages{grid-template-columns:repeat(7,1fr);row-gap:10px}.login .demos{grid-template-columns:1fr}}

/* ---------- sector step, factory grid ---------- */
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sec{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;position:relative}
.sec input{position:absolute;opacity:0;pointer-events:none}.sec.on{border-color:var(--pack);box-shadow:0 0 0 2px var(--pack-soft)}.sec.off{opacity:.55;cursor:not-allowed;background:var(--surface-3)}
.sec small{color:var(--ink-2);font-size:12.5px;line-height:1.35}.sec:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.opt.off{opacity:.5}
.facgrid td,.facgrid th{padding:6px 6px}.fcell{display:inline-block;min-width:34px;padding:2px 5px;border-radius:4px;font:500 11.5px var(--f-mono);text-align:center;color:var(--muted)}
.fcell.mid{background:var(--ok-soft);color:var(--ok)}.fcell.hi{background:var(--warn-soft);color:var(--warn)}.fcell.over{background:var(--bad-soft);color:var(--bad);font-weight:600}.fcell.mine{outline:2px solid var(--brand);outline-offset:-1px}
.chip.mk{background:var(--accent-soft);color:var(--accent);align-self:flex-start}

/* ---------- wizard ---------- */
.wz{min-height:100%;display:flex;flex-direction:column;background:var(--surface-3)}
.wz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.wordmark{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.2px}
.wordmark span{color:var(--pack)}
.wz-body{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0}
.wz-steps{background:var(--surface-2);padding:28px 16px;display:flex;flex-direction:column;gap:4px}
.wz-steps button{all:unset;cursor:pointer;padding:11px 14px;border-radius:8px;font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.wz-steps button .n{font-family:var(--f-mono);font-size:11.5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.wz-steps button.done .n{background:var(--pack);color:var(--pack-ink);border-color:var(--pack)}
.wz-steps button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.wz-steps button.on .n{border-color:var(--pack);color:var(--pack)}
.wz-steps .tag{margin-top:auto;padding:14px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.wz-main{padding-block:36px 60px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));min-width:0;background:var(--surface)}
.wz-inner{max-width:900px;display:flex;flex-direction:column;gap:20px}
.wz-eb{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--pack);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--surface);min-width:0}
.opt:hover{border-color:var(--pack)}
.opt input{accent-color:var(--pack);width:16px;height:16px;margin:2px 0 0;flex:none}
.opt.on{background:var(--pack-soft);border-color:color-mix(in srgb,var(--pack) 45%,var(--line))}
.opt b{font-weight:500;font-size:14px;display:block}
.opt small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.opt .gt{margin-left:auto}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grp-h h3{font-size:16px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:500}
.linkbtn:hover{text-decoration:underline}
.sumrow{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.sumrow>span{color:var(--ink-2);font-size:13.5px}
.wz-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line-2);padding-top:18px;margin-top:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px 16px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo .mk{width:34px;height:34px;border-radius:8px;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;flex:none}
.logo b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.1}
.logo small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tenant{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface-3)}
.tenant b{font-size:12.5px}
.tenant span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav h6{margin:10px 8px 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;color:var(--ink-2);font-size:13.5px;min-width:0}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--pack-soft);color:var(--ink);font-weight:500}
.nav button .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:9px;padding:0 6px;color:var(--ink-2)}
.nav button .oid{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.nav button .ot{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:focus-visible{outline:2px solid var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.secure{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--surface-3);font-size:12px;color:var(--ink-2)}
.secure b{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;gap:7px;align-items:center;min-width:0;flex:1;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs button{all:unset;cursor:pointer;color:var(--ink-2)}
.crumbs button:hover{color:var(--accent);text-decoration:underline}
.content{padding-block:20px 90px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:16px}
.banner{font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:5px 22px;border-bottom:1px solid var(--line-2)}

/* ---------- primitives ---------- */
.sub{color:var(--ink-2);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel>.ph .sub{font-size:12.5px}
.panel>.pb{padding:16px}
.panel>.pb.flush{padding:0}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v.ok{color:var(--ok)} .kpi .v.warn{color:var(--warn)} .kpi .v.bad{color:var(--bad)}
.kpi .d{font-size:12px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--pack);border-color:var(--pack);color:var(--pack-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.lg{padding:11px 20px;font-size:15px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.ibtn{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn:disabled{opacity:.3;cursor:default;background:none}
.ibtn.del:hover{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:500;line-height:1.65}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.ai{background:var(--ai-soft);color:var(--ai)} .chip.brand{background:var(--brand-soft-c);color:var(--brand)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.pk{background:var(--pack-soft);color:var(--pack)}
.src{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--accent);background:var(--surface-3);white-space:nowrap;line-height:1.75}
.src:hover{border-color:var(--accent)}
.src:focus-visible{outline:2px solid var(--accent)}
.kbsrc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:0 6px;border-radius:4px;color:var(--ai);background:var(--ai-soft);white-space:nowrap;line-height:1.75}
.tw{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-3);white-space:nowrap}
.t th.num{text-align:right}
.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--surface-3)}
.t td.id{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--ink-2)}
.t tr.grp td{background:var(--surface-2);font-weight:500}
.t tr.hl td{background:var(--pack-soft)}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;min-width:60px}
.bar i{display:block;height:100%;background:var(--pack)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.mut{background:var(--line)}
.note{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-3);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.ai{border-color:transparent;background:var(--ai-soft)}
.note.warn{border-color:transparent;background:var(--warn-soft)}
.note.bad{border-color:transparent;background:var(--bad-soft)}
.note.pk{border-color:transparent;background:var(--pack-soft)}
.note .ico{margin-top:2px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0}
.empty{padding:28px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:20px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 11px;border-radius:16px;font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface-3);border-radius:5px;padding:7px 9px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input[type=range]{accent-color:var(--pack);width:100%}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk input{accent-color:var(--pack);width:16px;height:16px;margin-top:2px;flex:none}
.flag{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.flag:last-child{border-bottom:0}
.flag .sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.flag .sev.high{background:var(--bad)} .flag .sev.medium{background:var(--warn)} .flag .sev.pass{background:var(--ok)} .flag .sev.ai{background:var(--ai)}
.flag .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

/* ---------- overview ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:10px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero .eb{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;opacity:.75}
.hero h2{font-size:28px;color:var(--hero-ink)}
.hero p{opacity:.85;max-width:62ch}
.hero .dl{text-align:right}
.hero .dl b{font-family:var(--f-display);font-size:44px;line-height:1;display:block}

.hero .chip{background:color-mix(in srgb,var(--hero-ink) 14%,transparent);color:var(--hero-ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.entry{display:flex;flex-direction:column;gap:6px;padding:16px;cursor:pointer}
.entry:hover{border-color:var(--pack)}

/* ---------- record header + stage line ---------- */
.oh{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;display:flex;flex-direction:column;gap:12px}
.oh h1{font-size:28px}
.oh .meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--ink-2)}
.oh .meta b{color:var(--ink);font-weight:500}
.stages{display:grid;grid-template-columns:repeat(13,minmax(64px,1fr));gap:6px;overflow-x:auto;padding-top:10px}
.sbtn{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;padding:2px 1px 4px;min-width:0}
.sbtn .ln{height:5px;background:var(--surface-2);border-radius:3px}
.sbtn.done .ln{background:var(--accent)}
.sbtn.cur .ln{background:var(--pack);background:repeating-linear-gradient(90deg,var(--pack) 0 8px,color-mix(in srgb,var(--pack) 45%,transparent) 8px 11px)}
.sbtn span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn.sel span{color:var(--ink);font-weight:500}
.sbtn.sel{outline:1.5px solid var(--bad);outline-offset:2px;border-radius:3px}
.sbtn .gt{position:absolute;right:0;top:-12px;font-family:var(--f-mono);font-size:9.5px;font-weight:500;background:var(--surface);border:1.5px solid var(--brand);color:var(--brand);border-radius:3px;padding:0 3px;z-index:1;line-height:1.35}
.sbtn .gt.ok{background:var(--brand);color:var(--surface)}
.phasebar{display:flex;gap:8px;flex-wrap:wrap}
.phasebar button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:18px;padding:5px 14px;font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.phasebar button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.phasebar button:hover:not(.on){border-color:var(--ink-2)}
.modtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;align-items:center}
.modtabs::-webkit-scrollbar{display:none}
.modtabs button{all:unset;cursor:pointer;padding:10px 12px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.modtabs button:hover{color:var(--ink)}
.modtabs button.on{color:var(--ink);border-bottom-color:var(--pack);font-weight:500}
.modtabs .grp{font-size:10.5px;letter-spacing:.08em;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:0 4px 0 8px;white-space:nowrap}
.modtabs .grp:first-child{margin-left:0}
.modtabs .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.gchip{font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--ok-soft);color:var(--ok);border-radius:3px;padding:0 4px}
.gchip.pend{background:var(--brand-soft-c);color:var(--brand)}
.stagehead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stagehead h2{font-size:24px}
.preview{border:1px dashed var(--brand);background:var(--brand-soft-c);color:var(--brand);border-radius:var(--r);padding:8px 12px;font-size:13px}

/* ---------- documents ---------- */
.cov{height:12px;border-radius:6px;display:flex;overflow:hidden;background:var(--surface-2)}
.cov i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.dtype{width:34px;height:40px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:end center;font-family:var(--f-mono);font-size:9px;font-weight:500;padding-bottom:4px;flex:none;position:relative;background:var(--surface-3)}
.dtype::before{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;background:var(--bg);border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 0 0 3px}
.dtype.pdf{color:var(--bad)} .dtype.dwg{color:var(--info)} .dtype.xls{color:var(--ok)}
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sheetcard{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.sheetcard:hover{border-color:var(--pack)}
.sheetcard:focus-visible{outline:2px solid var(--accent)}
.sheetcard .th{background:var(--cad-bg);border-bottom:1px solid var(--line);aspect-ratio:1400/990;max-width:100%;overflow:hidden}
.sheetcard .th svg{width:100%;height:100%;display:block}
.sheetcard .cap{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}

/* viewer */
.viewer{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:720px;overflow:hidden}
.vside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;max-height:860px}
.vside .vh{padding:10px 12px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.vlist{overflow-y:auto;flex:1;padding:6px}
.vlist button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:5px;font-size:12.5px;color:var(--ink-2);width:calc(100% - 16px)}
.vlist button:hover{background:var(--surface-2)}
.vlist button.on{background:var(--pack-soft);color:var(--ink);font-weight:500}
.vlist button .pg{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:34px}
.vlist .mini{width:100%;aspect-ratio:1400/990;border:1px solid var(--line);border-radius:3px;background:var(--cad-bg);overflow:hidden;display:block}
.vlist .mini svg{width:100%;height:100%;display:block}
.vlist .sheetbtn{flex-direction:column;gap:4px}
.vcenter{display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.vtool{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.vtool .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.vtool .zl{font-family:var(--f-mono);font-size:12px;min-width:46px;text-align:center}
.vtool .ibtn{border:1px solid var(--line)}
.vtool .ibtn.on{background:var(--pack-soft);color:var(--pack);border-color:var(--pack)}
.cadstage{flex:1;position:relative;overflow:hidden;min-height:560px;cursor:grab;background:var(--cad-bg);touch-action:none}
.cadstage.measure{cursor:crosshair}
.cadstage.drag{cursor:grabbing}
.cadstage .cv{position:absolute;left:0;top:0;transform-origin:0 0;width:1400px;height:990px}
.cadstage .cv svg{display:block;width:1400px;height:990px}
.cadhud{position:absolute;left:10px;bottom:10px;font-family:var(--f-mono);font-size:11px;background:var(--bg-inverse);color:#e8f2f2;padding:4px 8px;border-radius:4px;pointer-events:none}
.layers{display:flex;gap:4px;flex-wrap:wrap}
.layers button{all:unset;cursor:pointer;font-size:11.5px;border:1px solid var(--line);border-radius:12px;padding:1px 8px;display:inline-flex;gap:5px;align-items:center;color:var(--ink-2)}
.layers button i{width:9px;height:9px;border-radius:2px;display:inline-block}
.layers button.off{opacity:.45;text-decoration:line-through}
.cad .L-off{display:none}
.vright{border-left:1px solid var(--line);overflow-y:auto;max-height:860px;min-width:0}
.vright .sec{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.ext{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;background:var(--surface)}
.ext.ai{border-color:color-mix(in srgb,var(--ai) 40%,var(--line))}

/* ---------- proposal ---------- */

.sdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);margin-top:5px;flex:none}
.sdot.gen{background:var(--ai);border-color:var(--ai)} .sdot.rev{background:var(--warn);border-color:var(--warn)} .sdot.ok{background:var(--ok);border-color:var(--ok)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}

/* ---------- assistant, overlays ---------- */

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:20px;font-size:13px;z-index:90;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}

@media (min-width:1281px){.viewer{height:min(820px,calc(100vh - 60px));min-height:640px}.vside,.vright{max-height:none;min-height:0}.vcenter{min-height:0}.pagewrap,.sheetx{min-height:0}}

.selbar{position:fixed;z-index:95;display:flex;gap:2px;align-items:center;background:var(--ink);color:var(--surface);border-radius:8px;padding:4px;box-shadow:var(--shadow-lg);font-size:12.5px;flex-wrap:wrap;max-width:calc(100vw - 16px)}

.ptext{font-family:Georgia,serif;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-3)}

form.modal{margin:0}
.pagewrap{justify-content:flex-start}.pagewrap>*{margin-left:auto;margin-right:auto}

/* ---------- v2.1 modules ---------- */
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}

.insight{border-color:color-mix(in srgb,var(--pack) 40%,var(--line))}
.linkrow{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}

.daterow:last-child{border-bottom:0}
.reqtab td{font-size:13px}
.reqtab td:nth-child(2){min-width:190px}
.md{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:11px;font-weight:500}
.ibtn.okb{color:var(--ok);border:1px solid var(--ok-soft)}
.reqdetail{position:sticky;top:70px;align-self:start}
.reqdetail blockquote{margin:0;border-left:3px solid var(--line);padding:6px 12px;background:var(--surface-3);font-family:Georgia,serif;font-size:13.5px}
.heat{display:grid;grid-template-columns:20px repeat(5,1fr);gap:3px;font-size:11px}

.heat .h1{background:var(--ok-soft)} .heat .h2{background:var(--warn-soft)} .heat .h3{background:var(--bad-soft)}

.clar{padding:12px 16px;border-bottom:1px solid var(--line-2);border-left:4px solid var(--brand);display:flex;flex-direction:column;gap:8px}

.threadbox{background:var(--surface-3);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}

.scenbtn.on{border-color:var(--pack);background:var(--pack-soft)}
.benchbar{position:relative;height:14px;border-radius:7px;background:var(--surface-2);margin:6px 0 10px}
.benchbar i{position:absolute;top:0;bottom:0;background:var(--pack-soft);border:1px solid var(--pack);border-radius:7px}
.benchbar b{position:absolute;top:-4px;width:4px;height:22px;background:var(--brand);border-radius:2px}
.card.live{border-color:color-mix(in srgb,var(--pack) 50%,var(--line))}
.clause{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-bottom:1px solid var(--line-2);width:calc(100% - 28px)}

@media (max-width:1280px){.viewer{grid-template-columns:200px minmax(0,1fr)}.vright{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}}
@media (max-width:1199px){.app.asst-on{grid-template-columns:240px minmax(0,1fr)}.app.asst-on .asst{position:fixed;right:0;top:0;bottom:0;width:min(360px,100%);z-index:70;box-shadow:var(--shadow-lg)}}
@media (max-width:1100px){.g4,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr)}.pdraft{grid-template-columns:minmax(0,1fr)}.pidx{position:static;max-height:340px}.opts.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app,.app.asst-on{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  .rail .nav{flex-direction:row;flex-wrap:wrap}.rail .nav h6,.rail .rail-foot,.rail .tenant,.rail .nav.opps{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .content,.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wz-body{grid-template-columns:minmax(0,1fr)}
  .wz-steps{flex-direction:row;overflow-x:auto;padding:10px 16px}.wz-steps .tag{display:none}.wz-steps button{white-space:nowrap}
  .wz-main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
  .wz-top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .opts,.opts.three{grid-template-columns:minmax(0,1fr)}
  .sumrow{grid-template-columns:minmax(0,1fr);gap:6px}
  .hero{grid-template-columns:minmax(0,1fr)}.hero .dl{text-align:left}
  .viewer{grid-template-columns:minmax(0,1fr)}.vside{border-right:0;border-bottom:1px solid var(--line);max-height:220px}
  .paper{padding:26px 20px}
  .hbar .r{grid-template-columns:110px minmax(0,1fr) 50px}
}
@media (max-width:560px){.g4,.tiles{grid-template-columns:minmax(0,1fr)}}

/* ============================================================================
   bidPlan 3.0 design system — component layer.
   The rules above keep the app's structure; these give every control the
   system's shape, type, elevation and focus, per project/README.md:
   pills for controls, softer squares for data, 20px cards, elevation 1-4,
   Google Sans Flex for headings and numbers, Google Sans inside components.
   ========================================================================== */

/* --- type scale ------------------------------------------------------ */
body{font:var(--text-paragraph-p2,400 14px/1.45 var(--font-sans));font-family:var(--font-sans)}
h1,h2,h3,h4{font-family:var(--font-flex);letter-spacing:0}
h1{font:500 28px/36px var(--font-flex)}          /* heading-h1 */
h2{font:600 24px/32px var(--font-flex)}          /* heading-h2 */
h3{font:500 20px/28px var(--font-flex)}          /* heading-h3 */
h4{font:500 16px/24px var(--font-flex)}          /* heading-h4 */
.panel>.ph h3,.modal .mh h2,.doc .dhd h3{font:500 16px/24px var(--font-flex)}  /* card titles */
.eyebrow{font:600 11px/1.25 var(--font-sans);letter-spacing:.08em}
.sub{font:400 14px/1.45 var(--font-sans);color:var(--text-secondary)}
.mono{font-family:var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}

/* --- focus: a 1.5px brand border plus the soft halo ------------------ */
:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px;box-shadow:var(--focus-ring);border-radius:var(--radius-6)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;border-radius:var(--radius-control)}

/* --- icons: Hugeicons stroke rounded, 1.6px on a 24 grid ------------- */
.ico{stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* --- Button: a pill in four types ------------------------------------ */
.btn{height:var(--control-height-md);padding:0 var(--space-20);border-radius:var(--radius-full);
  border:1px solid transparent;background:var(--bg-surface);color:var(--text-primary);
  border-color:var(--border-default);font:500 14px/1.45 var(--font-sans);gap:var(--space-6);
  justify-content:center;transition:background-color .12s ease,box-shadow .12s ease,border-color .12s ease}
.btn:hover:not(:disabled){background:var(--bg-hover);border-color:var(--border-default)}
.btn.pri{background:var(--brand-solid);border-color:transparent;color:var(--brand-on-solid);box-shadow:var(--button-primary-glow)}
.btn.pri:hover:not(:disabled){background:var(--brand-hover);filter:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-brand)}
.btn.ghost:hover:not(:disabled){background:var(--brand-softer)}
.btn.ai{background:var(--brand-softer);border-color:var(--brand-border);color:var(--text-brand)}
.btn.ai:hover:not(:disabled){background:var(--brand-soft)}
.btn.ok{background:var(--success-bg);border-color:transparent;color:var(--success-fg)}
.btn.bad{background:var(--danger-fg);border-color:transparent;color:var(--brand-on-solid);box-shadow:var(--button-danger-glow)}
.btn.bad:hover:not(:disabled){background:var(--danger-hover)}
.btn.sm{height:var(--control-height-sm);padding:0 var(--space-14);font-size:13px}
.btn.lg{height:var(--control-height-lg);padding:0 var(--space-24);font-size:15px;border-radius:var(--radius-full)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn .ico{width:18px;height:18px}

/* --- Icon button: circular ------------------------------------------- */
.ibtn{width:var(--size-32);height:var(--size-32);border-radius:var(--radius-full);color:var(--text-secondary)}
.ibtn:hover{background:var(--bg-hover);color:var(--text-primary)}
.ibtn.okb{color:var(--success-fg);border:1px solid var(--success-bg)}
.vtool .ibtn{width:var(--control-height-md);height:var(--control-height-md);border:1px solid var(--border-default)}
.vtool .ibtn.on{background:var(--brand-soft);color:var(--text-brand);border-color:var(--brand-border)}

/* --- Status pill and label chip -------------------------------------- */
.chip{border-radius:var(--radius-6);padding:3px var(--space-8);font:600 11px/1.25 var(--font-sans);
  background:var(--bg-muted);color:var(--text-secondary);gap:var(--space-4)}
.chip.ok{background:var(--success-bg);color:var(--success-fg)}
.chip.warn{background:var(--warning-bg);color:var(--warning-fg)}
.chip.bad{background:var(--danger-bg);color:var(--danger-fg)}
.chip.info{background:var(--info-bg);color:var(--info-fg)}
.chip.ai,.chip.pk{background:var(--brand-soft);color:var(--text-brand)}
.chip.brand{background:var(--warning-bg);color:var(--warning-fg)}
.chip.acc{background:var(--info-bg);color:var(--info-fg)}
.chip .ico{width:13px;height:13px}
.rtag{border-radius:var(--radius-4);font:600 11px/1.25 var(--font-sans);letter-spacing:0;
  border:1px solid var(--border-subtle);background:var(--bg-subtle);color:var(--text-secondary);padding:2px var(--space-8)}
.ct2{font-family:var(--font-sans);font-variant-numeric:tabular-nums;border-radius:var(--radius-full);
  background:var(--bg-muted);padding:1px var(--space-6)}
.src{border-radius:var(--radius-4);font:400 11px/1.25 var(--font-sans);color:var(--text-brand);
  border-color:var(--brand-border);background:var(--brand-softer);padding:2px var(--space-6)}
.src:hover{border-color:var(--brand-solid);background:var(--brand-soft)}
.kbsrc{border-radius:var(--radius-4);background:var(--brand-softer);color:var(--text-brand);font-family:var(--font-sans)}

/* --- Fields: 8px radius, hover and focus states ---------------------- */
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  border:1px solid var(--border-default);background:var(--bg-surface);border-radius:var(--radius-control);
  padding:9px var(--space-12);font:400 14px/1.45 var(--font-sans);color:var(--text-primary);transition:border-color .12s ease,box-shadow .12s ease}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{outline:none;border:1.5px solid var(--brand-solid);box-shadow:var(--focus-ring)}
input:disabled,select:disabled,textarea:disabled{background:var(--bg-subtle);color:var(--text-muted)}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand-solid)}
input[type=range]{accent-color:var(--brand-solid)}
.fld{font:400 12px/1.28 var(--font-sans);color:var(--text-secondary);gap:var(--space-6)}
.t input.qn,.t select.qs{border-radius:var(--radius-6);padding:4px var(--space-8)}
.login .form input:not([type=checkbox]):not([type=radio]),
.wz-main input:not([type=checkbox]):not([type=radio]),.wz-main select{height:var(--control-height-lg)}

/* --- Card: 20px radius, subtle border, level-1 shadow ---------------- */
.panel,.doc,.viewer{border-radius:var(--radius-card);border-color:var(--border-subtle);box-shadow:var(--elevation-1);background:var(--bg-surface)}
.panel>.ph{padding:var(--space-16) var(--space-20);border-bottom-color:var(--border-subtle)}
.panel>.pb{padding:var(--space-20)}
.card,.mail,.ext,.sheetcard,.icard,.clausetext,.ptext,.threadbox,.takeoffview,.note,.permbar{border-radius:14px;border-color:var(--border-subtle)}
.card,.sheetcard,.icard{box-shadow:var(--elevation-1);background:var(--bg-surface)}
.card:hover,.sheetcard:hover,.icard:hover{border-color:var(--brand-border);box-shadow:var(--elevation-2)}
.icard.on{border-color:var(--success-fg)}
.card.live,.insight{border-color:var(--brand-border)}
.entry:hover{border-color:var(--brand-border)}
.hero,.modal{border-radius:var(--radius-card)}
.drawer{border-radius:var(--radius-card) 0 0 var(--radius-card)}
.modal{box-shadow:var(--elevation-3)}
.mlist{border-radius:var(--radius-16);box-shadow:var(--elevation-2);border-color:var(--border-subtle);padding:var(--space-6)}
.mlist button{border-radius:var(--radius-8);min-height:var(--control-height-md);font:400 14px/1.45 var(--font-sans)}
.mlist button:hover{background:var(--bg-hover)}
.toast{border-radius:var(--radius-12);box-shadow:var(--elevation-3);background:var(--bg-inverse);color:var(--text-inverse);
  font:500 14px/1.45 var(--font-sans);padding:var(--space-12) var(--space-20)}
.scrim{background:color-mix(in srgb,var(--bg-overlay) 36%,transparent);backdrop-filter:blur(2px)}
.selbar{border-radius:var(--radius-12);background:var(--bg-inverse);color:var(--text-inverse);box-shadow:var(--elevation-3)}
.selbar button{border-radius:var(--radius-8)}
.selbar button:hover,.selbar button:focus-visible{background:color-mix(in srgb,var(--text-inverse) 14%,transparent)}

/* --- Banner / note: 12px radius --------------------------------------- */
.note{border-radius:var(--radius-12);padding:var(--space-12) var(--space-16);background:var(--bg-subtle);border-color:var(--border-subtle)}
.note.ai,.note.pk{background:var(--brand-softer);border-color:var(--brand-border)}
.note.warn{background:var(--warning-bg);border-color:transparent;color:var(--warning-fg)}
.note.bad{background:var(--danger-bg);border-color:transparent;color:var(--danger-fg)}
.permbar{border-radius:var(--radius-12);background:var(--bg-subtle);border-color:var(--border-subtle)}
.permbar.ok{background:var(--success-bg);border-color:transparent;color:var(--success-fg)}
.preview{border-radius:var(--radius-12);border-color:var(--warning-fg);background:var(--warning-bg);color:var(--warning-fg)}
.dropzone{border-radius:var(--radius-16);border-color:var(--brand-border);background:var(--brand-softer)}
.dropzone b{color:var(--text-brand)}
.dropzone.over{border-color:var(--brand-solid);box-shadow:var(--focus-ring)}

/* --- Segmented control: raised cell on a subtle track ---------------- */
.seg{background:var(--bg-subtle);border-radius:var(--radius-full);padding:var(--space-4);gap:var(--space-2)}
.seg button{border-radius:var(--radius-full);padding:var(--space-6) var(--space-12);font:500 13px/1.28 var(--font-sans);color:var(--text-secondary)}
.seg button.on{background:var(--bg-surface);color:var(--text-primary);box-shadow:var(--elevation-1)}
.lanes span{border-radius:var(--radius-full);background:var(--bg-muted);color:var(--text-secondary);font:500 11px/1.25 var(--font-sans);padding:3px var(--space-10)}
.lanes span.done{background:var(--success-bg);color:var(--success-fg)}
.lanes span.run{background:var(--brand-soft);color:var(--text-brand)}
.sizes div{background:var(--brand-softer);border-radius:var(--radius-12)}
.sizes small{color:var(--text-brand)}
.sizes b{font:300 28px/36px var(--font-flex)}

/* --- Tabs: underline, brand -------------------------------------------- */
.modtabs button,.subtabs button{font:400 14px/1.45 var(--font-sans);color:var(--text-secondary);padding:var(--space-12) var(--space-14)}
.modtabs button.on,.subtabs button.on{color:var(--text-primary);font-weight:500;border-bottom-color:var(--brand-solid)}
.modtabs,.subtabs{border-bottom-color:var(--border-subtle)}
.modtabs .grp{border-radius:var(--radius-full);border-color:var(--border-subtle);background:var(--bg-subtle);font:600 11px/1.25 var(--font-sans)}
.xtabs button.on{border-top-color:var(--brand-solid)}
.phasebar button{border-radius:var(--radius-full);border-width:1px;border-color:var(--border-default);
  font:500 14px/1.45 var(--font-sans);letter-spacing:0;text-transform:none;padding:var(--space-8) var(--space-18,16px);color:var(--text-secondary)}
.phasebar button.on{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inverse)}
.phasebar button:hover:not(.on){background:var(--bg-hover);border-color:var(--border-strong);color:var(--text-primary)}

/* --- Navigation: floating rail, inverse pill for the active row ------- */
.app{gap:var(--space-10);padding:var(--space-10);background:var(--bg-page)}
.rail{background:var(--bg-surface);border-right:0;border-radius:var(--radius-card);box-shadow:var(--elevation-4);
  height:calc(100vh - var(--space-20));top:var(--space-10);padding:var(--space-16) var(--space-10)}
.main{background:var(--bg-surface);border-radius:var(--radius-card);box-shadow:var(--elevation-1);overflow:clip}
.nav button{border-radius:var(--radius-full);padding:var(--space-8) var(--space-12);font:400 15px/1.45 var(--font-sans);color:var(--text-secondary)}
.nav button:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav button.on{background:var(--bg-inverse);color:var(--text-inverse);font-weight:500}
.nav button.on .ct,.nav button.on .oid{background:color-mix(in srgb,var(--text-inverse) 16%,transparent);color:var(--text-inverse)}
.nav button .ct{border-radius:var(--radius-full);background:var(--bg-muted);font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.nav button .oid{font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.nav h6{font:600 11px/1.25 var(--font-sans);letter-spacing:.08em;color:var(--text-muted)}
.tenant,.secure{border-radius:var(--radius-12);border-color:var(--border-subtle);background:var(--bg-subtle)}
.secure b{color:var(--success-fg)}
.dot{background:var(--success-fg)}
.logo .mk,.login .logo .mk{width:var(--size-48);height:var(--size-48);border-radius:var(--radius-8);
  background:transparent;box-shadow:var(--elevation-4);overflow:hidden;padding:0}
.logo .mk svg,.login .logo .mk svg{width:var(--size-48);height:var(--size-48);display:block}
.logo b{font:500 20px/28px var(--font-flex)}
.logo small{font:400 11px/1.3 var(--font-sans);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo div{min-width:0}
.wordmark{display:inline-flex;align-items:center;color:var(--text-primary)}
.wordmark svg{display:block}
.wordmark span{color:var(--brand-solid)}

/* --- Header: floats, no bar background -------------------------------- */
.top{background:transparent;border-bottom:1px solid var(--border-subtle);padding-block:var(--space-14)}
body::before{background:var(--bg-page)}
.crumbs{font:400 14px/1.45 var(--font-sans);color:var(--text-muted)}
.crumbs b{color:var(--text-primary)}
.crumbs button:hover{color:var(--text-brand)}
.banner{background:var(--bg-subtle);border-bottom-color:var(--border-subtle);font:400 12px/1.28 var(--font-sans)}
.linkbtn,.linkrow:hover span:first-child{color:var(--text-brand)}

/* --- Tables: 44px header cell, 48px rows, subtle group band ----------- */
.t th{background:var(--bg-surface);border-bottom-color:var(--border-subtle);font:500 12px/1.28 var(--font-sans);
  letter-spacing:0;text-transform:none;color:var(--text-muted);padding:var(--space-12) var(--space-12);height:44px}
.t td{padding:10px var(--space-12);border-bottom-color:var(--border-subtle);font:400 14px/1.45 var(--font-sans)}
.t tr.click:hover td{background:var(--bg-hover)}
.t tr.grp td{background:var(--bg-subtle)}
.t tr.hl td{background:var(--bg-selected)}
.t td.id{font-family:var(--font-sans);font-variant-numeric:tabular-nums;color:var(--text-muted)}
.t tr.newrow td{animation:newrow 2.4s ease}
@keyframes newrow{0%{background:var(--brand-softer)}100%{background:transparent}}
.permtab .me{background:var(--brand-soft)}
.xl th{background:var(--bg-subtle);border-color:var(--border-subtle);font-family:var(--font-sans);color:var(--text-muted)}
.xl td{border-color:var(--border-subtle)}
.xl td.rn{background:var(--bg-subtle);font-family:var(--font-sans)}
.xl td.n{font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.xl td.flag-c{background:var(--warning-bg)}
.xl td.bad-c{background:var(--danger-bg)}

/* --- Numbers and progress --------------------------------------------- */
.kpi .v{font:500 28px/1.2 var(--font-flex);letter-spacing:-.01em}
.kpi .v.ok{color:var(--success-fg)} .kpi .v.warn{color:var(--warning-fg)} .kpi .v.bad{color:var(--danger-fg)}
.kpi .d{font:400 12px/1.28 var(--font-sans);color:var(--text-secondary)}
.bar,.cov,.benchbar{height:6px;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.bar i{background:var(--brand-solid)}
.bar i.ok{background:var(--success-fg)} .bar i.warn{background:var(--warning-fg)}
.bar i.bad{background:var(--danger-fg)} .bar i.mut{background:var(--border-default)}
.benchbar{height:10px;border-radius:var(--radius-full);overflow:visible}
.benchbar i{background:var(--brand-soft);border-color:var(--brand-solid);border-radius:var(--radius-full)}
.benchbar b{background:var(--warning-fg);border-radius:var(--radius-full);height:18px;top:-4px}
.md{border-radius:var(--radius-full);background:var(--avatar-bg);color:var(--avatar-ink);
  font:600 11px/1.25 var(--font-sans);width:var(--size-24);height:var(--size-24)}
.heat>div{border-radius:var(--radius-6);font-family:var(--font-sans)}
.heat .h1{background:var(--success-bg)} .heat .h2{background:var(--warning-bg)} .heat .h3{background:var(--danger-bg)}
.fcell{border-radius:var(--radius-4);font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.fcell.mid{background:var(--success-bg);color:var(--success-fg)}
.fcell.hi{background:var(--warning-bg);color:var(--warning-fg)}
.fcell.over{background:var(--danger-bg);color:var(--danger-fg)}
.fcell.mine{outline-color:var(--brand-solid)}
.gantt i.base{background:var(--text-secondary)} .gantt i.fc{background:var(--brand-solid)}

/* --- Stage line and gates ---------------------------------------------- */
.sbtn .ln{height:6px;border-radius:var(--radius-full);background:var(--bg-muted)}
.sbtn.done .ln{background:var(--info-fg)}
.sbtn.cur .ln{background:repeating-linear-gradient(90deg,var(--brand-solid) 0 8px,color-mix(in srgb,var(--brand-solid) 40%,transparent) 8px 11px)}
.sbtn span{font:400 11px/1.25 var(--font-sans);color:var(--text-muted)}
.sbtn.sel span{color:var(--text-primary);font-weight:600}
.sbtn.sel{outline-color:var(--brand-solid);border-radius:var(--radius-6)}
.sbtn .gt{font:600 10px/1.35 var(--font-sans);border-radius:var(--radius-4);border-width:1.5px;
  border-color:var(--warning-fg);color:var(--warning-fg);background:var(--bg-surface)}
.sbtn .gt.ok{background:var(--warning-fg);color:var(--bg-surface)}
.gchip{font-family:var(--font-sans);border-radius:var(--radius-4);background:var(--success-bg);color:var(--success-fg)}
.gchip.pend{background:var(--warning-bg);color:var(--warning-fg)}
/* a gate the tender moved past without sign-off */
.sbtn .gt.byp{border-color:var(--error-fg);color:var(--error-fg);background:var(--error-bg)}
.gchip.byp{background:var(--error-bg);color:var(--error-fg)}
.oh{border-radius:var(--radius-card);border-color:var(--border-subtle);box-shadow:var(--elevation-1);padding:var(--space-20)}

/* --- AI surfaces are olive, never a second accent --------------------- */
.msg.a{background:var(--brand-softer);border:1px solid var(--brand-border);border-radius:var(--radius-12)}
.msg.u{background:var(--bg-muted);border-radius:var(--radius-12)}
.asst .af input{border-radius:var(--radius-full);height:var(--control-height-md)}
.sugg button{border-radius:var(--radius-full);border-color:var(--border-default);color:var(--text-secondary);
  font:400 13px/1.28 var(--font-sans);min-height:var(--control-height-sm)}
.sugg button:hover{border-color:var(--brand-solid);color:var(--text-brand);background:var(--brand-softer)}
.dpara.proposed{background:var(--brand-softer);border-radius:var(--radius-8)}
.sdot.gen{background:var(--brand-solid);border-color:var(--brand-solid)}
.sdot.rev{background:var(--warning-fg);border-color:var(--warning-fg)}
.sdot.ok{background:var(--success-fg);border-color:var(--success-fg)}
.envelope{border-color:var(--warning-fg)}

/* --- Lists, rows, option cards ---------------------------------------- */
.opt,.sec,.scenbtn{border-radius:var(--radius-control);border-color:var(--border-default)}
