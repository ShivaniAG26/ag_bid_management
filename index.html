.kx-crumbs button:hover{background:var(--bg-hover);color:var(--text-primary)}
.kx-crumbs button.on{color:var(--text-primary);font-weight:500}
.kx-search{display:flex;align-items:center;gap:7px;height:36px;width:clamp(132px,13vw,210px);padding:0 var(--space-12);
  border:1px solid var(--border-default);border-radius:var(--radius-full);background:var(--bg-subtle);color:var(--text-muted)}
.kx-search:focus-within{border-color:var(--brand-solid);background:var(--bg-surface);box-shadow:var(--focus-ring)}
.kx-search .ico{width:16px;height:16px;flex:none}
.kx-search input{all:unset;flex:1;min-width:0;font:400 13px/1.4 var(--font-sans);color:var(--text-primary)}

/* folders row */
.kx-folders{display:flex;gap:var(--space-8);flex-wrap:wrap;padding:var(--space-12) var(--space-14);border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.kx-folder{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;min-width:0;
  padding:var(--space-8) var(--space-14) var(--space-8) var(--space-10);border:1px solid var(--border-subtle);
  border-radius:var(--radius-full);background:var(--bg-surface);font-size:13px}
.kx-folder:hover{border-color:var(--brand-border);background:var(--brand-softer)}
.kx-folder .ico{width:16px;height:16px;color:var(--text-brand)}
.kx-folder b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-folder em{font-style:normal;font-size:11px;color:var(--text-muted)}

/* file marks and rows */
.kx-mark{position:relative;display:grid;place-items:center;width:28px;height:34px;flex:none;border-radius:var(--radius-4);
  background:color-mix(in srgb,var(--kc) 12%,var(--bg-surface));border:1px solid color-mix(in srgb,var(--kc) 34%,transparent)}
.kx-mark::before{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;background:var(--bg-page);
  border-left:1px solid color-mix(in srgb,var(--kc) 34%,transparent);border-bottom:1px solid color-mix(in srgb,var(--kc) 34%,transparent);border-radius:0 0 0 3px}
.kx-mark i{font:600 8px/1 var(--font-sans);font-style:normal;color:var(--kc);margin-top:8px}
.kx-mark.is-lg{width:42px;height:50px;border-radius:var(--radius-6)}
.kx-mark.is-lg i{font-size:10.5px;margin-top:11px}
.kx-table td{vertical-align:middle;position:relative}
.kx-ncell{display:flex;align-items:center;gap:var(--space-10);min-width:0}
.kx-ntx{display:flex;flex-direction:column;min-width:0}
.kx-ntx b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-ntx span{font-size:11.5px;color:var(--text-muted)}
.kx-lk{display:inline-flex;vertical-align:-2px;margin-left:4px}
.kx-lk .ico,.kx-lk svg{width:12px;height:12px;color:var(--warning-fg)}
.kx-path span{font-size:12.5px;color:var(--text-secondary);display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-acts{white-space:nowrap;text-align:right;width:1%}
/* at narrow widths the folder and date give way; the file operations never do */
@media (max-width:1560px){.kx-table .kx-when{display:none}}
.kx-table td,.kx-table th{padding-left:var(--space-8);padding-right:var(--space-8)}
.kx-table{table-layout:fixed;width:100%}
.kx-table td:first-child,.kx-table th:first-child{width:auto;overflow:hidden}
.kx-ncell{min-width:0}
.kx-ntx,.kx-ntx b,.kx-ntx span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-ia{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:var(--radius-full);color:var(--text-muted)}
.kx-ia:hover{background:var(--bg-hover);color:var(--text-primary)}
.kx-ia:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px}
.kx-ia.on{color:var(--warning-fg);background:var(--warning-bg)}
.kx-ia .ico,.kx-ia svg{width:15px;height:15px}
tr:not(:hover) .kx-ia{opacity:.55}
tr:hover .kx-ia{opacity:1}
.kx-menu{position:absolute;right:var(--space-12);top:calc(100% - 6px);z-index:40;min-width:190px;display:flex;flex-direction:column;
  padding:var(--space-4);border-radius:var(--radius-12);background:var(--bg-surface);border:1px solid var(--border-subtle);box-shadow:var(--elevation-3);text-align:left}
.kx-menu button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:9px;padding:var(--space-8) var(--space-10);
  border-radius:var(--radius-8);font:400 13px/1.3 var(--font-sans);color:var(--text-primary)}
.kx-menu button:hover{background:var(--bg-hover)}
.kx-menu button.is-bad{color:var(--danger-fg)}
.kx-menu .ico,.kx-menu svg{width:15px;height:15px;flex:none;color:var(--text-muted)}
.kx-menu button.is-bad .ico,.kx-menu button.is-bad svg{color:var(--danger-fg)}
/* the right-click menu */
.kx-ctxwrap{position:fixed;inset:0;z-index:80}
.kx-menu.is-ctx{position:fixed;right:auto;top:auto;min-width:216px;box-shadow:var(--elevation-4)}
.kx-ctxh{display:flex;align-items:center;gap:8px;padding:var(--space-8) var(--space-10) var(--space-10);min-width:0;
  border-bottom:1px solid var(--border-subtle);margin-bottom:var(--space-4)}
.kx-ctxh b{font:500 12.5px/1.35 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-menu hr{border:0;border-top:1px solid var(--border-subtle);margin:var(--space-4) 0;width:100%}
/* a file being read says so, in the row and on its button */
.kx-ia.is-busy{color:var(--text-brand);background:var(--brand-softer)}
.kx-ia.is-busy .ico,.kx-ia.is-busy svg{animation:kxPulse 1.1s ease-in-out infinite}
@keyframes kxPulse{50%{opacity:.4}}
.kx-tr{font-style:normal;color:var(--text-brand)}
tr.is-learning .kx-mark{box-shadow:0 0 0 2px color-mix(in srgb,var(--ai-teal) 40%,transparent)}

/* indexing queue (inside its own dialog) */
.kx-queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.kx-queue li{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-10) 0;border-bottom:1px solid var(--border-subtle)}
.kx-queue li:last-child{border-bottom:0}
.kx-qtx{flex:1;min-width:0;display:flex;flex-direction:column}
.kx-qtx b{font:500 13px/1.35 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-qtx span{font-size:12px;color:var(--text-secondary)}
.kx-qbar{flex:none;width:120px;height:6px;border-radius:var(--radius-full);background:var(--bg-subtle);overflow:hidden}
.kx-qbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--ai-lime),var(--ai-teal));transition:width .6s ease}

/* connect + scan */
.kx-pick{display:flex;flex-direction:column;gap:var(--space-6)}
.kx-pk{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:var(--space-12);
  padding:var(--space-10) var(--space-12);border:1px solid var(--border-subtle);border-radius:var(--radius-12)}
.kx-pk:hover{border-color:var(--brand-solid);background:var(--brand-softer)}
.kx-pktx{display:flex;flex-direction:column;flex:1;min-width:0}
.kx-pktx b{font:500 14px/1.3 var(--font-sans)}
.kx-pktx small{font-size:12px;color:var(--text-muted)}
.kx-pkgo{color:var(--text-brand);flex:none}
.kx-scan{display:flex;gap:var(--space-20);align-items:center;padding:var(--space-10) 0}
.kx-scan ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-10);flex:1}
.kx-scan li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-muted)}
.kx-scan li i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-default);flex:none}
.kx-scan li.now{color:var(--text-primary)}
.kx-scan li.now i{border-color:var(--ai-teal);border-top-color:transparent;animation:lvSpin .8s linear infinite}
.kx-scan li.done{color:var(--text-secondary)}
.kx-scan li .ico{width:15px;height:15px;color:var(--success-fg)}
.kx-scan li em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-muted)}
.kx-scanok{display:flex;gap:var(--space-16);align-items:center}
.kx-scanok b{font:500 16px/1.4 var(--font-flex,var(--font-sans))}
.kx-found{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.kx-found li{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)}
.kx-found li:last-child{border-bottom:0}
.kx-found li>div{flex:1;min-width:0;display:flex;flex-direction:column}
.kx-found b{font:500 13px/1.35 var(--font-sans)}
.kx-found span{font-size:11.5px;color:var(--text-muted)}

/* bulk upload */
.kx-upmodal{width:min(760px,100%)}
.kx-from{display:flex;flex-direction:column;gap:var(--space-8)}
.kx-fromrow{display:flex;gap:var(--space-6);flex-wrap:wrap}
.kx-fb{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;
  padding:var(--space-8) var(--space-14);border:1px solid var(--border-subtle);border-radius:var(--radius-full);font-size:13px;color:var(--text-secondary)}
.kx-fb:hover{border-color:var(--border-strong);color:var(--text-primary)}
.kx-fb.on{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inverse);font-weight:500}
.kx-fb .ico{width:15px;height:15px}
.kx-fb em{font-style:normal;font-size:11px;opacity:.7}
.kx-browse{display:flex;flex-direction:column;gap:var(--space-8)}
.kx-uplist{display:flex;flex-direction:column;gap:var(--space-8)}
.kx-uplist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-6);max-height:280px;overflow-y:auto}
.kx-uplist li{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-8);border:1px solid var(--border-subtle);border-radius:var(--radius-8)}
.kx-utx{flex:1;min-width:0;display:flex;flex-direction:column}
.kx-utx b{font:500 13px/1.35 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-utx span{font-size:11.5px;color:var(--text-muted)}
.kx-udest{flex:none;width:260px;display:flex;flex-direction:column;gap:2px}
.kx-udest small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.kx-udest select{height:32px;padding:0 var(--space-8);font-size:12.5px}
.kx-udest em{font-style:normal;font-size:11px;color:var(--text-brand)}

/* player */
.kx-player{display:flex;flex-direction:column;gap:var(--space-8)}
.kx-stage{position:relative;border-radius:var(--radius-12);overflow:hidden;background:var(--bg-inverse);aspect-ratio:16/9;display:grid;place-items:center}
.kx-poster{display:block;width:100%;height:100%}
.kx-wave{display:flex;align-items:center;gap:3px;height:60%;padding:0 var(--space-16);width:100%}
.kx-wave i{flex:1;background:linear-gradient(180deg,var(--ai-lime),var(--ai-teal));border-radius:var(--radius-full);opacity:.85}
.kx-big{all:unset;cursor:pointer;position:absolute;width:62px;height:62px;border-radius:50%;background:rgb(255 255 255 / .92);
  display:grid;place-items:center;color:var(--brand-solid)}
.kx-big:hover{background:#fff;transform:scale(1.05)}
.kx-big .kx-tri{border-left-width:16px;border-top-width:10px;border-bottom-width:10px;margin-left:5px}
.kx-cap{position:absolute;left:0;right:0;bottom:0;padding:var(--space-12);font:400 13px/1.5 var(--font-sans);color:#fff;
  background:linear-gradient(transparent,rgb(0 0 0 / .76))}
.kx-cap .sub{color:rgb(255 255 255 / .75)}
.kx-capt{display:inline-block;margin-right:7px;padding:1px 7px;border-radius:var(--radius-4);background:rgb(255 255 255 / .22);
  font:500 11px/1.5 var(--font-sans);font-variant-numeric:tabular-nums}
.kx-player.is-sm .kx-cap{font-size:12px;padding:var(--space-8)}
.kx-ctl{display:flex;align-items:center;gap:var(--space-8)}
.kx-play{all:unset;cursor:pointer;flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
  background:var(--brand-solid);color:var(--brand-on-solid)}
.kx-tri{width:0;height:0;border-left:10px solid currentColor;border-top:6.5px solid transparent;border-bottom:6.5px solid transparent;margin-left:3px}
.kx-pause{width:10px;height:11px;border-left:3px solid currentColor;border-right:3px solid currentColor}
.kx-time{font-size:11.5px;color:var(--text-muted);flex:none;min-width:36px}
.kx-track{position:relative;flex:1;height:7px;border-radius:var(--radius-full);background:var(--bg-muted);cursor:pointer}
.kx-fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--brand-solid)}
.kx-pin{all:unset;cursor:pointer;position:absolute;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;
  background:var(--bg-surface);border:2px solid var(--ai-teal);display:grid;place-items:center}
.kx-pin span{font:600 7.5px/1 var(--font-sans);color:var(--text-primary)}
.kx-pin:hover,.kx-pin.on{background:var(--ai-teal);transform:translate(-50%,-50%) scale(1.2)}
.kx-marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto}
.kx-marks button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:var(--space-10);width:100%;
  padding:var(--space-8) var(--space-10);border-radius:var(--radius-8);font:400 13px/1.5 var(--font-sans);color:var(--text-secondary)}
.kx-marks button:hover{background:var(--bg-hover);color:var(--text-primary)}
.kx-marks li.on button{background:var(--brand-softer);color:var(--text-primary)}
.kx-mt{flex:none;font:500 11.5px/1.5 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--text-brand);min-width:36px}

/* document facsimile */
.kx-modal{width:min(840px,100%)}
.kx-paperwrap{background:var(--bg-subtle);border-radius:var(--radius-12);padding:var(--space-20);max-height:420px;overflow-y:auto}
.kx-paper{background:#fdfdfb;color:#1f2a2c;max-width:620px;margin:0 auto;padding:var(--space-32);
  box-shadow:0 1px 6px rgb(0 0 0 / .12);font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.65}
.kx-paper h4{font-family:Georgia,serif;font-size:16px;margin:0 0 12px;color:#1f2a2c}
.kx-paper p{margin:0 0 10px}
.kx-phd,.kx-pft{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-sans);font-size:10.5px;color:#6b7678}
.kx-phd{border-bottom:1px solid #d8dddd;padding-bottom:6px;margin-bottom:14px}
.kx-pft{border-top:1px solid #d8dddd;padding-top:6px;margin-top:18px}
.kx-paper table{border-collapse:collapse;width:100%;font-family:var(--font-sans);font-size:11.5px;margin:10px 0}
.kx-paper td,.kx-paper th{border:1px solid #c8cfd0;padding:4px 7px;text-align:left}
.kx-paper th{background:#eef1f1}
.kx-noprev{display:flex;gap:var(--space-16);align-items:center;padding:var(--space-20);background:var(--bg-subtle);border-radius:var(--radius-12)}
.kx-sec{display:flex;flex-direction:column;gap:var(--space-6)}
.kx-vals{display:flex;flex-wrap:wrap;gap:var(--space-8)}
.kx-val{display:flex;flex-direction:column;gap:1px;padding:var(--space-8) var(--space-12);border-radius:var(--radius-8);
  background:var(--bg-subtle);font:500 13px/1.35 var(--font-sans)}
.kx-val small{font:400 11px/1.3 var(--font-sans);color:var(--text-muted)}

/* Knowledge AI */
/* the drawer itself */
.kx-ai{position:fixed;top:var(--space-12);right:var(--space-12);bottom:var(--space-12);width:436px;z-index:70;
  display:flex;flex-direction:column;min-height:0;background:var(--bg-surface);
  border:1px solid color-mix(in srgb,var(--ai-teal) 34%,var(--border-default));border-radius:var(--radius-card);
  box-shadow:0 1px 2px rgb(16 24 8 / .07),0 24px 60px -18px rgb(16 24 8 / .30),0 40px 90px -40px rgb(16 24 8 / .34),
    0 22px 56px -28px color-mix(in srgb,var(--ai-teal) 50%,transparent);
  overflow:hidden;animation:kxIn .26s cubic-bezier(.2,.8,.3,1)}
@keyframes kxIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@media (max-width:1240px){.kx-ai{left:var(--space-12);width:auto}}
@media (prefers-reduced-motion:reduce){.kx-ai{animation:none}.kx-shell{transition:none}}
.kx-askbtn{gap:7px}
.kx-askbtn .kx-orb{display:inline-grid;place-items:center;width:18px;height:18px;flex:none}
.kx-aih{background:var(--ai-wash);border-bottom-color:color-mix(in srgb,var(--ai-teal) 22%,var(--border-subtle))}
.kx-aih>div{flex:1;min-width:0;display:flex;flex-direction:column}
.kx-aih b{font:500 14px/1.3 var(--font-sans)}
.kx-aih span{font-size:11.5px;color:var(--text-secondary)}
.kx-aib{flex:1;overflow-y:auto;padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-14);min-height:0}
.kx-hello p{margin:0;font-size:13px;line-height:1.55;color:var(--text-secondary)}
.kx-m{max-width:96%;font-size:13.5px;line-height:1.55}
.kx-m.is-me{align-self:flex-end;padding:var(--space-8) var(--space-14);border-radius:16px 16px 5px 16px;
  background:var(--brand-solid);color:var(--brand-on-solid)}
.kx-m.is-ai{align-self:stretch;display:flex;flex-direction:column;gap:var(--space-10)}
.kx-a{padding:var(--space-10) var(--space-14);border-radius:16px 16px 16px 5px;background:var(--ai-wash);
  border:1px solid color-mix(in srgb,var(--ai-teal) 20%,var(--border-subtle))}
.kx-cite{border:1px solid var(--border-subtle);border-radius:var(--radius-12);padding:var(--space-10);display:flex;flex-direction:column;gap:var(--space-8)}
.kx-crow{display:flex;align-items:center;gap:var(--space-10);min-width:0}
.kx-ctx{display:flex;flex-direction:column;min-width:0}
.kx-ctx b{font:500 13px/1.35 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-ctx>span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);min-width:0}
.kx-ctx .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-chits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.kx-chits button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:var(--space-8);width:100%;padding:var(--space-6) var(--space-8);
  border-radius:var(--radius-6);font:400 12.5px/1.5 var(--font-sans);color:var(--text-secondary);background:var(--bg-subtle)}
.kx-chits button:hover{background:var(--brand-softer);color:var(--text-primary)}
.kx-cact{display:flex;gap:var(--space-6);flex-wrap:wrap}
.kx-think{display:flex;gap:var(--space-10);align-items:flex-start;padding:var(--space-10) var(--space-12);border-radius:14px;
  background:var(--ai-wash);border:1px solid color-mix(in srgb,var(--ai-teal) 20%,var(--border-subtle))}
.kx-think ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.kx-think li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.kx-think li .ico{width:13px;height:13px;color:var(--success-fg)}
.kx-think li i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border-default);flex:none}
.kx-think li.now{color:var(--text-primary)}
.kx-think li.now i{border-color:var(--ai-teal);border-top-color:transparent;animation:lvSpin .8s linear infinite}
.kx-sug{display:flex;flex-wrap:wrap;gap:var(--space-6);align-items:flex-start;margin-top:auto;padding-top:var(--space-8)}
.kx-sug button{all:unset;cursor:pointer;box-sizing:border-box;max-width:100%;padding:var(--space-8) var(--space-12);
  border-radius:var(--radius-full);border:1px solid var(--border-subtle);font:400 12.5px/1.4 var(--font-sans);color:var(--text-secondary)}
.kx-sug button:hover{border-color:var(--ai-teal);background:var(--ai-wash);color:var(--text-primary)}
.kx-aif{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-10) var(--space-12);
  border-top:1px solid var(--border-subtle);background:var(--bg-surface)}
.kx-aif input{flex:1;min-width:0;height:36px;border-radius:var(--radius-full);font-size:13px}
.kx-go{all:unset;cursor:pointer;flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  background:var(--ai-grad);color:var(--ai-grad-ink)}
.kx-go:disabled{opacity:.5;cursor:default}
.kx-go .ico{width:17px;height:17px}

/* ---------- charts: drawn here as SVG, no third-party library ---------- */
.bpch{display:block;overflow:visible;font-family:var(--font-sans)}
.bpch text{paint-order:stroke}
.bpch-sl{animation:bpchIn .42s cubic-bezier(.2,.8,.3,1) both}
.bpch-sl:hover{opacity:.82}
.bpch-still .bpch-sl{animation:none}
@keyframes bpchIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bpch-sl{animation:none}}
.anh-key li i{width:8px;height:8px;border-radius:3px;flex:none}
.anh-key li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anh-key li b{margin-left:auto;font-weight:500;color:var(--text-primary);white-space:nowrap}
.anh-card{gap:var(--space-6);justify-content:flex-start}
.anh-card .v{font:500 28px/1.15 var(--font-flex);letter-spacing:-.015em;color:var(--text-primary);margin-bottom:auto}
.anh-card .d{font-size:12.5px;color:var(--text-muted);line-height:1.45}
.anh-card.ok .v{color:var(--success-fg)}
.anh-card.warn .v{color:var(--warning-hover)}
.anh-card.tint{position:relative;overflow:hidden;background:var(--bg-surface);
  border-color:color-mix(in srgb,var(--ai-teal) 34%,var(--border-subtle))}
.anh-card.tint::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ai-teal)}
.anh-card.warn.tint{border-color:color-mix(in srgb,var(--danger-fg) 32%,var(--border-subtle))}
.anh-card.warn.tint::before{background:var(--danger-fg)}
.anh-card.warn.tint .v{color:var(--danger-fg)}
.anh-rail{height:5px;border-radius:var(--radius-full);background:var(--border-subtle);overflow:hidden;margin:2px 0}
.anh-rail i{display:block;height:100%;border-radius:inherit;background:var(--success-fg)}
@media (max-width:1180px){.anh{grid-template-columns:repeat(2,minmax(0,1fr))}.anh-lead{grid-column:1/-1}}
@media (max-width:620px){.anh{grid-template-columns:minmax(0,1fr)}}

/* ---------- the ask bar sits above the page, not on it ----------
   The lifting is done entirely from outside: a layered neutral shadow, then two
   tinted ones putting olive on one side and teal on the other. Inside the pill
   is plain white, so the field reads as a field and not as a decorated surface. */
.lv-bar{height:58px;background:#fff;
  border:1px solid color-mix(in srgb,var(--ai-teal) 14%,var(--border-subtle));
  box-shadow:
    0 1px 2px rgb(16 24 8 / .07),
    0 10px 20px -10px rgb(16 24 8 / .16),
    0 30px 60px -22px rgb(16 24 8 / .30),
    0 50px 90px -45px rgb(16 24 8 / .36),
    0 18px 44px -20px color-mix(in srgb,var(--brand-solid) 72%,transparent),
    0 22px 52px -22px color-mix(in srgb,var(--ai-teal) 70%,transparent)}
.lv-bar::before{content:none}
.lv-bar:focus-within{box-shadow:
    0 1px 2px rgb(16 24 8 / .07),
    0 12px 24px -10px rgb(16 24 8 / .18),
    0 34px 68px -22px rgb(16 24 8 / .34),
    0 54px 96px -45px rgb(16 24 8 / .38),
    0 22px 56px -24px color-mix(in srgb,var(--brand-solid) 72%,transparent),
    0 26px 64px -26px color-mix(in srgb,var(--ai-teal) 70%,transparent)}
/* while it is thinking the beam rides the rim, clipped off the white middle */
.lv-bar>.lv-rim{padding:2px;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.lv-panel{background:#fff;
  box-shadow:0 1px 2px rgb(16 24 8 / .06),0 12px 26px -12px rgb(16 24 8 / .16),0 34px 70px -24px rgb(16 24 8 / .32),0 24px 60px -30px color-mix(in srgb,var(--ai-teal) 45%,transparent)}
.lv-head{background:#fff;border-bottom-color:var(--border-subtle)}
.lv-body{background:#fff}
.lv-m.is-ai,.lv-think{background:#fff;border-color:var(--border-subtle)}
.lv-hello{background:#fff}

/* ---------- one globe for every piece of AI processing ----------
   Searching, classifying, pricing, answering: they all show the same rotating
   ring, so "the machine is working" looks like one thing across the app. */
.aiglobe{display:inline-grid!important;place-items:center;width:14px;height:14px;flex:none;
  color:var(--ai-teal)!important;background:none!important;animation:none!important}
.aiglobe svg{width:100%;height:100%;animation:aiSpin 1.5s linear infinite;transform-origin:50% 50%}
.aiglobe circle{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1.6 4.8}
.aiwait{display:block;width:12px;height:12px;flex:none;border-radius:50%;
  border:1.5px solid var(--border-default);opacity:.7}
@keyframes aiSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.aiglobe svg{animation-duration:4s}}
/* the step lists each drew their own dot; they all defer to the globe now */
.lv-think li i,.kb-stp i,.hm-steps span i{display:none}
.lv-think li .aiglobe,.kb-stp .aiglobe{width:14px;height:14px}
.kb-stp.done .aiwait{display:none}
.lv-think li.done .aiwait,.kx-think li.done .aiwait{display:none}

/* ============================================================================
   Reports & analytics: the interactive chart, the AI cards, the fixes
   ========================================================================== */
@property --anbm{syntax:'<angle>';initial-value:0deg;inherits:false}

/* --- the chart's own interaction: a slice lifts, names itself, isolates --- */
.anchart{position:relative}
.bpch-hit{cursor:pointer;transition:transform .16s cubic-bezier(.2,.8,.3,1),opacity .18s}
.bpch-hit:focus{outline:none}
.bpch-hit:focus-visible path{stroke:var(--text-primary);stroke-width:3}
.bpch-sl.is-dim{opacity:.22}
.bpch-mid{pointer-events:none}
.bpch-tip{position:absolute;z-index:4;pointer-events:none;opacity:0;
  transform:translate(-50%,-100%) scale(.95);transform-origin:50% 100%;
  transition:opacity .12s ease,transform .12s cubic-bezier(.2,.8,.3,1);
  background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;
  box-shadow:var(--elevation-2);padding:6px 10px;display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.bpch-tip.is-on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bpch-tip b{font:500 12.5px/1.3 var(--font-sans);color:var(--text-primary)}
.bpch-tip span{font:400 11.5px/1.3 var(--font-sans);color:var(--text-secondary);font-variant-numeric:tabular-nums}

/* --- the legend is a control, so it looks like one --- */
.an-lg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:var(--radius-full);border:1px solid transparent;
  font:400 12.5px/1.4 var(--font-sans);color:var(--text-secondary)}
.an-lg:hover{background:var(--bg-hover);color:var(--text-primary)}
.an-lg:focus-visible{outline:2px solid var(--brand-solid);outline-offset:1px}
.an-lg.is-on{border-color:var(--border-strong);background:var(--bg-subtle);color:var(--text-primary);font-weight:500}
.an-lg i{width:9px;height:9px;border-radius:2px;flex:none}
.an-lg b{font-weight:500;color:var(--text-primary);font-variant-numeric:tabular-nums}

/* --- a card the AI wrote: the beam travels its own edge --- */
.an-beam{position:relative;isolation:isolate}
.an-bm{position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--anbm),transparent 0 58%,
    color-mix(in srgb,var(--ai-lime) 70%,transparent) 68%,var(--ai-teal) 80%,
    var(--ai-sky) 88%,color-mix(in srgb,var(--ai-lav) 60%,transparent) 94%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:anBeam 5.4s linear infinite}
@keyframes anBeam{to{--anbm:360deg}}
@media (prefers-reduced-motion:reduce){.an-bm{animation:none;--anbm:300deg}}
.an-beam>.ph{align-items:flex-start}
.an-beam>.ph h3{margin:0}
.an-pill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;
  border-radius:var(--radius-full);background:var(--ai-grad);color:var(--ai-grad-ink);
  font:500 11px/1.4 var(--font-sans);letter-spacing:.04em;text-transform:uppercase}
.an-pill svg{width:12px;height:12px}
.an-pill.lg{font-size:12px;padding:5px 11px 5px 9px}
.an-pill.lg svg{width:14px;height:14px}
.an-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--border-subtle);background:var(--bg-subtle);
  border-radius:0 0 var(--r) var(--r)}
.an-foot>.sub{font-size:12.5px}

/* --- what the finding looks like: one claim, one line of evidence --- */
.an-why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.an-why li{display:flex;gap:11px;align-items:flex-start}
.an-why p{margin:0;font:400 13.5px/1.5 var(--font-sans);color:var(--text-primary)}
.an-why p b{font-weight:500}
.an-why span.an-wd{flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;
  background:var(--ai-teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--ai-teal) 18%,transparent)}
.an-why .an-wd.is-mute{background:var(--border-strong);box-shadow:none}
.an-why li>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.an-why li>div>span{font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)}
.an-under{color:var(--success-fg)}

/* --- the re-price ladder: every row says where its figure came from --- */
.an-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;
  border:1px solid var(--border-subtle);border-radius:var(--radius-12);overflow:hidden}
.an-steps li{display:grid;grid-template-columns:1fr auto;grid-template-areas:"k v" "e e";
  gap:2px 14px;padding:11px var(--space-14);border-bottom:1px solid var(--border-subtle)}
.an-steps li:last-child{border-bottom:0}
.an-steps li>span{grid-area:k;font:400 13.5px/1.4 var(--font-sans);color:var(--text-primary)}
.an-steps li>b{grid-area:v;font:500 15px/1.3 var(--font-flex);color:var(--text-primary);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.an-steps li>em{grid-area:e;font:400 12px/1.5 var(--font-sans);font-style:normal;color:var(--text-muted)}
.an-steps li.is-sum{background:var(--bg-subtle)}
.an-steps li.is-ask{background:var(--bg-surface);
  border-top:1px solid color-mix(in srgb,var(--ai-teal) 34%,var(--border-subtle))}
.an-steps li.is-ask>b{font-size:19px;color:color-mix(in srgb,var(--ai-teal) 76%,var(--text-primary))}

.an-infl,.an-comp{display:flex;flex-direction:column;gap:8px}
.an-infl ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.an-infl li{display:grid;grid-template-columns:1fr auto;gap:1px 12px}
.an-infl li b{font:400 13px/1.4 var(--font-sans);font-weight:500;color:var(--text-primary)}
.an-infl li em{font-style:normal;font:500 13px/1.4 var(--font-sans);color:var(--warning-hover);
  font-variant-numeric:tabular-nums;text-align:right}
.an-infl li span{grid-column:1/-1;font:400 12px/1.45 var(--font-sans);color:var(--text-muted)}
.an-comp p{margin:0;font:400 13.5px/1.55 var(--font-sans);color:var(--text-primary)}
.an-comp p.sub{font-size:12.5px;color:var(--text-muted)}

/* --- a rule the page set, shown on the card that proposed it --- */
.an-rule{display:flex;align-items:center;gap:11px;flex-wrap:wrap;width:100%;min-width:0}
.an-rule>svg{flex:none;width:16px;height:16px;color:var(--success-fg)}
.an-rule>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.an-rule b{font:500 13px/1.4 var(--font-sans)}
.an-rule span{font:400 12.5px/1.45 var(--font-sans);color:var(--text-muted)}

/* --- the insight row and the fixes behind it --- */
.an-fct{font:400 12px/1.4 var(--font-sans);color:var(--text-muted);
  display:inline-flex;align-items:center;gap:5px;padding:0 4px;white-space:nowrap}
.an-fct.done{color:var(--success-fg)}
.an-fct svg{width:13px;height:13px}
.an-fix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.an-fix li{display:flex;align-items:flex-start;gap:14px;padding:var(--space-12) var(--space-14);
  border:1px solid var(--border-subtle);border-radius:var(--radius-12);background:var(--bg-subtle)}
.an-fxb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.an-fxb b{font:500 13.5px/1.4 var(--font-sans)}
.an-fxb .sub{font-size:12.5px}
.an-fxb p{margin:2px 0 0;font:400 13px/1.55 var(--font-sans);color:var(--text-primary)}
.an-fix li>.btn{flex:none;margin-top:2px}
.an-done{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.an-done li{display:flex;gap:8px;align-items:flex-start;font:400 13px/1.5 var(--font-sans);color:var(--text-secondary)}
.an-done svg{flex:none;width:14px;height:14px;margin-top:3px;color:var(--success-fg)}
.modal.lg{width:min(780px,100%);overflow:hidden}
.modal.lg>.mh,.modal.lg>.mf{flex:none}
.modal.lg>.mb{overflow-y:auto;min-height:0}
@media (max-width:620px){
  .an-fix li{flex-wrap:wrap}
  .an-fix li>.btn{width:100%;justify-content:center}
  .an-steps li>b{font-size:14px}
}

/* --- the film on the sign-in screen, and the A/B/C switch under it --- */
.lgfilm{margin:0;display:flex;flex-direction:column;gap:var(--space-10);
  width:100%;max-width:min(460px,44vh)}
.lgfilm__stage{position:relative;aspect-ratio:1;border-radius:var(--radius-card);overflow:hidden;
  background:var(--bg-subtle);border:1px solid var(--border-subtle);box-shadow:var(--elevation-3)}
.lgfilm__v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lgfilm__bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;
  background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--radius-12);box-shadow:var(--elevation-1)}
.lgfilm__bar button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;
  padding:7px 10px;border-radius:var(--radius-8);color:var(--text-secondary)}
.lgfilm__bar button:hover{background:var(--bg-hover);color:var(--text-primary)}
.lgfilm__bar button:focus-visible{outline:2px solid var(--brand-solid);outline-offset:-2px}
.lgfilm__bar button.on{background:var(--brand-solid);color:var(--brand-on-solid)}
.lgfilm__bar b{font:500 10.5px/1.3 var(--font-sans);letter-spacing:.1em;opacity:.72}
.lgfilm__bar span{font:500 12.5px/1.35 var(--font-sans);color:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgfilm__bar em{font-style:normal;font:400 10.5px/1.3 var(--font-sans);opacity:.66;font-variant-numeric:tabular-nums}
@media (max-height:760px){.lgfilm{max-width:min(380px,40vh)}}

/* the donut panel grows with the card beside it, instead of leaving a hole */
.grid.g2{align-items:start}
.grid.g2 .anchart{height:218px}
.an-beam .hbar{margin-top:2px}
.an-beam .eyebrow{display:block}

/* --- sign-in: the film is the right-hand half, covering it completely --- */
.login.auth .auth__aside{position:relative;display:block;padding:0;overflow:hidden;
  background:var(--film-bg,#5C6D2E);border-left:1px solid var(--border-subtle);transition:background .35s ease}
.auth__film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
/* A B C, nothing more */
.auth__aside .lgfilm__bar{position:absolute;z-index:2;bottom:max(var(--space-20),2vw);left:max(var(--space-20),2vw);
  display:flex;gap:2px;width:auto;padding:3px;border-radius:var(--radius-full);
  background:rgba(16,20,12,.34);border:1px solid rgba(255,255,255,.2);box-shadow:none;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.auth__aside .lgfilm__bar button{all:unset;cursor:pointer;display:grid;place-items:center;
  width:30px;height:30px;border-radius:var(--radius-full);
  font:500 12px/1 var(--font-sans);letter-spacing:.04em;color:rgba(255,255,255,.76)}
.auth__aside .lgfilm__bar button:hover{background:rgba(255,255,255,.16);color:#fff}
.auth__aside .lgfilm__bar button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.auth__aside .lgfilm__bar button.on{background:#fff;color:#1b2113}
.auth__aside.is-light .lgfilm__bar{background:rgba(255,255,255,.6);border-color:rgba(27,33,19,.14)}
.auth__aside.is-light .lgfilm__bar button{color:#4b5441}
.auth__aside.is-light .lgfilm__bar button:hover{background:rgba(27,33,19,.08);color:#1b2113}
.auth__aside.is-light .lgfilm__bar button:focus-visible{outline-color:var(--brand-solid)}
.auth__aside.is-light .lgfilm__bar button.on{background:var(--brand-solid);color:var(--brand-on-solid)}

/* --- the assistant as a chip: one line, and a modal behind it --- */
.an-sug{all:unset;cursor:pointer;box-sizing:border-box;flex:none;
  display:flex;align-items:center;gap:10px;max-width:min(340px,100%);
  padding:7px 10px 7px 8px;border-radius:var(--radius-full);
  border:1px solid color-mix(in srgb,var(--ai-teal) 30%,var(--border-subtle));
  background:var(--bg-surface);
  transition:border-color .16s,background .16s,box-shadow .16s}
.an-sug:hover{background:var(--bg-hover);
  border-color:color-mix(in srgb,var(--ai-teal) 52%,var(--border-subtle));box-shadow:var(--elevation-1)}
.an-sug:focus-visible{outline:2px solid var(--brand-solid);outline-offset:2px}
.an-sugo{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--radius-full);
  background:var(--ai-grad);color:var(--ai-grad-ink)}
.an-sugo svg{width:13px;height:13px}
.an-sugb{min-width:0;display:flex;flex-direction:column;gap:0}
.an-sugb b{font:500 12.5px/1.35 var(--font-sans);color:var(--text-primary)}
.an-sugb span{font:400 11.5px/1.35 var(--font-sans);color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-sugc{flex:none;display:grid;place-items:center;color:var(--text-muted)}
.an-sugc svg{width:14px;height:14px}
.an-sug.is-pending{border-color:color-mix(in srgb,var(--warning-fg) 50%,var(--border-subtle));
  background:color-mix(in srgb,var(--warning-bg) 70%,var(--bg-surface))}
.an-sug.is-approved{border-color:color-mix(in srgb,var(--success-fg) 46%,var(--border-subtle));
  background:color-mix(in srgb,var(--success-bg) 70%,var(--bg-surface))}
.an-sug.is-sentback{border-color:color-mix(in srgb,var(--error-fg) 46%,var(--border-subtle))}
.an-mf{justify-content:flex-start;flex-wrap:wrap;gap:10px}
.an-mf>.sub{font-size:12.5px;flex:1;min-width:140px}

/* the price-approval trail inside the reading */
.an-appr{display:flex;flex-direction:column;gap:8px;padding:var(--space-14) var(--space-16);
  border:1px solid var(--border-subtle);border-radius:var(--radius-12);background:var(--bg-subtle)}
.an-appr ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.an-appr li{display:flex;align-items:flex-start;gap:10px}
.an-appr li>svg{flex:none;width:15px;height:15px;margin-top:2px;color:var(--success-fg)}
.an-appr li.is-bad>svg{color:var(--error-fg)}
.an-appr li>i{flex:none;width:11px;height:11px;margin-top:4px;border-radius:50%;
  border:1.5px dashed var(--border-strong);display:block}
.an-appr li>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.an-appr li b{font:500 13px/1.4 var(--font-sans)}
.an-appr li span{font:400 12px/1.4 var(--font-sans);color:var(--text-muted)}
.an-appr li.is-wait b{color:var(--text-secondary);font-weight:400}

/* --- headline figures: every card on the same baselines --- */
.panel>.ph>div:first-child{flex:1 1 150px;min-width:0}
.panel>.ph .an-sug{margin-left:auto;max-width:300px}
.anh-card{gap:var(--space-4);justify-content:flex-start}
.anh-card .v{margin-bottom:0;font-size:26px}
.anh-card .d{margin-top:auto}
.anh-lead{gap:var(--space-10)}
.anh-fig .v{font-size:30px}
.anh-key{display:flex;flex-wrap:wrap;gap:4px var(--space-14)}
.anh-key li{flex:0 0 auto;padding-right:0}
.anh-key li b{margin-left:5px}
.anh-rail{margin:4px 0 2px}

/* ============================================================================
   Glow palette, tuned to the olive
   ----------------------------------------------------------------------------
   The old AI set was a candy rainbow — mint, sky, lavender — chosen before the
   brand was olive. Against #5e6e2a the mint reads as a second, disagreeing
   green and the sky reads cold. Everything here pulls the same five stops down
   in chroma and round toward the warm side of the wheel, so the AI surfaces
   look like they belong to this brand rather than to a stock gradient.

   Three colours carry every glow:
     core  the olive itself, tight under the element
     warm  brass, its near neighbour, spreading wider
     cool  a muted plum — olive's actual complement — far out and faint, for
           depth. Used quietly; loud, it would be the mint problem again.
   ========================================================================== */
:root,:root[data-theme="light"]{
  --ai-teal:#6f9e8a;          /* was #6bc7ab mint */
  --ai-sky:#7e9cb4;           /* was #94bfdb */
  --ai-lav:#9087bd;           /* was #a99be8 */
  --ai-ochre:#c9a257;         /* was #d9b46a */
  --glow-core:#5e6e2a;
  --glow-warm:#c08f3f;
  --glow-cool:#6f6394;
  --glow-ink:22 26 12;
  /* the voice wave ships magenta; rotate it into the olive/brass family */
  --voice-hue-base:130deg;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glow-core:#bed45b; --glow-warm:#d9b46a; --glow-cool:#a99be8; --glow-ink:0 0 0;
}}
:root[data-theme="dark"]{
  --glow-core:#bed45b; --glow-warm:#d9b46a; --glow-cool:#a99be8; --glow-ink:0 0 0;
}

/* --- the ask bar: olive close in, brass spreading, plum far and faint --- */
.lv-bar{border-color:color-mix(in srgb,var(--glow-core) 18%,var(--border-subtle));
  box-shadow:
    0 1px 2px rgb(var(--glow-ink) / .08),
    0 10px 20px -10px rgb(var(--glow-ink) / .18),
    0 28px 56px -24px rgb(var(--glow-ink) / .26),
    0 3px 22px -4px color-mix(in srgb,var(--glow-core) 62%,transparent),
    0 8px 44px -8px color-mix(in srgb,var(--glow-warm) 54%,transparent),
    0 0 78px -10px color-mix(in srgb,var(--glow-cool) 40%,transparent)}
.lv-bar:focus-within{box-shadow:
    0 1px 2px rgb(var(--glow-ink) / .08),
    0 12px 24px -10px rgb(var(--glow-ink) / .2),
    0 32px 64px -24px rgb(var(--glow-ink) / .3),
    0 4px 30px -4px color-mix(in srgb,var(--glow-core) 58%,transparent),
    0 10px 54px -8px color-mix(in srgb,var(--glow-warm) 50%,transparent),
    0 0 88px -10px color-mix(in srgb,var(--glow-cool) 42%,transparent)}
.lv-bar.is-voice{background:#fff;
  border-color:color-mix(in srgb,var(--glow-warm) 30%,var(--border-subtle));
  box-shadow:
    0 1px 2px rgb(var(--glow-ink) / .08),
    0 14px 28px -12px rgb(var(--glow-ink) / .2),
    0 4px 30px -6px color-mix(in srgb,var(--glow-warm) 56%,transparent),
    0 10px 52px -10px color-mix(in srgb,var(--glow-core) 46%,transparent),
    0 0 84px -12px color-mix(in srgb,var(--glow-cool) 40%,transparent)}
.lv-stop{background:var(--glow-core)}
.lv-stop i{background:#fff}

/* --- the conversation: the same halo, quieter --- */
.lv-panel{border-color:color-mix(in srgb,var(--glow-core) 18%,var(--border-subtle));
  box-shadow:
    0 1px 2px rgb(var(--glow-ink) / .06),
    0 12px 26px -12px rgb(var(--glow-ink) / .16),
    0 32px 66px -26px rgb(var(--glow-ink) / .26),
    0 20px 54px -26px color-mix(in srgb,var(--glow-core) 46%,transparent),
    0 34px 78px -34px color-mix(in srgb,var(--glow-warm) 42%,transparent)}
.lv-head{border-bottom-color:color-mix(in srgb,var(--glow-core) 12%,var(--border-subtle))}
.lv-m.is-ai,.lv-think{border-color:color-mix(in srgb,var(--glow-core) 16%,var(--border-subtle))}
.lv-chip:hover{border-color:color-mix(in srgb,var(--glow-core) 42%,var(--border-default))}

/* --- the border beam: one warm light travelling the edge, not a rainbow --- */
.an-bm{background:conic-gradient(from var(--anbm),
  transparent 0 54%,
  color-mix(in srgb,var(--ai-lime) 80%,transparent) 65%,
  var(--glow-warm) 75%,
  color-mix(in srgb,var(--glow-core) 92%,transparent) 84%,
  color-mix(in srgb,var(--glow-cool) 62%,transparent) 92%,
  transparent 100%)}

/* --- the advice chip picks up the same olive --- */
.an-sug{border-color:color-mix(in srgb,var(--glow-core) 24%,var(--border-subtle));
  background:color-mix(in srgb,var(--glow-core) 5%,var(--bg-surface))}
.an-sug:hover{background:color-mix(in srgb,var(--glow-core) 10%,var(--bg-surface));
  border-color:color-mix(in srgb,var(--glow-core) 44%,var(--border-subtle));
  box-shadow:0 8px 22px -12px color-mix(in srgb,var(--glow-core) 60%,transparent)}

/* --- the knowledge drawer sits in the same light --- */
.kx-ai{box-shadow:
    0 1px 2px rgb(var(--glow-ink) / .06),
    0 18px 44px -20px rgb(var(--glow-ink) / .24),
    0 26px 64px -30px color-mix(in srgb,var(--glow-core) 48%,transparent),
    0 38px 84px -38px color-mix(in srgb,var(--glow-warm) 44%,transparent)}

/* ===== The intelligence layer (28 Oct 2026) =====
   AI sits inside the work instead of above it: a small spark marks anything it read
   or suggested, a hint line sits under the value it is about, suggested rows carry a
   gradient edge in the same table as the real ones, and reasoning opens beneath its
   row. Side cards drop the gradient wash and keep a thin gradient rule on top. ===== */
.panel.aip{border-color:var(--border-subtle)}
.panel.aip::before{inset:0 0 auto 0;height:2px;padding:0;border-radius:var(--radius-card) var(--radius-card) 0 0;-webkit-mask:none;mask:none}
.panel.aip>.ph{background:none}
.aimk{display:inline-flex;align-items:center;justify-content:center;flex:none;width:15px;height:15px;border-radius:50%;
  background:var(--ai-mark);color:#14180b;margin-right:6px;vertical-align:-3px}
.aimk .ico,.aimk svg{width:9px;height:9px}
.aihint{display:flex;align-items:flex-start;margin-top:5px;font-size:12.5px;line-height:1.45;color:var(--text-secondary);text-align:left}
.aihint>.aimk{margin-top:1px}
.aihint.inl{display:inline-flex;align-items:center;margin-top:0;vertical-align:middle}
.aihint.inl>.aimk{margin-top:0}
.aihint b{color:var(--text-primary);font-weight:600}
.aihint.warnt>span{color:var(--warning-fg,var(--text-primary))}
.aihint.badt>span,.aihint.badt b{color:var(--bad)}
.aihint .linkbtn,.aitile .linkbtn{font-size:12.5px;margin-left:2px}
.num .aihint{justify-content:flex-end}
/* suggested rows: in the table, edged in the gradient, waiting for a person */
:root{--ai-row:color-mix(in srgb,#6bc7ab 9%,var(--bg-surface))}
.t tr.aiprop>td{background:var(--ai-row)}
.t tr.aiprop>td:first-child{background:linear-gradient(180deg,#bed45b,#6bc7ab 55%,#94bfdb) left/3px 100% no-repeat,var(--ai-row)}
.t tr.aiprop:hover>td{filter:brightness(.985)}
/* reasoning that opens beneath its row */
.t tr.aiexp>td{padding:0;background:var(--bg-subtle)}
.aiexp-in{padding:12px 16px 14px;border-left:3px solid #6bc7ab}
.t.mini{font-size:12.5px;background:var(--bg-surface)}
.t.mini th,.t.mini td{padding:6px 10px}
.t.mini tr.hl td{background:var(--bg-selected)}
/* brief tiles: the page each value was read from */
.aitile{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;margin-top:5px;font:12px/1.4 var(--font-sans);color:var(--text-secondary)}
.aitile>.aimk{margin-right:0}
.aitile.conflict{color:var(--warning-fg,var(--text-primary))}
.aimkr{display:inline-block;font:600 9.5px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:4px;
  background:var(--ai-row);color:var(--text-secondary);margin-left:4px;vertical-align:1px;cursor:help}
/* ask the pack: a toolbar of the document register */
.aiask{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface)}
.aiask .aians{padding:10px 12px;background:var(--bg-subtle);border-radius:var(--radius-input,8px)}
.aiask .aisug{margin:0}
/* addenda impacts: recorded lines, then proposed ones */
.aiimp{margin:0;padding-left:16px}
.aiimp li{margin:2px 0}
.aiimp li.prop{list-style:none;margin-left:-16px;display:flex;align-items:flex-start;color:var(--text-secondary)}
.aiimp li.prop>.aimk{margin-top:2px}
.aifoot{padding:10px 16px 12px;border-top:1px solid var(--border-subtle)}
.aifoot .aihint{margin-top:0}
/* estimate evidence */
.aiev{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
.aiev>.aimk{margin-right:0}
.aiev:hover .sub{color:var(--text-primary);text-decoration:underline}
.aiev-bar{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--bg-muted);overflow:hidden}
.aiev-bar i{display:block;height:100%;border-radius:3px}
.aiev-bar i.ok{background:var(--ok)}.aiev-bar i.warn{background:var(--warn)}.aiev-bar i.bad{background:var(--bad)}
.aicft td{vertical-align:top}
.aicft td:first-child{white-space:nowrap}
.aigap td.num .sub{white-space:normal;min-width:150px;max-width:200px;margin-left:auto;text-align:right}
.aigap td.dec{min-width:290px}
.aigap td.dec .row{flex-wrap:nowrap}
.adprev{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--radius-input,8px);background:var(--ai-row);border-left:3px solid #6bc7ab}
.adprev .aiimp{margin-top:2px}
/* The section "..." wrapper in the proposal draft: a relative anchor, not the
   account dropdown card. Both once used .menu, so the account's absolute 296px
   panel leaked into the draft as a floating empty box. */
.secmenu{position:relative;flex:none}

/* ===== Proposal draft: the block editor =====================================
   Each block carries its own controls in the left margin, the way a document
   editor does: hover to reveal, click + to insert, ⋯ to move or delete. Text
   is edited in place; a drawing or a record table is drawn from the record. */
.edb{position:relative;padding:1px 0 1px 0}
.edb+.edb{margin-top:10px}
.edb-ctl{position:absolute;left:-54px;top:0;display:flex;gap:1px;opacity:0;transition:opacity .12s}
.edb:hover .edb-ctl,.edb:focus-within .edb-ctl,.edb-ctl:focus-within{opacity:1}
.edb-ctl .ibtn{width:22px;height:22px}
.edb-ctl .ibtn .ico{width:14px;height:14px}
.mlist.edblk{left:0;right:auto;top:26px;min-width:140px}
.edadd{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:12px;padding:6px 8px;
  border-radius:var(--radius-8);color:var(--text-muted);font:400 13px/1 var(--font-sans);opacity:.55}
.edadd:hover{opacity:1;background:var(--bg-hover);color:var(--text-primary)}
.edadd .ico{width:14px;height:14px}
[data-ph]:empty::before{content:attr(data-ph);color:var(--text-muted);pointer-events:none}
.dpara[contenteditable=true],.edh[contenteditable=true],.edq[contenteditable=true],
.edcall[contenteditable=true],.edlist[contenteditable=true]{outline:0;border-radius:var(--radius-8)}
.dpara[contenteditable=true]:focus,.edh[contenteditable=true]:focus,.edq[contenteditable=true]:focus,
.edcall[contenteditable=true]:focus,.edlist[contenteditable=true]:focus{outline:0;box-shadow:0 0 0 2px var(--brand-softer)}
.edh{font:600 15.5px/1.4 var(--font-sans);margin:4px 0 0}
.edq{margin:0;padding:4px 0 4px 14px;border-left:3px solid var(--border-strong);font-size:14px;line-height:1.65;color:var(--text-secondary)}
.edcall{padding:10px 14px;border-radius:var(--radius-8);background:var(--bg-subtle);border-left:3px solid var(--brand-solid);font-size:14px;line-height:1.6}
.edlist{margin:0;padding-left:22px;font-size:14px;line-height:1.7;max-width:78ch}
.edlist li{margin:2px 0}
.eddiv{border:0;border-top:1px solid var(--border-subtle);margin:16px 0}
.edtbl th,.edtbl td{min-width:70px}
.edtbl th[contenteditable=true]:focus,.edtbl td[contenteditable=true]:focus{outline:2px solid var(--brand-solid);outline-offset:-2px}
.edfig{margin:0;display:flex;flex-direction:column;gap:6px}
.edfig figcaption{font:400 12.5px/1.45 var(--font-sans);color:var(--text-muted)}
.edsrc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.edimg{max-width:100%;border-radius:var(--radius-8);display:block}
.edwg{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-8);padding:8px;overflow:auto}
.edwg svg{max-width:100%;height:auto}
.edrop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px;cursor:pointer;
  border:1px dashed var(--border-strong);border-radius:var(--radius-8);background:var(--bg-subtle);color:var(--text-secondary)}
.edrop:hover{background:var(--bg-hover)}
.edrop b{font:500 13.5px/1.3 var(--font-sans);color:var(--text-primary)}
.edrop .ico{width:18px;height:18px}
/* the formatting bar over a selection */
.edbar{position:fixed;z-index:120;display:flex;gap:2px;padding:4px;border-radius:var(--radius-8);
  background:var(--bg-inverse);box-shadow:var(--elevation-2)}
.edbar button{all:unset;cursor:pointer;display:grid;place-items:center;width:28px;height:28px;border-radius:5px;
  color:var(--text-inverse);font:400 13px/1 var(--font-sans)}
.edbar button:hover{background:rgba(255,255,255,.16)}
/* the insert menu */
.edpop{position:fixed;z-index:120;width:330px;max-height:390px;display:flex;flex-direction:column;
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-16);
  box-shadow:var(--elevation-2);overflow:hidden}
.edpop-q{margin:8px;width:calc(100% - 16px);flex:none}
.edpop-l{overflow-y:auto;padding:0 6px 6px}
.edpop-g{font:600 10.5px/1.25 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);padding:8px 8px 4px}
.edpop-l button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:7px 9px;
  border-radius:var(--radius-8);width:calc(100% - 18px)}
.edpop-l button:hover{background:var(--bg-hover)}
.edpop-l button b{font:500 13.5px/1.35 var(--font-sans)}
.edpop-l button .sub{font-size:12px}
@media (max-width:900px){.edb-ctl{left:-30px}}

/* ===== The document side sheet ==============================================
   A citation opens the document beside the work rather than navigating to it.
   Wider than the knowledge drawer because a page has to be readable. */
.docsheet{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:86;display:flex;flex-direction:column;
  background:var(--bg-surface);box-shadow:var(--elevation-2);border-radius:var(--radius-card) 0 0 var(--radius-card)}
.ds-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:14px 16px 12px;border-bottom:1px solid var(--border-subtle)}
.ds-h h3{font:500 16px/1.3 var(--font-sans);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-t{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border-subtle)}
.ds-t button{all:unset;cursor:pointer;padding:7px 12px 9px;font:400 13.5px/1 var(--font-sans);color:var(--text-secondary);border-bottom:2px solid transparent}
.ds-t button:hover{color:var(--text-primary)}
.ds-t button.on{color:var(--text-primary);font-weight:500;border-bottom-color:var(--brand-solid)}
.ds-b{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ds-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--border-subtle);background:var(--bg-subtle)}
.ds-nav{display:flex;align-items:center;gap:8px}
.ds-sp{flex:1}
.ds-paper{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-8);padding:20px 22px;font-size:13.5px;line-height:1.6}
.ds-paper h4{font:600 14.5px/1.35 var(--font-sans);margin:0 0 8px}
.ds-paper p{margin:0 0 9px}
.ds-paper mark{background:var(--brand-softer);padding:1px 2px;border-radius:3px}
.ds-paper mark.bad{background:var(--bad-soft)}
.ds-paper table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.ds-paper th,.ds-paper td{border:1px solid var(--border-subtle);padding:4px 7px;text-align:left}
.ds-dwg{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-8);padding:8px;overflow:auto}
.ds-dwg svg{max-width:100%;height:auto}
.ds-pages{display:flex;gap:4px;flex-wrap:wrap}
.ds-pages button{all:unset;cursor:pointer;padding:4px 9px;border-radius:var(--radius-full);border:1px solid var(--border-subtle);
  font:400 12px/1.5 var(--font-mono,var(--font-sans));color:var(--text-secondary)}
.ds-pages button.on{background:var(--bg-inverse);color:var(--text-inverse);border-color:transparent}
.ds-rec{display:flex;flex-direction:column;gap:6px}
.ds-recr{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:var(--radius-8);
  border:1px solid var(--border-subtle);background:var(--bg-surface);font-size:13px;line-height:1.45}
.ds-recr:hover{background:var(--bg-hover)}
.ds-ans{display:flex;flex-direction:column;gap:8px}
.ds-hit{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:var(--radius-8);
  background:var(--bg-subtle);font-size:13px;line-height:1.55}
.ds-hit:hover{background:var(--bg-hover)}
@media (max-width:760px){.docsheet{width:100%;border-radius:0}}
.ds-why{font:400 11.5px/1.4 var(--font-sans);color:var(--text-muted)}

/* ===== The sheet's chat dock ================================================
   The conversation sits at the foot of the sheet and stays there whichever tab
   is open, so the document never leaves the screen while you ask about it. */
.ds-chat{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 14px 12px;
  border-top:1px solid var(--border-subtle);background:var(--bg-subtle)}
.ds-thread{display:flex;flex-direction:column;gap:10px;max-height:min(42vh,340px);overflow-y:auto;padding:2px 2px 4px}
.ds-m{display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.55}
.ds-m.you{align-self:flex-end;max-width:82%;background:var(--bg-inverse);color:var(--text-inverse);
  padding:8px 12px;border-radius:14px 14px 3px 14px}
.ds-m.ai{align-self:flex-start;max-width:94%}
.ds-m-h{display:flex;align-items:flex-start;gap:2px}
.ds-m.ai .ds-hit{background:var(--bg-surface);border:1px solid var(--border-subtle)}
.ds-sug{margin:0}
.ds-chat .lv-bar{height:52px;width:100%}
.ds-chat .lv-orbbtn{display:grid;place-items:center;width:28px;height:28px;flex:none}
.ds-m-h{align-items:center}
.ds-m-h .lv-orb{margin-right:6px}
.ds-chat .lv-in{font-size:13.5px}
.ds-think{display:flex;align-items:center;gap:var(--space-8);align-self:flex-start;
  padding:6px 12px 6px 6px;border-radius:var(--radius-full);background:var(--ai-wash);
  font:400 12.5px/1.4 var(--font-sans);color:var(--text-secondary)}
.ds-note{font:400 11.5px/1.4 var(--font-sans);color:var(--text-muted);text-align:center}


/* --- the sheet's chat dock: white, like the rest of the sheet --- */
.ds-chat{background:#fff;border-top-color:var(--border-subtle)}
.ds-think{background:#fff;border:1px solid var(--border-subtle)}
/* the composer sits inside a squared panel, so it takes a squared-off radius
   rather than the floating assistant's full pill */
.ds-chat .lv-bar{border-radius:var(--radius-16,16px);height:50px}
.ds-chat .lv-bar>.lv-rim,.ds-chat .lv-bar::before{border-radius:inherit}
.ds-chat .lv-bar.is-voice{border-radius:var(--radius-16,16px)}

/* --- the running step reads as text, not as a selection ---
   The travelling highlight looked like someone had dragged over the words. */
.lv-think li.now span:not(.aiglobe):not(.aiwait){background:none;-webkit-background-clip:border-box;
  background-clip:border-box;color:var(--text-primary);animation:none}

/* ===== The assistant, closed =================================================
   At rest the assistant is a button at the right edge. Pressing it grows the bar
   out of the button towards the left, which is where the bar then lives. The
   button is the same orb the bar wears, so the thing you press is the thing that
   arrives. ========================================================== */
/* the bar unfurls from the button's corner */
.lvd.is-grow{animation:lv-grow .34s cubic-bezier(.2,.85,.25,1) both;transform-origin:100% 100%}
.lvd.is-grow.is-placed{transform-origin:0 100%}
@keyframes lv-grow{
  from{opacity:0;transform:translate(10px,10px) scale(.72)}
  60%{opacity:1}
  to{opacity:1;transform:none}}
.lv-close{margin-left:2px}
.lv-close .ico{width:17px;height:17px}
@media (prefers-reduced-motion:reduce){.lvd.is-grow{animation:none}}
@media (max-width:620px){.lvd{right:16px;bottom:16px}}

/* the assistant now lives at the right edge, so the bar grows out of its button */
.lvd{left:auto;right:24px;bottom:24px;transform:none}
.lvd.is-placed{transform:none}

/* ===== The AI mark and the pack's ask bar ===================================
   `.aisug` and `.aitag` arrived from session 2 without their base rules, so the
   suggestion chips fell back to browser buttons and the AI label rendered as
   bare text jammed against its glyph. ====================================== */
.aitag{display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:2px 9px 2px 6px;border-radius:var(--radius-full);
  background:color-mix(in srgb,var(--glow-core) 9%,var(--bg-surface));
  border:1px solid color-mix(in srgb,var(--glow-core) 22%,var(--border-subtle));
  font:500 10.5px/1.5 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-secondary);white-space:nowrap;vertical-align:middle}
.aitag .ico{width:12px;height:12px;color:var(--glow-core)}

.aisug{display:flex;flex-wrap:wrap;gap:6px}
.aisug button{all:unset;cursor:pointer;box-sizing:border-box;
  padding:5px 12px;border-radius:var(--radius-full);
  border:1px solid color-mix(in srgb,var(--glow-core) 20%,var(--border-subtle));
  background:var(--bg-surface);font:400 12.5px/1.45 var(--font-sans);color:var(--text-secondary)}
.aisug button:hover{color:var(--text-primary);background:color-mix(in srgb,var(--glow-core) 7%,var(--bg-surface));
  border-color:color-mix(in srgb,var(--glow-core) 42%,var(--border-subtle))}
.aisug button:focus-visible{outline:2px solid var(--brand-solid);outline-offset:2px}

/* the ask bar reads as the assistant, not as a search box in a table header */
.aiask{padding:var(--space-12) var(--space-16);gap:10px}
.aiask form{align-items:center}
.aiask input[type=search]{height:40px;border-radius:var(--radius-full)!important;
  padding:0 var(--space-16)!important;background:#fff!important;
  border:1px solid color-mix(in srgb,var(--glow-core) 20%,var(--border-subtle))!important;
  box-shadow:0 1px 2px rgb(var(--glow-ink) / .05),
    0 2px 14px -6px color-mix(in srgb,var(--glow-core) 34%,transparent)!important;
  font:400 13.5px/1.4 var(--font-sans)}
.aiask input[type=search]:focus{outline:none;
  border-color:color-mix(in srgb,var(--glow-core) 46%,var(--border-subtle))!important;
  box-shadow:0 1px 2px rgb(var(--glow-ink) / .06),
    0 3px 20px -6px color-mix(in srgb,var(--glow-core) 52%,transparent),
    0 6px 30px -10px color-mix(in srgb,var(--glow-warm) 42%,transparent)!important}
.aiask>form>.aimk{width:26px;height:26px}
.aiask>form>.aimk .ico,.aiask>form>.aimk svg{width:16px;height:16px}
.aiask .btn.sm{height:36px;border-radius:var(--radius-full)}
.aiask .aians{border:1px solid var(--border-subtle);background:#fff}
.aiask .aihist{margin-top:8px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)}
.aiask .aihist.warnt{color:var(--warning-hover)}

/* The orb is drawn at 64 — the size the library tunes richest — and scaled into
   whatever slot it sits in. The negative margin takes back the space the full
   64px box would otherwise claim, so layout sees the slot size, not the orb's. */
.lv-orbfit{width:64px!important;height:64px!important;flex:none;pointer-events:none;
  transform:scale(var(--k,1));transform-origin:50% 50%;
  margin:calc((var(--k,1) - 1) * 32px)}

/* ===== The AI layer's own classes ==========================================
   Nineteen class names arrived from session 2 with no rule behind them, so the
   chips rendered as browser buttons and the panels as bare stacks. Each one is
   given the house treatment here. ========================================= */
.aich{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:var(--radius-full);
  border:1px solid color-mix(in srgb,var(--glow-core) 22%,var(--border-subtle));
  background:color-mix(in srgb,var(--glow-core) 6%,var(--bg-surface));
  font:400 12px/1.5 var(--font-sans);color:var(--text-secondary)}
.aich:hover{background:color-mix(in srgb,var(--glow-core) 12%,var(--bg-surface));color:var(--text-primary)}
.aich:focus-visible{outline:2px solid var(--brand-solid);outline-offset:2px}
.aich b{font-weight:500;color:var(--text-primary)}

/* the fit score: two readings side by side, and the button that reconciles them */
.aifit{display:flex;align-items:flex-end;gap:var(--space-24);flex-wrap:wrap}
.aifit>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.aifit small{font:500 10.5px/1.4 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
.aifit b{font:500 30px/1.05 var(--font-flex);letter-spacing:-.02em;color:var(--text-primary);font-variant-numeric:tabular-nums}
.aifit .btn{margin-left:auto;align-self:center}

/* what pushed the score up or down */
.aifx{display:flex;flex-direction:column;gap:7px}
.aifx>div{display:flex;align-items:flex-start;gap:10px;font:400 13px/1.5 var(--font-sans)}
.aifx .mono{flex:none;min-width:30px;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.aifx .up .mono{color:var(--success-fg)}
.aifx .dn .mono{color:var(--warning-hover)}
.aifx>div>span:last-child{display:flex;flex-direction:column;gap:1px;min-width:0}
.aifx b{font-weight:500}

/* give and get, on a negotiating position */
.aigg{display:flex;gap:7px;align-items:flex-start;font:400 12.5px/1.5 var(--font-sans);margin-bottom:3px}
.aigg .g,.aigg .t{flex:none;font:500 10px/1.6 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
  padding:0 6px;border-radius:var(--radius-full);color:var(--text-secondary);
  background:color-mix(in srgb,var(--glow-core) 10%,var(--bg-subtle))}
.aigg .t{background:color-mix(in srgb,var(--glow-warm) 16%,var(--bg-subtle))}
.aival{font:500 12px/1.5 var(--font-sans)}
.aival.v0{color:var(--text-muted)}.aival.v1{color:var(--text-secondary)}
.aival.v2{color:var(--warning-hover)}.aival.v3{color:var(--error-fg)}

/* a pre-bid answer that would tell every bidder what we intend */
.aileak-n{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-top:8px;
  border-top:1px solid color-mix(in srgb,var(--warning-fg) 26%,transparent)}
.aileak-n>span:first-child{font:500 10.5px/1.5 var(--font-sans);letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted)}

/* small inline readings: a changed value, a context note, a decision, a driver */
.aichg,.aictx,.aidec,.aivfy,.aiwarn{display:flex;align-items:flex-start;gap:7px;
  font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)}
.aichg b,.aictx b,.aidec b,.aivfy b,.aiwarn b{font-weight:500;color:var(--text-primary)}
.aiwarn{color:var(--warning-hover)}
.aidrv{display:flex;flex-direction:column;gap:6px}
.aiown{display:inline-flex;align-items:center;gap:5px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-secondary)}
.aicw{display:flex;flex-direction:column;gap:6px;min-width:0}

/* "why this" — the reasoning behind a suggestion, folded away until asked for */
.aiwhy{display:flex;flex-direction:column;gap:8px;padding:var(--space-12) var(--space-14);
  border:1px solid color-mix(in srgb,var(--glow-core) 18%,var(--border-subtle));
  border-radius:var(--radius-12);background:color-mix(in srgb,var(--glow-core) 4%,var(--bg-surface))}
.aiwhy-h{display:flex;align-items:center;gap:8px;font:500 12.5px/1.4 var(--font-sans);color:var(--text-primary)}
.aiwhybtn{all:unset;cursor:pointer;font:400 12.5px/1.4 var(--font-sans);color:var(--text-brand);
  text-decoration:underline;text-underline-offset:2px}
.aiwhybtn:focus-visible{outline:2px solid var(--brand-solid);outline-offset:2px}

/* the editor's block body */
.edb-in{min-width:0;display:flex;flex-direction:column;gap:6px}

/* --- the outcome: the result said once, and drawn once --- */
.paout{overflow:hidden;border-color:color-mix(in srgb,var(--glow-core) 24%,var(--border-subtle))}
.paout.is-won{background:
  radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--brand-solid) 13%,transparent) 0%,transparent 62%),
  var(--bg-surface)}
.paout.is-lost{background:
  radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--error-fg) 10%,transparent) 0%,transparent 62%),
  var(--bg-surface)}
.paout-b{display:flex;align-items:center;gap:var(--space-20);flex-wrap:wrap}
.paout-t{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px}
.paout-t h3{font:500 clamp(22px,2.4vw,30px)/1.15 var(--font-flex);letter-spacing:-.015em;margin:0}
.paout.is-won .paout-t h3{color:var(--brand-solid)}
.paout.is-lost .paout-t h3{color:var(--error-fg)}
.paout-t p{margin:0;font:400 13.5px/1.55 var(--font-sans);color:var(--text-secondary)}
.paout-t .chip{align-self:flex-start;margin-top:4px}
.paout-iso{flex:none;width:220px;height:176px;display:block}
@media (max-width:620px){.paout-iso{width:170px;height:136px}}

/* what the hands can do, said once under the block list */
.edhint{margin-top:6px;font:400 11.5px/1.6 var(--font-sans);color:var(--text-muted);
  display:flex;flex-wrap:wrap;gap:0 4px;align-items:baseline}
.edhint b{font:500 11px/1.5 var(--font-mono,ui-monospace,monospace);color:var(--text-secondary);
  background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:4px;padding:1px 5px}

/* Team members multiselect (opportunity form) */
.tm-box{position:relative}
.tm-input{display:flex;align-items:center;gap:8px;width:100%;min-height:var(--control-height-md);padding:4px 12px;border:1px solid var(--border-default);border-radius:var(--radius-control);background:var(--surface);color:var(--text-primary);font:400 14px/1.5 var(--font-sans);cursor:pointer;text-align:left}
.tm-input:focus-visible{outline:2px solid var(--color-brand-400);outline-offset:1px}
.tm-ph{color:var(--text-secondary);flex:1}
.tm-chips{display:flex}
.tm-chips .av{margin-left:-3px;box-shadow:0 0 0 2px var(--surface)}
.tm-chips .av:first-child{margin-left:0}
.tm-more{font-size:10px}
.tm-count{flex:1;color:var(--text-secondary);font-size:12.5px}
.tm-caret{margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
.tm-menu{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:300px;overflow:auto;padding:6px;border:1px solid var(--border-default);border-radius:var(--radius-12);background:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.16)}
.tm-menu[hidden]{display:none}
.tm-opt{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:var(--radius-8);background:none;color:var(--text-primary);font:inherit;text-align:left;cursor:pointer}
.tm-opt:hover,.tm-opt:focus-visible{background:var(--color-brand-50);outline:none}
.tm-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.tm-tx b{font-weight:600;font-size:13.5px}
.tm-tx small{color:var(--text-secondary);font-size:12px}
.tm-tick{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);flex:none}
.tm-opt[aria-selected="true"] .tm-tick{background:var(--color-brand-500);border-color:var(--color-brand-500);box-shadow:inset 0 0 0 3px var(--surface)}

/* Opportunity board cards */
.oboard{gap:16px;align-items:start}
.oboard .col{background:var(--surface-2);border-radius:var(--radius-20);padding:12px;gap:12px}
.oboard .col h4{display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:4px 6px;font:500 14px/1.3 var(--font-sans);color:var(--text-primary)}
.oc-dot{width:8px;height:8px;border-radius:50%;background:var(--color-neutral-500);flex:none}
.oc-dot.info{background:var(--info)}.oc-dot.warn{background:var(--warn)}.oc-dot.ai{background:var(--ai)}.oc-dot.brand{background:var(--brand)}.oc-dot.ok{background:var(--ok)}
.oc-n{margin-left:2px;min-width:22px;height:22px;padding:0 6px;border-radius:var(--radius-full);display:inline-grid;place-items:center;background:var(--info-soft);color:var(--info);font:600 12px/1 var(--font-sans)}
.oc{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--border-subtle,var(--line));border-radius:var(--radius-16);cursor:pointer;font-size:13px}
.oc:hover{border-color:var(--pack)}
.oc:focus-visible{outline:2px solid var(--color-brand-400);outline-offset:2px}
.oc.live{border-color:color-mix(in srgb,var(--pack) 50%,var(--line))}
.oc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oc-id{font-size:11.5px;color:var(--text-secondary)}
.oc-st{gap:6px;padding:3px 10px;border-radius:var(--radius-8);font-size:12px;font-weight:500}
.oc-st i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.oc-name{margin:0;font:600 15px/1.3 var(--font-sans);color:var(--text-primary)}
.oc-client{margin:-4px 0 0;color:var(--text-secondary);font-size:13px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-loc{display:flex;align-items:center;gap:6px;margin:-4px 0 0;color:var(--text-secondary);font-size:12.5px}
.oc-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px}
.oc-chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.oc-chips .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.oc-avs{flex:none;margin-left:auto}
.oc-k{color:var(--text-secondary);font-size:12.5px}
.oc-avs{display:flex}
.oc-avs .av{margin-left:-3px;box-shadow:0 0 0 2px var(--surface)}
.oc-avs .av:first-child{margin-left:0}
.oc-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oc-due{display:inline-flex;align-items:center;gap:8px;color:var(--text-primary);font-size:13px}
.oc-fit{padding:3px 12px;border-radius:var(--radius-full);font-weight:500}
.oc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border-subtle,var(--line))}
.oc-foot b{font-size:13px;font-weight:600}

/* ===== Documents tab, clean layout (dx-) ===================================
   One column, read top to bottom: header → stats → upload → AI band → register →
   drawing sheets → coverage → how it works. The AI band is the only place with the
   AI gradient; inside the register, AI proposals keep the spark and gradient edge. */
.dx{display:flex;flex-direction:column;gap:var(--space-20)}
.dx .panel{border-radius:var(--radius-16);border-color:var(--border-subtle);overflow:hidden}
.dx .panel>.ph h3{font:500 16px/1.35 var(--font-sans)}

/* stats */
.dx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--space-12)}
.dx-stat{display:flex;flex-direction:column;gap:4px;min-width:0;padding:var(--space-16) var(--space-20);
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-16)}
.dx-stat .l{font:500 12px/1.3 var(--font-sans);color:var(--text-secondary)}
.dx-stat b{font:500 28px/1.15 var(--font-flex);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.dx-stat .d{font:400 12px/1.4 var(--font-sans);color:var(--text-muted)}
.dx-stat.warn b{color:var(--warning-fg)}
.dx-meter{height:6px;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden;margin-top:6px}
.dx-meter i{display:block;height:100%;border-radius:inherit;background:var(--success-fg)}

/* upload: one calm row */
.dx-drop{flex-direction:row;justify-content:flex-start;text-align:left;gap:var(--space-16);
  padding:var(--space-16) var(--space-20);border-width:1.5px}
.dx-drop-ic{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--radius-12);
  background:var(--bg-surface);color:var(--text-brand);border:1px solid var(--brand-border)}
.dx-drop-ic .ico{width:20px;height:20px}
.dx-drop-tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dx-drop-tx b{font:500 14.5px/1.35 var(--font-sans);color:var(--text-primary)}
.dx-drop-btn{flex:none;pointer-events:none}

/* the AI band: a gradient hairline, a soft wash header, cards inside */
.dx-ai{position:relative;display:flex;flex-direction:column;border:1px solid transparent;border-radius:var(--radius-20);overflow:hidden;
  background:linear-gradient(var(--bg-surface),var(--bg-surface)) padding-box,
    linear-gradient(115deg,color-mix(in srgb,var(--ai-lime) 80%,transparent),color-mix(in srgb,var(--ai-teal) 70%,transparent),color-mix(in srgb,var(--ai-sky) 70%,transparent),color-mix(in srgb,var(--ai-lav) 70%,transparent)) border-box;
  box-shadow:0 14px 40px -24px color-mix(in srgb,var(--ai-teal) 55%,transparent)}
.dx-ai-h{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8) var(--space-16);flex-wrap:wrap;
  padding:var(--space-14) var(--space-20);background:var(--ai-wash);border-bottom:1px solid color-mix(in srgb,var(--ai-teal) 20%,var(--border-subtle))}
.dx-ai-h h3{font:500 16px/1.35 var(--font-sans)}
.dx-ai-k{display:inline-flex;align-items:center;font:400 12.5px/1.4 var(--font-sans);color:var(--text-secondary)}
.dx-ai .aiask{padding:var(--space-16) var(--space-20);border-bottom:1px solid var(--border-subtle);background:transparent}
.dx-ai-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-16);padding:var(--space-16) var(--space-20) var(--space-20);background:var(--bg-subtle)}
.dx-ai-g.one{grid-template-columns:minmax(0,1fr)}
.dx-ai-g .panel{box-shadow:none;border-radius:var(--radius-12)}
.dx-ai-g .panel>.ph{padding:var(--space-12) var(--space-16)}
.dx-ai-g .panel>.ph h3{font:500 14.5px/1.35 var(--font-sans);display:flex;align-items:center;gap:8px}
/* what changed: stack each corrigendum instead of squeezing it into a row */
.dx-ai .aichg{flex-direction:column;gap:6px;padding:var(--space-14) var(--space-16);border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-secondary)}
.dx-ai .aichg:last-child{border-bottom:0}
.dx-ai .aichg>.row{width:100%}
.dx-ai .aichg ul{margin:2px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.dx-ai .aichg li::marker{color:var(--ai-teal)}
.dx-ai .flag{padding:var(--space-12) var(--space-16);align-items:center}
.dx-ai .flag .sev{background:linear-gradient(180deg,var(--ai-lime),var(--ai-teal) 55%,var(--ai-sky))}

/* register */
.dx-reg>.ph .seg .ct{font-size:11px;color:var(--text-muted);margin-left:2px;font-variant-numeric:tabular-nums}
.dx-reg .t td{vertical-align:middle}
.dx-reg .t tbody tr.click:hover>td{background:var(--bg-hover)}
.dx-reg .t tbody tr.aiprop:hover>td{filter:none}
.dx-doc{display:flex;align-items:center;gap:var(--space-12);min-width:260px}
.dx-doc-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.dx-doc-tx b{font:500 14px/1.35 var(--font-sans);color:var(--text-primary)}
.dx-doc-tx .sub{font-size:12px}
.dx-flag{color:var(--danger-fg);font-weight:500}
.dx-disc{color:var(--text-secondary)}

/* coverage: resolved items fold away */
.dx-more>summary{cursor:pointer;font:500 13px/1.4 var(--font-sans);color:var(--text-secondary);padding:4px 0;list-style:none;display:inline-flex;align-items:center;gap:6px}
.dx-more>summary::-webkit-details-marker{display:none}
.dx-more>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.dx-more[open]>summary::before{transform:rotate(45deg)}
.dx-more>summary:hover{color:var(--text-primary)}
.dx-more[open]>summary{margin-bottom:var(--space-8)}

/* how it works */
.dx-how{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--space-16)}
.dx-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-12)}
.dx-steps li{display:flex;flex-direction:column;gap:4px;padding:var(--space-12);border-radius:var(--radius-12);background:var(--bg-subtle);min-width:0}
.dx-steps .n,.dx-tips .n{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:var(--radius-full);
  background:var(--bg-surface);border:1px solid var(--border-subtle);font:500 12px/1 var(--font-sans);color:var(--text-secondary);margin-bottom:4px}
.dx-steps b{font:500 13.5px/1.35 var(--font-sans)}
.dx-steps .sub{font-size:12px;line-height:1.45}
