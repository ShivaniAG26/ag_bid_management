.vlist button:hover,.pidx .it:hover,.mapgrid li button:hover{background:var(--bg-hover)}
.vlist button.on,.pidx .it.on{background:var(--bg-selected);color:var(--text-primary);font-weight:500}
.clause.on{background:var(--bg-selected)} .clause:hover{background:var(--bg-hover)}
.daterow{border-left-color:var(--info-fg)}
.daterow.done{border-left-color:var(--success-fg)} .daterow.next{border-left-color:var(--danger-fg)}
.clar{border-left-color:var(--warning-fg)}
.flag .sev.high{background:var(--danger-fg)} .flag .sev.medium{background:var(--warning-fg)}
.flag .sev.pass{background:var(--success-fg)} .flag .sev.ai{background:var(--brand-solid)}
.mail.out{border-left-color:var(--brand-solid)}
.mail.in{border-left-color:var(--info-fg);background:var(--info-bg)}
.redline del{color:var(--danger-fg);background:var(--danger-bg)}
.redline ins{color:var(--success-fg);background:var(--success-bg)}
.diff-add{color:var(--success-fg)} .diff-mov{color:var(--info-fg)} .diff-del{color:var(--danger-fg)}
.dtype{border-radius:var(--radius-6);border-color:var(--border-subtle);background:var(--bg-subtle);font-family:var(--font-sans)}
.dtype.pdf{color:var(--danger-fg)} .dtype.dwg{color:var(--info-fg)} .dtype.xls{color:var(--success-fg)}
.ilogo{border-radius:var(--radius-12);border-color:var(--border-subtle);background:var(--bg-subtle);
  font-family:var(--font-sans);color:var(--text-brand)}
.igtag{border-radius:var(--radius-full);background:var(--bg-subtle);font:500 13px/1.28 var(--font-sans)}
.icave{color:var(--warning-fg)}
.prow.over{box-shadow:inset 0 2px 0 var(--brand-solid)}
.cm,.reqdetail blockquote{border-left-color:var(--border-default)}
.cadhud{border-radius:var(--radius-6);background:var(--bg-inverse);color:var(--text-inverse);font-family:var(--font-sans)}
.layers button{border-radius:var(--radius-full);border-color:var(--border-default)}
.empty{color:var(--text-secondary)}
.empty .ico{width:28px;height:28px;color:var(--text-brand)}

/* --- The olive auth / hero ground -------------------------------------- */
.hero{background:var(--hero);color:var(--hero-ink)}
.hero h2{color:var(--hero-ink);font:600 28px/36px var(--font-flex)}
.hero .dl b{font:300 44px/1 var(--font-flex)}
.hero .btn.pri{background:var(--color-brand-250);border-color:transparent;color:var(--color-brand-900);box-shadow:none}
.hero .chip{background:color-mix(in srgb,var(--hero-ink) 14%,transparent);color:var(--hero-ink)}
.login .rt{background:var(--hero);color:var(--hero-ink)}
.login .rt .eb{color:var(--hero-accent);font-family:var(--font-sans);font-weight:600}
.login .rt h2{color:var(--hero-ink);font-family:var(--font-flex);font-weight:500}
.login .facts span{border-color:var(--hero-line);font-family:var(--font-sans);border-radius:var(--radius-full)}
.lgst i{background:var(--hero-line-soft,#ffffff1f);border-radius:var(--radius-full)}
.lgst i.on{background:var(--hero-accent)}
.lgst .lgg{color:var(--hero-accent);font-family:var(--font-sans)}
.lgst .lgg:not(:empty){border-color:var(--hero-accent);border-radius:var(--radius-4)}
.lgst .lgn{font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.lgstages.light .lgst i{background:var(--bg-muted)} .lgstages.light .lgst i.on{background:var(--brand-solid)}
.lgstages.light .lgg{color:var(--warning-fg)} .lgstages.light .lgg:not(:empty){border-color:var(--warning-fg)}
.herosw button{border-color:var(--hero-line);border-radius:var(--radius-full);padding:var(--space-6) var(--space-14)}
.herosw button.on{background:var(--hero-accent);color:var(--color-brand-900);border-color:transparent}
.herosw .hsec{font-family:var(--font-sans);font-weight:600}

/* --- Login: the account picker, kept as the Tracklivo control ---------- */
.login .demos{gap:var(--space-8);grid-template-columns:minmax(0,1fr)}
.login .demo{flex-direction:row;align-items:center;gap:var(--space-12);
  min-height:var(--control-height-lg);padding:var(--space-8) var(--space-14) var(--space-8) var(--space-12);
  background:var(--bg-inverse);border:1px solid transparent;border-radius:var(--radius-full);color:var(--text-inverse);
  box-shadow:var(--elevation-1);transition:background-color .12s ease,box-shadow .12s ease}
.login .demo:hover{background:color-mix(in srgb,var(--bg-inverse) 88%,var(--text-inverse));border-color:transparent;box-shadow:var(--elevation-2)}
.login .demo:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:2px;box-shadow:var(--focus-ring)}
.login .demo .dgl{display:grid;place-items:center;width:var(--size-24);height:var(--size-24);flex:none;color:var(--text-inverse)}
.login .demo .dgl .ico{width:var(--size-24);height:var(--size-24)}
.login .demo .dtx{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px;text-align:left}
.login .demo b{font:500 16px/1.3 var(--font-sans);color:var(--text-inverse);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login .demo span{font:400 12px/1.28 var(--font-sans);color:color-mix(in srgb,var(--text-inverse) 65%,transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login .demo .drole{flex:none;border-radius:var(--radius-full);padding:var(--space-4) var(--space-12);
  background:color-mix(in srgb,var(--text-inverse) 18%,transparent);color:var(--text-inverse);
  font:500 13px/1.28 var(--font-sans);white-space:nowrap}
.login h1{font:600 32px/40px var(--font-flex)}
.login .or{font:400 12px/1.28 var(--font-sans);color:var(--text-muted)}
.login .or::before,.login .or::after{background:var(--border-subtle)}
.acct{border-top-color:var(--border-subtle)}

/* --- Wizard ------------------------------------------------------------- */
.wz{background:var(--bg-page)}
.wz-top{background:var(--bg-surface);border-bottom-color:var(--border-subtle)}
.wz-body{background:var(--bg-page)}
.wz-main{background:var(--bg-surface);border-radius:var(--radius-card);box-shadow:var(--elevation-1);margin:var(--space-10) var(--space-10) var(--space-10) 0}
.wz-steps{background:transparent;padding:var(--space-24) var(--space-10)}
.wz-steps button{border-radius:var(--radius-full);padding:var(--space-10) var(--space-14);font:400 14px/1.45 var(--font-sans);color:var(--text-secondary)}
.wz-steps button:hover{background:var(--bg-hover)}
.wz-steps button.on{background:var(--bg-inverse);color:var(--text-inverse);box-shadow:none;font-weight:500}
.wz-steps button.on .n{border-color:color-mix(in srgb,var(--text-inverse) 40%,transparent);color:var(--text-inverse);background:transparent}
.wz-steps button .n{font-family:var(--font-sans);border-color:var(--border-default);background:var(--bg-surface)}
.wz-steps button.done .n{background:var(--brand-solid);color:var(--brand-on-solid);border-color:transparent}
.wz-eb{font:600 11px/1.25 var(--font-sans);letter-spacing:.12em;color:var(--text-brand)}
.wz-nav{border-top-color:var(--border-subtle)}
.sumrow{border-bottom-color:var(--border-subtle)}

/* --- The printed-document facsimile keeps its paper, but its marks are
       the system's olive and terracotta, not the imported purple ------- */
.paper mark.ai{background:var(--color-brand-100);box-shadow:inset 0 -2px 0 var(--color-brand-500)}
.paper mark.bad{background:var(--color-red-50);box-shadow:inset 0 -2px 0 var(--color-red-500)}
.paper .stamp{color:var(--color-red-500);border-color:var(--color-red-500);font-family:var(--font-sans)}
.paper .phd,.paper .pft{font-family:var(--font-sans)}
.paper ::selection,.ptext ::selection{background:var(--color-brand-200)}

@media (prefers-reduced-motion:reduce){.btn,.icard,.card,.login .demo{transition:none}}
@media (max-width:860px){
  .app{padding:0;gap:0}
  .rail{border-radius:0;box-shadow:none;border-bottom:1px solid var(--border-subtle);height:auto;top:0}
  .main{border-radius:0;box-shadow:none}
  .wz-main{margin:0;border-radius:0;box-shadow:none}
}

/* ============================================================================
   Shell v2 — collapsible rail, a fixed top bar whose only control is the
   account, the Tracklivo account dock on sign-in, and the floating AI dock.
   ========================================================================== */

/* --- the rail: expanded 240, collapsed to a 72px icon rail --------------- */
.app{grid-template-columns:252px minmax(0,1fr);transition:grid-template-columns .2s cubic-bezier(.2,.8,.3,1)}
.app.rail-min{grid-template-columns:72px minmax(0,1fr)}
.railhd{display:flex;align-items:center;gap:var(--space-6);padding:0 var(--space-4) 0 var(--space-6)}
.railhd .logo{flex:1;min-width:0;padding:0}
.railtog{all:unset;cursor:pointer;flex:none;display:grid;place-items:center;width:var(--size-32);height:var(--size-32);
  border-radius:var(--radius-full);color:var(--text-secondary)}
.railtog:hover{background:var(--bg-hover);color:var(--text-primary)}
.railtog:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:2px;box-shadow:var(--focus-ring)}
.tenant{display:flex;flex-direction:row;align-items:center;gap:var(--space-10);padding:var(--space-10) var(--space-12)}
.tenant .tini{flex:none;display:grid;place-items:center;width:var(--size-32);height:var(--size-32);
  border-radius:var(--radius-full);background:var(--avatar-bg);color:var(--avatar-ink);font:600 12px/1 var(--font-sans)}
.tenant .tnm{display:flex;flex-direction:column;gap:1px;min-width:0}
.tenant b{font:500 13px/1.3 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenant span:not(.tini){font:400 11px/1.3 var(--font-sans);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rail-min .rail{padding-left:var(--space-8);padding-right:var(--space-8);align-items:center}
.rail-min .railhd{flex-direction:column;gap:var(--space-8);padding:0}
.rail-min .logo div,.rail-min .tenant .tnm,.rail-min .nav h6,.rail-min .nav .ot,.rail-min .nav .ct,
.rail-min .secure .ot{display:none}
.rail-min .tenant{justify-content:center;padding:var(--space-8) 0;border:0;background:transparent}
.rail-min .nav button{justify-content:center;padding:var(--space-10) 0;width:var(--size-44);margin:0 auto}
.rail-min .nav{gap:var(--space-2)}
.rail-min .nav.opps button .oid{font:600 11px/1 var(--font-sans)}
.rail-min .secure{display:grid;place-items:center;padding:var(--space-8);background:transparent;border-color:transparent}
.rail-min .secure b{gap:0}
.rail-min .rail-foot{align-items:center}

/* --- the top bar is fixed to the top of the stage ------------------------ */
.top{position:sticky;top:0;z-index:40;background:var(--bg-surface);
  border-radius:var(--radius-card) var(--radius-card) 0 0;gap:var(--space-12)}
.main{overflow:visible;isolation:isolate}
.top .crumbs{flex:1}

/* --- the account: the only control on the top bar ------------------------ */
.profile{position:relative;flex:none}
.avatar-btn{all:unset;cursor:pointer;display:flex;padding:2px;border-radius:var(--radius-full)}
.avatar-btn:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:2px;box-shadow:var(--focus-ring)}
.av{display:grid;place-items:center;width:var(--size-36);height:var(--size-36);border-radius:var(--radius-full);
  background:var(--avatar-bg);color:var(--avatar-ink);font:600 13px/1 var(--font-sans);flex:none}
.av.lg{width:var(--size-40);height:var(--size-40);font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:296px;z-index:60;
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-16);
  box-shadow:var(--elevation-2);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-2);
  max-height:min(560px,calc(100vh - 90px));overflow-y:auto}
.menu__head{display:flex;gap:var(--space-10);align-items:center;padding:var(--space-10)}
.menu__head strong{font:500 14px/1.3 var(--font-sans)}
.menu__mail{font:400 11px/1.3 var(--font-sans);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu__rule{border:0;border-top:1px solid var(--border-subtle);margin:var(--space-4) 0;width:100%}
.menu__lbl{font:600 11px/1.25 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);padding:var(--space-4) var(--space-10)}
.menu__item{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:var(--space-10);align-items:center;width:100%;
  padding:var(--space-10);border-radius:var(--radius-8);font:400 14px/1.45 var(--font-sans);color:var(--text-primary)}
.menu__item .ico{flex:none;color:var(--text-secondary)}
.menu__item .grow{flex:1;min-width:0}
.menu__item:hover,.menu__item:focus-visible{background:var(--bg-hover);outline:none}
.mini-switch{width:32px;height:18px;border-radius:var(--radius-full);background:var(--bg-muted);flex:none;
  display:flex;align-items:center;padding:2px;transition:background-color .15s ease}
.mini-switch i{width:14px;height:14px;border-radius:var(--radius-full);background:var(--bg-surface);display:block;
  box-shadow:var(--elevation-1);transition:transform .15s ease}
.mini-switch.is-on{background:var(--brand-solid)}
.mini-switch.is-on i{transform:translateX(14px)}
.menu__scen{max-height:208px;overflow-y:auto;padding:0 var(--space-4)}

/* --- the account list, shared by the menu and the sign-in dock ----------- */
.proto__scen{display:flex;flex-direction:column;gap:var(--space-4)}
.proto__scen button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;text-align:left;
  border:1px solid var(--border-subtle);background:var(--bg-surface);border-radius:var(--radius-control);
  padding:var(--space-8) var(--space-10);color:var(--text-primary);font:400 14px/1.35 var(--font-sans)}
.proto__scen button:hover{background:var(--bg-hover);border-color:var(--border-default)}
.proto__scen button:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px;box-shadow:var(--focus-ring)}
.proto__scen button.is-now{border-color:var(--brand-border);background:var(--brand-softer);color:var(--text-brand);font-weight:500}
.proto__scen small{display:block;color:var(--text-secondary);font:400 12px/1.35 var(--font-sans)}
.proto__scen small.mono{color:var(--text-muted);font-variant-numeric:tabular-nums}
.proto__badge{display:inline-block;margin-left:var(--space-8);padding:1px var(--space-8);border-radius:var(--radius-full);
  background:var(--brand-solid);color:var(--brand-on-solid);font:500 10.5px/1.5 var(--font-sans);vertical-align:1px}

/* --- the sign-in account dock, bottom right ------------------------------ */
.proto{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
.proto__toggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-8);
  height:var(--control-height-sm);padding:0 var(--space-14);border-radius:var(--radius-full);
  background:var(--bg-inverse);color:var(--text-inverse);font:500 13px/1.45 var(--font-sans);box-shadow:var(--elevation-3)}
.proto__toggle .ico{width:18px;height:18px}
.proto__toggle:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:2px}
.proto__now{display:inline-flex;align-items:center;padding:2px var(--space-8);border-radius:var(--radius-full);
  background:color-mix(in srgb,var(--text-inverse) 18%,transparent);font:500 11.5px/1.5 var(--font-sans)}
.proto__panel{position:absolute;right:0;bottom:46px;width:min(340px,calc(100vw - 32px));
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-16);
  box-shadow:var(--elevation-3);padding:var(--space-14);display:flex;flex-direction:column;gap:var(--space-12);
  max-height:70vh;overflow-y:auto}
.proto__node{font:400 12px/1.4 var(--font-sans);color:var(--text-muted)}
.proto__panel strong{font:500 16px/24px var(--font-flex)}

/* --- sign-in: one column, no side panel ---------------------------------- */
.login{grid-template-columns:minmax(0,1fr);background:var(--bg-page);place-items:center;padding:var(--space-24)}
.login .lf{max-width:420px;gap:var(--space-24);padding:var(--space-32);background:var(--bg-surface);
  border-radius:var(--radius-card);box-shadow:var(--elevation-1);border:1px solid var(--border-subtle)}
.login .form{gap:var(--space-14);margin-block:0}
.login .form .btn{width:100%}
.login .lgfoot{font:400 12px/1.45 var(--font-sans);color:var(--text-muted);text-align:center}
.login .rt{display:none}

/* --- the AI dock: rests as a pill, opens into a panel, drags anywhere ----- */
.aid{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;width:var(--aid-w,268px);
  touch-action:none;transition:width .26s cubic-bezier(.2,.8,.3,1)}
.aid.is-big{--aid-w:404px}
.aid.is-placed{transform:none}
.aid.is-drag{transition:none}
.aid-surf{position:relative;display:flex;flex-direction:column;width:100%;overflow:hidden;
  border:1px solid var(--border-subtle);border-radius:var(--radius-full);background:var(--bg-surface);
  box-shadow:var(--elevation-3);transition:border-radius .26s cubic-bezier(.2,.8,.3,1)}
.aid.is-big .aid-surf{border-radius:var(--radius-20);border-color:var(--brand-border)}
.aid-grow{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.3,1)}
.aid.is-big .aid-grow{grid-template-rows:1fr}
.aid-clip{overflow:hidden;min-height:0}
.aid-inner{display:flex;flex-direction:column;opacity:0;transition:opacity .18s ease .08s}
.aid.is-big .aid-inner{opacity:1}
.aid-head{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-12) var(--space-10) var(--space-12) var(--space-16);
  border-bottom:1px solid var(--border-subtle);background:var(--brand-softer);font:500 14px/1.45 var(--font-sans)}
.aid-head .ico{color:var(--text-brand)}
.aid-sp{flex:1}
.aid-body{display:flex;flex-direction:column;gap:var(--space-10);padding:var(--space-14);
  overflow-y:auto;max-height:min(400px,46vh);cursor:default}
.aid-m{max-width:90%;padding:var(--space-10) var(--space-12);border-radius:14px;
  font:400 13px/1.5 var(--font-sans);display:flex;flex-direction:column;gap:var(--space-4)}
.aid-m.is-me{align-self:flex-end;background:var(--brand-solid);color:var(--brand-on-solid);border-bottom-right-radius:5px}
.aid-m.is-leo{align-self:flex-start;background:var(--brand-softer);border:1px solid var(--brand-border);border-bottom-left-radius:5px}
.aid-at{font:400 10.5px/1.3 var(--font-sans);color:var(--text-muted);align-self:flex-end}
.aid-sug{display:flex;flex-direction:column;gap:var(--space-6);align-items:flex-start}
.aid-sug__b{all:unset;cursor:pointer;box-sizing:border-box;text-align:left;max-width:100%;
  font:400 12.5px/1.4 var(--font-sans);padding:var(--space-8) var(--space-12);border-radius:var(--radius-full);
  border:1px solid var(--border-default);color:var(--text-secondary)}
.aid-sug__b:hover{border-color:var(--brand-solid);color:var(--text-brand);background:var(--brand-softer)}
.aid-bar{display:flex;align-items:center;gap:var(--space-8);height:52px;padding:0 var(--space-8) 0 var(--space-6);flex:none}
.aid-bar.is-inner{border-top:1px solid var(--border-subtle)}
.aid-grip{display:inline-flex;flex:none;width:18px;color:var(--text-muted);opacity:.45;cursor:grab}
.aid:hover .aid-grip{opacity:.8}
.aid.is-drag .aid-grip{cursor:grabbing}
.aid.is-rest .aid-bar{cursor:grab}
.aid.is-rest.is-drag .aid-bar{cursor:grabbing}
.aid-rest{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  gap:var(--space-8);flex:1;min-width:0;height:100%;padding:0 var(--space-10) 0 var(--space-2);
  font:500 13.5px/1.45 var(--font-sans);color:var(--text-secondary)}
.aid-rest .ico{color:var(--text-brand)}
.aid-rest:hover{color:var(--text-primary)}
.aid-form{display:flex;align-items:center;gap:var(--space-6);flex:1;min-width:0}
.aid-in{flex:1;min-width:0;height:36px;border:0;background:transparent;padding:0;
  font:400 13.5px/1.45 var(--font-sans);color:var(--text-primary)}
.aid-in:focus{outline:none;border:0;box-shadow:none}
.aid-ic,.aid-go{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--size-32);height:var(--size-32);border-radius:var(--radius-full);color:var(--text-secondary)}
.aid-ic:hover{background:var(--bg-hover);color:var(--text-primary)}
.aid-go{background:var(--brand-solid);color:var(--brand-on-solid)}
.aid-go:hover{background:var(--brand-hover)}
.aid-ic:focus-visible,.aid-go:focus-visible,.aid-rest:focus-visible,.aid-sug__b:focus-visible{
  outline:1.5px solid var(--brand-solid);outline-offset:2px;box-shadow:var(--focus-ring)}

@media (max-width:860px){
  .app,.app.rail-min{grid-template-columns:minmax(0,1fr)}
  .railhd{flex-direction:row}.railtog{display:none}
  .top{border-radius:0}
  .aid{left:12px;right:12px;bottom:14px;transform:none;width:auto}
  .aid.is-placed{left:12px;right:12px;top:auto;bottom:14px}
  .login .lf{padding:var(--space-20)}
}

/* ============================================================================
   Shell v3 — the role switcher back on the top bar, the rail's collapse control
   moved to its foot, the split sign-in screen, and agents as a card grid.
   ========================================================================== */

/* --- top bar: two icon-only controls ------------------------------------- */
.topr{display:flex;align-items:center;gap:var(--space-4);flex:none}
.icon-btn{all:unset;cursor:pointer;box-sizing:border-box;display:grid;place-items:center;flex:none;
  width:var(--size-36);height:var(--size-36);border-radius:var(--radius-full);color:var(--text-secondary)}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.icon-btn[aria-expanded="true"]{background:var(--bg-inverse);color:var(--text-inverse)}
.icon-btn:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:2px;box-shadow:var(--focus-ring)}
.menu--roles{width:288px;padding-bottom:var(--space-4)}
.menu--roles .menu__scen{max-height:min(420px,calc(100vh - 190px))}
.menu__foot{font:400 11.5px/1.4 var(--font-sans);color:var(--text-muted);padding:var(--space-10);margin-top:var(--space-4);
  border-top:1px solid var(--border-subtle);background:var(--bg-surface)}

/* --- the collapse control now sits at the foot of the rail --------------- */
.rail-foot .railtog{width:100%;height:var(--size-36);justify-content:flex-start;place-items:center;
  display:flex;gap:var(--space-10);padding:0 var(--space-10);border-radius:var(--radius-8);
  font:400 13px/1.45 var(--font-sans);box-sizing:border-box}
.rail-foot .railtog .ico{flex:none}
.rail-min .rail-foot .railtog{width:var(--size-36);justify-content:center;padding:0}
.rail-min .rail-foot .railtog .ot{display:none}

/* --- the prototype notice is one slim, dismissible line ------------------ */
.banner{display:flex;align-items:center;gap:var(--space-10);padding-right:var(--space-10)}
.banner span{flex:1;min-width:0}
.banner button{all:unset;cursor:pointer;display:grid;place-items:center;width:var(--size-24);height:var(--size-24);
  border-radius:var(--radius-full);color:var(--text-muted);flex:none}
.banner button:hover{background:var(--bg-hover);color:var(--text-primary)}
.banner button .ico{width:16px;height:16px}
.banner button:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px}

/* --- sign-in: form on the left, what bidPlan is on the right ------------- */
.login.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);place-items:stretch;
  padding:0;min-height:100vh;background:var(--bg-surface)}
.auth__main{display:flex;flex-direction:column;align-items:center;padding:var(--space-32) max(var(--space-24),4vw);min-width:0}
.auth__brand{width:100%;max-width:400px;flex:none}
.login.auth .auth__form{width:100%;max-width:400px;margin:auto 0;gap:var(--space-14)}
.auth__form .btn{width:100%}
.auth__aside{background:var(--brand-softer);border-left:1px solid var(--border-subtle);
  padding:var(--space-48) max(var(--space-32),3.5vw);display:flex;flex-direction:column;justify-content:center;
  gap:var(--space-24);overflow:hidden;min-width:0}
.auth__title{font:500 clamp(26px,2.6vw,34px)/1.18 var(--font-flex);max-width:20ch}
.auth__lede{font:400 15px/1.55 var(--font-sans);color:var(--text-secondary);max-width:56ch}
.auth__pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-8);max-width:56ch}
.auth__pts li{position:relative;padding-left:var(--space-20);font:400 13px/1.5 var(--font-sans);color:var(--text-secondary)}
.auth__pts li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:var(--radius-full);
  background:var(--brand-solid)}

/* a small, real-looking glimpse of the board you are signing in to */
.glimpse{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);
  box-shadow:var(--elevation-2);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);max-width:540px}
.glimpse__head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-8);
  font:500 14px/1.45 var(--font-sans)}
.glimpse__cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-10)}
.glimpse__col{background:var(--bg-subtle);border-radius:var(--radius-12);padding:var(--space-8);
  display:flex;flex-direction:column;gap:var(--space-8);min-width:0}
.glimpse__colhead{display:flex;justify-content:space-between;gap:var(--space-6);
  font:500 11px/1.3 var(--font-sans);color:var(--text-secondary)}
.tcard{background:var(--bg-surface);border-radius:var(--radius-8);padding:var(--space-8);box-shadow:var(--elevation-1);
  display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.tcard b{font:500 11.5px/1.35 var(--font-sans)}
.tcard__id,.tcard__meta{font:400 10.5px/1.3 var(--font-sans);color:var(--text-muted)}

@media (max-width:1040px){
  .login.auth{grid-template-columns:minmax(0,1fr)}
  .auth__aside{display:none}
}
@media (max-width:620px){.auth__main{padding:var(--space-24) var(--space-16)}}

/* --- agents and specialists: a card grid, one avatar each ---------------- */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-32) var(--space-20);
  margin-top:var(--space-24)}
.acard{position:relative;display:flex;flex-direction:column;gap:var(--space-8);min-width:0;
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);
  box-shadow:var(--elevation-1);padding:var(--space-32) var(--space-20) var(--space-16)}
.acard:hover{box-shadow:var(--elevation-2);border-color:var(--border-default)}
.aav{position:absolute;top:calc(-1 * var(--size-24));left:var(--space-20);display:grid;place-items:center;
  width:var(--size-52);height:var(--size-52);border-radius:var(--radius-full);
  border:3px solid var(--bg-surface);background:var(--bg-muted);color:var(--text-primary);box-shadow:var(--elevation-1)}
.acard h3{font:500 16px/1.35 var(--font-flex)}
.acard p{font:400 13px/1.5 var(--font-sans);color:var(--text-secondary);flex:1}
.arow{display:flex;flex-wrap:wrap;gap:var(--space-6)}
.afoot{display:flex;justify-content:space-between;gap:var(--space-10);padding-top:var(--space-10);
  border-top:1px solid var(--border-subtle);font:400 11.5px/1.4 var(--font-sans);color:var(--text-muted)}
.afoot span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afoot span+span{flex:none;white-space:nowrap}

/* --- opportunities: one filter row, one closing line --------------------- */
.filtrow{align-items:center;gap:var(--space-16);flex-wrap:wrap;margin-top:var(--space-6)}
.fld.inline{flex-direction:row;align-items:center;gap:var(--space-8);width:auto}
.fld.inline select{width:auto;min-width:170px}
.feedline{font:400 12px/1.5 var(--font-sans);color:var(--text-muted);margin-top:var(--space-6)}

/* ============================================================================
   Shell v4 — scrollbars out of the way, a generated avatar per agent, the
   current user shown on Acting as, and KPI cards on a brand gradient.
   ========================================================================== */

/* --- scrollbars: thin and quiet everywhere, absent inside menus and docks -- */
*{scrollbar-width:thin;scrollbar-color:var(--border-default) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:var(--radius-full);
  border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
.menu,.menu__scen,.proto__panel,.aid-body,.board,.tw,.rail{scrollbar-width:none;-ms-overflow-style:none}
.menu::-webkit-scrollbar,.menu__scen::-webkit-scrollbar,.proto__panel::-webkit-scrollbar,
.aid-body::-webkit-scrollbar,.board::-webkit-scrollbar,.tw::-webkit-scrollbar,
.rail::-webkit-scrollbar{width:0;height:0;display:none}

/* --- Acting as: the current user, then the list ------------------------- */
.rolebtn{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:var(--space-8);
  height:var(--control-height-sm);padding:0 var(--space-8) 0 var(--space-4);border-radius:var(--radius-full);
  border:1px solid var(--border-subtle);color:var(--text-primary);max-width:230px}
.rolebtn:hover{background:var(--bg-hover);border-color:var(--border-default)}
.rolebtn[aria-expanded="true"]{background:var(--bg-hover);border-color:var(--brand-border)}
.rolebtn:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:2px;box-shadow:var(--focus-ring)}
.rolebtn .ico{width:16px;height:16px;flex:none;color:var(--text-muted)}
.rolebtn__tx{display:flex;flex-direction:column;gap:0;min-width:0;text-align:left}
.rolebtn__tx small{font:400 10px/1.2 var(--font-sans);color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}
.rolebtn__tx b{font:500 12.5px/1.3 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av.sm{width:var(--size-28);height:var(--size-28);font-size:11px}
@media (max-width:760px){.rolebtn__tx{display:none}.rolebtn{padding:0 var(--space-4)}}

/* --- the generated agent avatar ----------------------------------------- */
.aav{position:absolute;top:calc(-1 * var(--size-24));left:var(--space-20);display:block;
  width:var(--size-52);height:var(--size-52);border-radius:var(--radius-full);
  box-shadow:0 0 0 3px var(--bg-surface),var(--elevation-1);background:var(--bg-surface)}
.aav .agav{display:block;width:100%;height:100%;border-radius:var(--radius-full)}

/* --- metric cards: let the number carry it, no gradient, no accent rail --- */
.kpi{background:var(--bg-surface);border-color:var(--border-subtle);position:relative;padding:var(--space-16) var(--space-20)}
.kpi::after{content:none}
.kpi .eyebrow{color:var(--text-secondary);font:500 11px/1.3 var(--font-sans);letter-spacing:.08em}
/* a compact strip of figures for use inside a tab, where cards would be a second tier */
.statstrip{display:flex;flex-wrap:wrap;gap:0;margin-bottom:var(--space-16);background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--elevation-1);overflow:hidden}
.statstrip>div{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:3px;padding:var(--space-14) var(--space-16);border-right:1px solid var(--border-subtle)}
.statstrip>div:last-child{border-right:0}
.statstrip .k{font:500 11px/1.3 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.statstrip .v{font:500 20px/1.2 var(--font-flex,var(--font-sans));font-variant-numeric:tabular-nums;color:var(--text-primary)}
.statstrip .v.ok{color:var(--success-fg)}.statstrip .v.warn{color:var(--warning-fg)}.statstrip .v.bad{color:var(--danger-fg)}
.statstrip .d{font:400 12px/1.35 var(--font-sans);color:var(--text-muted)}
@media (max-width:640px){.statstrip>div{flex-basis:50%;border-bottom:1px solid var(--border-subtle)}}
.kpi .v{color:var(--text-primary)}
.kpi.bad .v{color:var(--danger-fg)}
.kpi.ok .v{color:var(--success-fg)}
.kpi.warn .v{color:var(--warning-fg)}

/* --- a one-line stacked bar for status splits --------------------------- */
.stack-bar{display:flex;gap:3px;height:12px;border-radius:var(--radius-full);overflow:hidden}
.stack-bar i{display:block;background:var(--bg-muted);border-radius:var(--radius-full);min-width:4px}
.stack-bar i.ok{background:var(--success-fg)}
.stack-bar i.brand{background:var(--warning-fg)}
.stack-bar i.bad{background:var(--danger-fg)}

/* --- the brand lockup replaces the wordmark text ------------------------ */
.logo .lk{display:flex;align-items:center;min-width:0}
.logo .lk svg,.login .logo svg{display:block;height:auto;max-width:100%}
.rail-min .logo .lk{display:none}
.logo:has(.lk) .mk{display:none}
.rail-min .logo:has(.lk) .mk{display:grid}
.login .logo{display:flex;align-items:center;gap:0}
.login .logo .mk{display:none}

/* --- a required field's label and its asterisk stay on one line --------- */
.fldl{display:inline-flex;align-items:baseline;gap:3px;min-width:0;flex-wrap:nowrap}
.fldl i{font-style:normal;color:var(--danger-fg);line-height:1}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* --- integrations: one filter row, not three ---------------------------- */
.ifilters{align-items:center;gap:var(--space-10);flex-wrap:wrap;margin-top:var(--space-14)}
.ifilters input[type=search]{width:clamp(180px,22vw,260px);flex:none}
.ifilters .seg{flex:none}

/* ============================================================================
   The assistant, v2: an olive AI gradient (lime, teal, sky, lavender, ochre —
   olive and its complements), a thinking orb for its face, a border beam on
   the resting pill and a voice glow along the composer.
   ========================================================================== */
:root{
  --ai-lime:#bed45b; --ai-teal:#6bc7ab; --ai-sky:#94bfdb; --ai-lav:#a99be8; --ai-ochre:#d9b46a;
  --ai-grad:linear-gradient(115deg,var(--ai-lime) 0%,var(--ai-teal) 34%,var(--ai-sky) 62%,var(--ai-lav) 84%,var(--ai-ochre) 100%);
  --ai-wash:linear-gradient(115deg,
    color-mix(in srgb,var(--ai-lime) 26%,var(--bg-surface)) 0%,
    color-mix(in srgb,var(--ai-teal) 18%,var(--bg-surface)) 38%,
    color-mix(in srgb,var(--ai-sky) 16%,var(--bg-surface)) 66%,
    color-mix(in srgb,var(--ai-lav) 20%,var(--bg-surface)) 100%);
}
.fx-host{position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:0;display:block}
.aid-orb,.aid-orb64{display:inline-grid;place-items:center;flex:none;pointer-events:none}
.aid-orb{width:20px;height:20px}
.aid-orb64{width:64px;height:64px}
.aid-orb canvas,.aid-orb64 canvas{display:block}

/* the surface: a hairline of the AI gradient, a soft wash inside */
.aid-surf{position:relative;isolation:isolate}
.aid.is-big .aid-surf{border:1px solid transparent;
  background:linear-gradient(var(--bg-surface),var(--bg-surface)) padding-box,var(--ai-grad) border-box;
  box-shadow:0 18px 48px -18px color-mix(in srgb,var(--ai-teal) 40%,transparent),var(--elevation-3)}
.aid.is-rest .aid-surf{border-color:transparent;
  background:linear-gradient(var(--bg-surface),var(--bg-surface)) padding-box,
    linear-gradient(115deg,color-mix(in srgb,var(--ai-lime) 70%,transparent),color-mix(in srgb,var(--ai-teal) 60%,transparent),color-mix(in srgb,var(--ai-lav) 60%,transparent)) border-box}
.aid-grow,.aid-bar{position:relative;z-index:1}

.aid-head{background:var(--ai-wash);border-bottom:1px solid color-mix(in srgb,var(--ai-teal) 22%,var(--border-subtle));gap:var(--space-10)}
.aid-ttl{font:500 14px/1.4 var(--font-sans);color:var(--text-primary)}
.aid-head .chip.ai{background:color-mix(in srgb,var(--bg-surface) 70%,transparent);border:1px solid color-mix(in srgb,var(--ai-teal) 30%,transparent);color:var(--text-secondary)}

.aid-hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-10);
  padding:var(--space-8) var(--space-8) var(--space-4);font:400 13px/1.5 var(--font-sans);color:var(--text-secondary)}
.aid-hello b{font-weight:500;color:var(--text-primary)}

.aid-m.is-me{background:linear-gradient(135deg,var(--brand-solid),color-mix(in srgb,var(--brand-solid) 62%,#2f8f7a));color:var(--brand-on-solid)}
.aid-m.is-leo{background:var(--ai-wash);border:1px solid color-mix(in srgb,var(--ai-teal) 22%,var(--border-subtle))}
.aid-m b{font-weight:500}
.aid-think{display:flex;align-items:center;gap:var(--space-8);font:400 12.5px/1.4 var(--font-sans);color:var(--text-secondary);
  padding:var(--space-8) var(--space-12);border-radius:var(--radius-full);align-self:flex-start;background:var(--ai-wash)}
.aid-sug__b:hover{border-color:color-mix(in srgb,var(--ai-teal) 55%,var(--border-default));background:var(--ai-wash);color:var(--text-primary)}

.aid-bar{position:relative}
.aid-bar .fx-host{z-index:0;border-radius:0 0 var(--radius-20) var(--radius-20)}
.aid-bar > :not(.fx-host){position:relative;z-index:1}
.aid-go{background:var(--ai-grad);color:#14180b}
.aid-go:hover{filter:brightness(1.06);background:var(--ai-grad)}
.aid-go:disabled{opacity:.55;cursor:default}
.aid-in:disabled,.aid-in:disabled:hover{background:transparent;border:0;box-shadow:none;opacity:.7;cursor:default}
.aid-rest{gap:var(--space-10);color:var(--text-primary);font-weight:500}
.aid-rest .ico{display:none}
@media (prefers-reduced-motion:reduce){.fx-host{display:none}}

/* --- integrations v2: neutral cards, real brand marks, status as a dot ---- */
.igroup2{display:flex;flex-direction:column;gap:var(--space-12);margin-top:var(--space-24)}
.ig2-head h4{font:500 15px/1.4 var(--font-sans);color:var(--text-primary);display:flex;align-items:center;gap:var(--space-8)}
.ig2-head h4 span{font:500 11.5px/1 var(--font-sans);color:var(--text-muted);background:var(--bg-muted);border-radius:var(--radius-full);padding:3px 8px}
.ig2-head p{font:400 12.5px/1.45 var(--font-sans);color:var(--text-muted);margin-top:2px}
.ig2-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--space-12)}
.ic2{display:flex;flex-direction:column;gap:var(--space-10);min-width:0;padding:var(--space-16);
  background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-16);
  transition:border-color .15s ease,box-shadow .15s ease}
.ic2:hover{border-color:var(--border-default);box-shadow:var(--elevation-1)}
.ic2-top{display:flex;align-items:center;gap:var(--space-12);min-width:0}
.ic2-logo{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:var(--radius-12);
  background:#fff;border:1px solid var(--border-subtle);padding:8px;box-sizing:border-box}
.ic2-logo svg{width:100%;height:100%;display:block}
.ic2-logo.mono{background:var(--bg-muted);border-color:transparent;padding:0;
  font:500 12px/1 var(--font-sans);letter-spacing:.02em;color:var(--text-secondary)}
:root[data-theme="dark"] .ic2-logo:not(.mono){border-color:transparent}
.ic2-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ic2-tx h3{font:500 14px/1.3 var(--font-sans);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic2-reg{font:400 11.5px/1.3 var(--font-sans);color:var(--text-muted)}
.ic2-desc{font:400 12.5px/1.5 var(--font-sans);color:var(--text-secondary);flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic2-cav{display:flex;gap:6px;align-items:flex-start;font:400 11.5px/1.4 var(--font-sans);color:var(--text-muted)}
.ic2-cav .ico{width:14px;height:14px;flex:none;margin-top:1px}
.ic2-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);
  padding-top:var(--space-10);border-top:1px solid var(--border-subtle)}
.ic2-st{display:inline-flex;align-items:center;gap:6px;font:400 12px/1.3 var(--font-sans);color:var(--text-muted);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic2-st i{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:none}
.ic2-st.on{color:var(--text-primary)}
.ic2-st.on i{background:var(--success-fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--success-fg) 18%,transparent)}
/* ===== Admin console layout B ===== */
.alay button{padding:var(--space-4) var(--space-12);font-size:12.5px}
.ahero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);align-items:center;gap:var(--space-24);padding:var(--space-32) var(--space-32) var(--space-24);border-radius:var(--radius-24);background:var(--bg-muted)}
.ahero-tx{display:flex;flex-direction:column;gap:var(--space-8);max-width:56ch}
.ahero-tx .eyebrow{color:var(--text-brand)}
.ahero h1{font:500 34px/1.15 var(--font-flex,var(--font-sans));letter-spacing:-.01em;margin:0;color:var(--text-primary)}
.ahero-tx p{margin:0;color:var(--text-secondary);font-size:15px;line-height:1.5}

/* ===== Shadow pass (Oct 26): Srivi found shadows heavy. Surfaces sit on hairlines;
   only things that float (menus, dialogs, toasts, the AI dock) keep a soft lift. ===== */
:root,:root[data-theme="light"]{
  --elevation-1:0 1px 2px #0000000a;
  --elevation-2:0 2px 6px #0000000d;
  --elevation-3:0 6px 18px #00000012,0 1px 3px #0000000a;
  --elevation-4:0 8px 22px #00000014,0 1px 3px #0000000a;
  --button-primary-glow:inset 0 1px 0 #ffffff26;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --elevation-1:0 1px 2px #0000002e;
  --elevation-2:0 2px 6px #00000038;
  --elevation-3:0 8px 20px #00000052,0 1px 3px #00000033;
  --elevation-4:0 10px 26px #0000005c,0 1px 3px #00000033;
  --button-primary-glow:inset 0 1px 0 #ffffff14;
}}
:root[data-theme="dark"]{
  --elevation-1:0 1px 2px #0000002e;
  --elevation-2:0 2px 6px #00000038;
  --elevation-3:0 8px 20px #00000052,0 1px 3px #00000033;
  --elevation-4:0 10px 26px #0000005c,0 1px 3px #00000033;
  --button-primary-glow:inset 0 1px 0 #ffffff14;
}

.kb-acts li{margin-bottom:4px}
/* canvas */
.kb-canvas{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:var(--space-16);align-items:start}
.kb-doc{min-width:0}
.kb-doc .meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--text-secondary)}
.kb-doc .meta b{color:var(--text-primary);font-weight:500}
.kb-stage{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--elevation-1);padding:var(--space-20);overflow:auto}
/* document preview: toolbar, page rail, paper */
.kbv{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--elevation-1);overflow:hidden}
.kbv-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-subtle);background:var(--bg-subtle);flex-wrap:wrap}
.kbv-bar .ibtn[disabled]{opacity:.35;pointer-events:none}
.kbv-pg{font:400 13px/1 var(--font-sans);min-width:52px;text-align:center}
.kbv-pg small{color:var(--text-muted)}
.kbv-z{font:400 13px/1 var(--font-sans);min-width:44px;text-align:center;color:var(--text-secondary)}
.kbv-sep{width:1px;height:18px;background:var(--border-default);margin:0 4px}
.kbv-body{display:flex;min-height:420px;max-height:76vh}
.kbv-rail{flex:none;width:86px;overflow-y:auto;padding:12px 8px;border-right:1px solid var(--border-subtle);background:var(--bg-muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.kbv-rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.kbv-rail small{font:400 11px/1 var(--font-sans);color:var(--text-muted)}
.kbv-rail button.on small{color:var(--text-primary);font-weight:500}
.kbv-th{width:50px;height:66px;background:#fff;border:1px solid var(--border-default);border-radius:2px;display:flex;flex-direction:column;gap:3px;padding:6px 5px;box-sizing:border-box}
.kbv-rail button.on .kbv-th{border-color:var(--brand-solid);box-shadow:0 0 0 2px var(--nav-sel-bg)}
.kbv-th i{display:block;height:4px;border-radius:1px;background:var(--brand-solid);opacity:.5}
.kbv-th i.w{background:var(--border-strong);opacity:.4;height:3px}
.kbv-stage{flex:1;min-width:0;overflow:auto;padding:var(--space-20);background:var(--bg-muted);display:flex;justify-content:center;align-items:flex-start}
.kbv-zoom{zoom:var(--kbz,1)}
.kbp-page{width:min(100%,720px);background:#fff;color:#111;border-radius:2px;box-shadow:0 2px 14px rgba(0,0,0,.14);padding:44px 52px 30px;box-sizing:border-box;font:400 13.5px/1.65 var(--font-sans)}
.kbp-page.kbp-wide{width:min(100%,900px);padding:16px}
.kbp-page.kbp-wide svg{width:100%;height:auto;display:block}
.kbp-canvas{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);display:block}
.kbp-head{border-bottom:2px solid #1b2a4a;padding-bottom:14px;margin-bottom:20px}
.kbp-brand{display:flex;justify-content:space-between;align-items:baseline;font:500 10.5px/1.3 var(--font-sans);letter-spacing:.08em;color:#1b2a4a;margin-bottom:16px}
.kbp-brand span{color:#6a7385}
.kbp-head h1{margin:0;font:500 25px/1.25 var(--font-flex,var(--font-sans));color:#1b2a4a;letter-spacing:-.01em}
.kbp-sub{margin:7px 0 0;font:400 13px/1.5 var(--font-sans);font-style:italic;color:#55607a}
.kbp-page p{margin:0 0 13px}
.kbp-t{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:12.5px}
.kbp-t th,.kbp-t td{border:1px solid #d9dde6;padding:7px 10px;text-align:left}
.kbp-t thead th{background:#eef1f6;font-weight:500;color:#1b2a4a}
.kbp-t td.num{text-align:right;font-variant-numeric:tabular-nums}
.kbp-kv th{background:#f6f7fa;width:38%;font-weight:500}
.kbp-fig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:280px;background:#f3f5f8;border:1px solid #e2e6ee;color:#6a7385;text-align:center;padding:24px}
.kbp-fig svg{width:38px;height:38px;opacity:.45}
.kbp-fig small{font-size:12px}
.kbp-foot{display:flex;justify-content:space-between;margin-top:26px;padding-top:10px;border-top:1px solid #e2e6ee;font:400 11px/1.3 var(--font-sans);color:#8a93a5}
@media (max-width:900px){.kbv-rail{display:none}.kbp-page{padding:28px 24px 20px}}
.kb-paper{max-width:74ch}
.kb-paper p{font-size:14px;line-height:1.65;color:var(--text-primary);margin:0 0 12px}
.kb-paper .kv{margin-bottom:14px}
.kb-dwg{background:var(--bg-subtle);border-radius:var(--radius-12);padding:10px;overflow:auto}
.kb-dwg svg{width:100%;height:auto;display:block}
.kb-cap{font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted);margin-top:8px;text-align:center}
.kb-imgph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:300px;background:var(--bg-subtle);border-radius:var(--radius-12);color:var(--text-secondary);font-size:14px;text-align:center;padding:20px}
.kb-imgph svg{width:40px;height:40px;opacity:.5}
/* the assistant that reads this item */
.kb-ai{position:sticky;top:var(--space-16);display:flex;flex-direction:column;max-height:calc(100vh - 150px);background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--elevation-2);overflow:hidden}
.kb-aih{display:flex;align-items:center;gap:10px;padding:var(--space-14) var(--space-16);border-bottom:1px solid var(--border-subtle)}
.kb-aih .ibtn{margin-left:auto}
.kb-aib{flex:1;overflow-y:auto;padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-16)}
.kb-sec{display:flex;flex-direction:column;gap:7px}
.kb-meta2{display:flex;flex-direction:column;gap:5px}
.kb-meta2>div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kb-meta2 span{color:var(--text-secondary);flex:none}
.kb-meta2 b{font-weight:500;text-align:right;min-width:0}
.kb-ins{display:flex;flex-direction:column;gap:8px}
.kb-insg{display:flex;flex-direction:column;gap:4px}
.kb-insv{display:flex;flex-wrap:wrap;gap:5px}
.kb-insv span{padding:3px 9px;border-radius:var(--radius-8);background:var(--nav-sel-bg);color:var(--nav-sel-fg);font:500 12.5px/1.35 var(--font-sans)}
.kb-u{align-self:flex-end;max-width:88%;padding:9px 13px;border-radius:14px 14px 4px 14px;background:var(--brand-solid);color:var(--brand-on-solid);font-size:13.5px;line-height:1.5}
.kb-a{max-width:95%;padding:11px 13px;border-radius:14px 14px 14px 4px;background:var(--bg-subtle);font-size:13.5px;line-height:1.55}
.kb-a p{margin:0 0 8px}.kb-a p:last-child{margin:0}
.kb-a ul{margin:0;padding-left:17px}
.kb-a li{margin-bottom:5px}
.kb-note{display:block;margin-top:7px;font:400 11.5px/1.3 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.kb-think{display:flex;gap:11px;align-items:flex-start}
.kb-step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted)}
.kb-step svg{width:13px;height:13px}
.kb-step.on{color:var(--text-primary);font-weight:500}
.kb-step.done{color:var(--text-secondary)}
.kb-aif{border-top:1px solid var(--border-subtle);padding:var(--space-12) var(--space-14);display:flex;flex-direction:column;gap:9px}
.kb-sugg{display:flex;flex-wrap:wrap;gap:6px}
.kb-sugg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:var(--radius-full);border:1px solid var(--border-subtle);font-size:12.5px;color:var(--text-secondary);background:var(--bg-surface)}
.kb-sugg button:hover{background:var(--bg-hover);color:var(--text-primary)}
.kb-askf{display:flex;align-items:center;gap:6px;border:1px solid var(--border-default);border-radius:var(--radius-12);padding:4px 4px 4px 12px}
.kb-askf:focus-within{border-color:var(--brand-solid)}
.kb-askf input{all:unset;flex:1;min-width:0;font:400 13.5px/1.5 var(--font-sans);color:var(--text-primary)}
.kb-askf .ibtn.on{background:var(--brand-solid);color:var(--brand-on-solid)}
.kb-go{all:unset;cursor:pointer;width:32px;height:32px;flex:none;border-radius:var(--radius-8);display:grid;place-items:center;background:var(--brand-solid);color:var(--brand-on-solid)}
.kb-go[disabled]{opacity:.45;cursor:default}
.kb-go svg{width:16px;height:16px}
@media (max-width:1100px){.kb-canvas{grid-template-columns:minmax(0,1fr)}.kb-ai{position:static;max-height:560px}}
@media (max-width:640px){.kb-facets{gap:var(--space-12)}.kb-meta{max-width:100%;justify-content:flex-start}.kb-row{flex-direction:column;gap:8px}}
/* the agent cell keeps its avatar beside the name: .row wraps by default */
.agrow{flex-wrap:nowrap;align-items:flex-start}
.agrow>div{min-width:0}
.agrow .agimg-sm{margin-top:2px}

/* ---------- analytics headline: one lead card, then plain cards ----------
   The lead card is the only one with a wash behind it, and the only tint
   besides it marks the card that is asking for a decision. */
.anh{display:grid;grid-template-columns:minmax(340px,2fr) repeat(3,minmax(160px,1fr));gap:var(--space-16);margin-bottom:var(--space-20);align-items:stretch}
.anh-lead,.anh-card{box-sizing:border-box;display:flex;flex-direction:column;border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:var(--space-18) var(--space-20);background:var(--bg-surface)}
.anh-lead{gap:var(--space-12);justify-content:space-between;background:var(--bg-surface)}
.anh-fig{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-10)}
.anh-fig .v{font:500 32px/1.1 var(--font-flex);letter-spacing:-.02em;color:var(--text-primary)}
.anh-delta{font-size:12.5px;color:var(--text-secondary);white-space:nowrap}
.anh-bar{display:flex;gap:3px;height:9px;border-radius:var(--radius-full);overflow:hidden}
.anh-bar i{display:block;border-radius:var(--radius-full);min-width:4px}
.anh-key{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px var(--space-14)}
.anh-key li{display:flex;align-items:center;gap:6px;min-width:0;padding-right:var(--space-6);font-size:12px;color:var(--text-secondary)}
/* the review row: "File under" stays left, the two decisions sit on the right */
.kb-inspace{flex:1 1 auto;min-width:var(--space-12)}
@media (max-width:760px){.kb-inspace{display:none}}

/* New-tender modal: the optional document drop and the files held until the tender exists. */
#ntdrop{padding:var(--space-16) var(--space-12)}
#ntdrop b{font-size:14px}
#ntdrop .sub{font-size:12.5px}
.ntfl{display:flex;flex-direction:column;gap:var(--space-6);margin-top:var(--space-8)}
.ntfl .sub{font-size:12px}
.ntf{display:flex;align-items:center;gap:var(--space-8);min-width:0;
  background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-8);
  padding:var(--space-4) var(--space-6) var(--space-4) var(--space-12);font-size:13px}
.ntf-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntf .muted{font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.ntf .ibtn{width:var(--size-24);height:var(--size-24);flex:none}
.ntf .ibtn .ico{width:14px;height:14px}
/* ===== Record header, layout C (27 Oct 2026) =====
   Who and what it is, then the three figures that decide anything, then the phases
   with a tick per stage so the thirteen are readable without being spelled out. ===== */
.oh--c{gap:var(--space-14);padding:var(--space-16) var(--space-20) var(--space-12)}
.ohc-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;
  gap:var(--space-14) var(--space-32)}
.ohc-who{display:flex;flex-direction:column;gap:var(--space-6);flex:1 1 440px;min-width:0}
.oh--c h1{font:500 23px/1.2 var(--font-flex,var(--font-sans));letter-spacing:-.01em}
.ohc-meta{display:flex;flex-wrap:wrap;gap:4px var(--space-20);font-size:13px}
.ohc-meta small{font-size:13px;color:var(--text-muted)}
.ohc-meta b{font-weight:500}
.ohc-stats{display:flex;align-items:flex-end;gap:var(--space-24);flex-wrap:wrap}
.ohc-stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.ohc-stat small{font:500 11px/1.3 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted)}
.ohc-stat b{font:500 18px/1.3 var(--font-flex,var(--font-sans));white-space:nowrap;
  font-variant-numeric:tabular-nums}
.ohc-stat b i.soon{color:var(--warning-fg)}
.ohc-stat b i{font:400 13px/1.3 var(--font-sans);font-style:normal;color:var(--text-muted);margin-left:3px}
.ohc-phase{display:flex;flex-direction:column;gap:var(--space-12)}
.ohc-phhd{display:flex;align-items:center;gap:var(--space-8) var(--space-12);flex-wrap:wrap;min-width:0}
.ohc-phhd .eyebrow{color:var(--text-brand)}
.ohc-phhd b{font:500 17px/1.3 var(--font-flex,var(--font-sans))}
.ohc-phhd .sub{font-size:14px}
/* The disclosure is a small button from the system, not a line of text. */
.ohc-more{flex:none;padding-left:var(--space-6);padding-right:var(--space-8)}
.ohc-more .ico{width:15px;height:15px}
.ohc-next{margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-full);
  padding:var(--space-4) var(--space-12);font:400 13px/1.4 var(--font-sans);color:var(--text-secondary)}
.ohc-next b{font:500 13px/1.4 var(--font-sans);color:var(--text-primary)}
.ohc-steps{display:flex;gap:var(--space-8);flex-wrap:wrap}
.ohc-stp{all:unset;cursor:pointer;box-sizing:border-box;flex:1 1 150px;min-width:0;
  display:flex;flex-direction:column;gap:7px;padding:var(--space-10);border-radius:var(--radius-12)}
.ohc-stp:hover{background:var(--bg-hover)}
.ohc-stp:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px;box-shadow:var(--focus-ring)}
.ohc-stp.sel{background:var(--nav-sel-bg)}
.ohc-tks{display:flex;gap:3px}
.ohc-tks .tk{flex:1 1 0;min-width:4px;height:6px;border-radius:var(--radius-full);background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.ohc-tks .tk.done{background:var(--brand-solid);box-shadow:none}
.ohc-tks .tk.now{background:var(--ai-teal);box-shadow:none}
.ohc-stpn{font:400 14px/1.3 var(--font-sans);color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohc-stp.now .ohc-stpn{color:var(--text-primary);font-weight:500}
.ohc-stp.sel .ohc-stpn{color:var(--nav-sel-fg);font-weight:500}
.ohc-stps{display:flex;align-items:center;gap:6px;min-width:0;
  font:400 12px/1.3 var(--font-sans);color:var(--text-muted);white-space:nowrap}
.ohc-st{display:inline-flex;align-items:center;gap:5px;flex:none;font-weight:500}
.ohc-st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.ohc-st.is-done{color:var(--success-fg)}
.ohc-st.is-now{color:var(--text-brand)}
.ohc-st.is-wait{color:var(--text-muted)}
.ohc-st.is-open,.ohc-st.is-closed{color:var(--warning-fg)}
.ohc-st.is-byp{color:var(--danger-fg)}
.ohc-stpc{font:400 11.5px/1.3 var(--font-sans);color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
  .ohc-stats{width:100%;justify-content:flex-start;gap:var(--space-16)}
  .ohc-next{margin-left:0;width:100%}
  .ohc-stp{flex:1 1 120px}
}
/* Ownership and review: the admin console KPI card, and rows marked by an edge, not a fill. */
.t tr.mine td{background:var(--bg-surface)}
.t tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--brand-solid)}
.t tr.mine:hover td{background:var(--bg-hover)}
/* ---------- admin console: less air above the work ----------
   The hero and the status cards were taking most of the first screen before
   a single setting appeared. Same content, tighter. */
.ahero{min-height:0;padding:var(--space-20) var(--space-24) var(--space-18);gap:var(--space-20);align-items:center}
.ahero h1{font-size:26px;line-height:1.18}
.ahero-tx{gap:var(--space-4)}
.ahero-tx p{font-size:13.5px;line-height:1.45;max-width:62ch}
.ahero-art{height:124px}
.ahero-note{bottom:2px;padding:var(--space-6) var(--space-10) var(--space-6) var(--space-6);border-radius:var(--radius-12)}
.ahero-note b{font-size:12.5px}
.ahero-note span:not(.ahero-dot){font-size:11.5px}
.ahero-dot{width:26px;height:26px;border-radius:8px}
.ahero-dot svg{width:15px;height:15px}
.ahero-sw{top:var(--space-12);right:var(--space-12)}
@media (max-width:1100px){.ahero-art{height:100px}}

.akpi{padding:var(--space-12) var(--space-14);gap:var(--space-6);border-radius:var(--radius-12)}
.akpi-h{gap:var(--space-8)}
.akpi-ic{width:28px;height:28px;border-radius:8px}
.akpi-ic svg{width:16px;height:16px}
.akpi-l{font-size:12px}
.akpi-go{width:24px;height:24px}
.akpi-go svg{width:14px;height:14px}
.akpi-v{font-size:21px;line-height:1.15}
.akpi-v small{font-size:13px}
.akpi-d{font-size:11.5px}
.akpi-f{gap:var(--space-8)}

/* ---------- integrations: one control height across the whole filter row ---------- */
.ifilters{--ctl:36px;display:flex;align-items:center;gap:var(--space-10);flex-wrap:wrap;margin-top:var(--space-16)}
.ifilters input[type=search]{height:var(--ctl);box-sizing:border-box;width:clamp(190px,20vw,250px);flex:none;margin:0;padding:0 var(--space-12);border-radius:var(--radius-full);font-size:13px}
.ifilters .seg{height:var(--ctl);box-sizing:border-box;flex:none;align-items:center;padding:var(--space-4)}
.ifilters .seg button{display:inline-flex;align-items:center;gap:6px;height:calc(var(--ctl) - var(--space-8));padding:0 var(--space-12);white-space:nowrap;font-size:13px}
.ifilters .seg .ct2{font-size:11px;line-height:1}
@media (max-width:860px){.ifilters input[type=search]{width:100%;flex:1 1 100%}}

/* ---------- grouped console navigation ---------- */
/* Each group is its own pill track, so the grouping is something you see
   rather than a caption over an undifferentiated row of links. */
.atabs{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-16);flex-wrap:wrap;border-bottom:0;margin-bottom:var(--space-18)}
.atabs>:not(.atabs3){margin:0 0 var(--space-2) auto;flex:none}
.atabs3{flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-10) var(--space-14);padding:var(--space-10) 0 0;border-bottom:0;margin-bottom:0}
.atg{display:flex;flex-direction:column;gap:var(--space-6);min-width:0}
.atg-l{font:500 10px/1 var(--font-sans);letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);padding-left:var(--space-12)}
.atg-b{display:inline-flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-4);border-radius:var(--radius-full);background:var(--bg-subtle);border:1px solid var(--border-subtle)}
.atg-b button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 var(--space-14);border-radius:var(--radius-full);font:400 13px/1 var(--font-sans);color:var(--text-secondary);white-space:nowrap;transition:background-color .12s ease,color .12s ease}
.atg-b button:hover{color:var(--text-primary);background:color-mix(in srgb,var(--bg-surface) 70%,transparent)}
.atg-b button:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px}
.atg-b button.on{background:var(--bg-surface);color:var(--text-primary);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.atg-b button.on .ct2{background:var(--brand-solid);color:var(--brand-on-solid)}
.atg-b .ct2{font-size:11px}
@media (max-width:900px){.atabs3{gap:var(--space-10)}.atg-b{flex:1}}

/* ---------- AI credits ---------- */
.acr-lead{border-color:color-mix(in srgb,var(--brand-solid) 24%,var(--border-subtle))}
.acr-fig{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-8)}
.acr-fig .v{font:500 34px/1.1 var(--font-flex,var(--font-sans));letter-spacing:-.02em;color:var(--text-primary);font-variant-numeric:tabular-nums}
.acr-fig .u{font-size:13px;color:var(--text-secondary)}

.acr-key{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-8)}

.acr-key li em{font-style:normal;font-weight:500;color:var(--text-primary);font-variant-numeric:tabular-nums;white-space:nowrap}
.acr-packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-10)}
.acr-pack{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:var(--space-14);border-radius:var(--radius-12);border:1px solid var(--border-subtle);background:var(--bg-surface);text-align:left}

.acr-pack.on{border-color:var(--brand-solid);background:color-mix(in srgb,var(--brand-solid) 7%,var(--bg-surface));box-shadow:inset 0 0 0 1px var(--brand-solid)}
.acr-pack .n{font:500 20px/1.2 var(--font-flex,var(--font-sans));color:var(--text-primary);font-variant-numeric:tabular-nums}
.acr-pack .l{font-size:11.5px;color:var(--text-muted)}
.acr-pack .p{margin-top:var(--space-6);font:500 15px/1.2 var(--font-sans);color:var(--text-primary)}
.acr-pack .c{font-size:11.5px;color:var(--text-secondary)}
.acr-pack .r{font-size:11px;color:var(--text-muted)}

/* ---------- approval matrix: gates read as sentences, ticks on demand ---------- */
.agate{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.agate li{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-10) 0;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}

.agate-who{flex:1;display:flex;flex-wrap:wrap;gap:var(--space-6);min-width:0}
.agate-r{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:var(--radius-full);background:var(--bg-subtle);font-size:12px;color:var(--text-secondary);white-space:nowrap}
.agate-r i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--brand-solid);color:var(--brand-on-solid);font:500 9.5px/1 var(--font-sans);font-style:normal}

/* ---------- audit log: the controls belong to the log ---------- */
.aud-h{align-items:center;gap:var(--space-12);flex-wrap:wrap}
.aud-ctl{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap}
.aud-ctl input[type=search]{height:34px;box-sizing:border-box;width:220px;margin:0;padding:0 var(--space-12);border-radius:var(--radius-full);font-size:13px}

@media (max-width:720px){.aud-ctl{width:100%}.aud-ctl input[type=search]{flex:1;width:auto}}



/* ============================================================================
   Overview — the dashboard
   ----------------------------------------------------------------------------
   The assistant is not a panel: it lives at the foot of each card, and opens
   its answer inside the same card.
   ========================================================================== */
.hm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-16);flex-wrap:wrap;margin-bottom:var(--space-4)}
.hm-head h1{font:500 30px/1.15 var(--font-flex,var(--font-sans));letter-spacing:-.015em}
.hm-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:var(--space-16);align-items:start}
@media (max-width:1180px){.hm-grid{grid-template-columns:minmax(0,1fr)}}

/* the four cards */
.hm-cards{display:grid;grid-template-columns:minmax(300px,1.6fr) repeat(3,minmax(190px,1fr));gap:var(--space-14);
  margin-bottom:var(--space-16);align-items:start}
@media (max-width:1280px){.hm-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hm-card.is-lead{grid-column:1/-1}}
@media (max-width:640px){.hm-cards{grid-template-columns:minmax(0,1fr)}}
.hm-card{box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-8);min-width:0;
  padding:var(--space-16) var(--space-18) var(--space-10);background:var(--bg-surface);
  border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--elevation-1)}
.hm-card.is-lead{gap:var(--space-12);background:var(--bg-surface)}
.hm-card.is-warn{border-color:color-mix(in srgb,var(--warning-fg) 36%,var(--border-subtle));
  background:color-mix(in srgb,var(--warning-bg) 55%,var(--bg-surface))}
.hm-card>.v{font:500 28px/1.15 var(--font-flex,var(--font-sans));letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.hm-card>.v.ok{color:var(--success-fg)}.hm-card>.v.warn{color:var(--warning-hover)}
.hm-card>.d{font-size:12.5px;color:var(--text-muted);line-height:1.45}
.hm-fig{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-10)}
.hm-fig .v{font:500 32px/1.1 var(--font-flex,var(--font-sans));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hm-sub{font-size:12.5px;color:var(--text-secondary)}
.hm-bar{display:flex;gap:3px;height:9px}
.hm-bar i{display:block;border-radius:var(--radius-full);min-width:4px}
.hm-key{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px var(--space-14)}
.hm-key li{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--text-secondary);padding-right:var(--space-6)}
.hm-key li i{width:8px;height:8px;border-radius:3px;flex:none}
.hm-key li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-key li b{margin-left:auto;font-weight:500;color:var(--text-primary);white-space:nowrap}
.hm-rail{position:relative;height:5px;border-radius:var(--radius-full);background:var(--bg-muted);overflow:visible}
.hm-rail i{display:block;height:100%;border-radius:inherit;background:var(--success-fg)}
.hm-tick{position:absolute;top:-3px;width:2px;height:11px;border-radius:1px;background:var(--text-primary);opacity:.45}

/* the reading at the foot of a card */
.hm-ai{margin-top:auto;padding-top:var(--space-10);border-top:1px solid var(--border-subtle)}
.hm-airow{display:flex;align-items:flex-start;gap:8px}
.hm-orb{display:inline-grid;place-items:center;flex:none;margin-top:1px}
.hm-airow p{flex:1;min-width:0;margin:0;font:400 12.5px/1.5 var(--font-sans);color:var(--text-secondary)}
.hm-airow p b{font-weight:500;color:var(--text-primary)}
.hm-askb{all:unset;cursor:pointer;flex:none;align-self:flex-start;padding:2px var(--space-10);border-radius:var(--radius-full);
  border:1px solid var(--border-subtle);font:500 11.5px/1.6 var(--font-sans);color:var(--text-brand)}
.hm-askb:hover{background:var(--brand-softer);border-color:var(--brand-solid)}
.hm-askb:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:1px}
.hm-ai.is-open{border-top-color:color-mix(in srgb,var(--ai-teal) 32%,var(--border-subtle))}
.hm-steps{display:flex;flex-direction:column;gap:5px;padding:var(--space-10) 0 var(--space-4) 26px}
.hm-steps span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.hm-steps span i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border-default);flex:none}
.hm-steps span.now{color:var(--text-primary)}
.hm-steps span.now i{border-color:var(--ai-teal);border-top-color:transparent;animation:lvSpin .8s linear infinite}
.hm-steps span .ico{width:12px;height:12px;color:var(--success-fg)}
.hm-ans{margin-top:var(--space-10);padding:var(--space-12);border-radius:var(--radius-12);background:var(--ai-wash);
  border:1px solid color-mix(in srgb,var(--ai-teal) 20%,var(--border-subtle));font:400 12.5px/1.6 var(--font-sans);color:var(--text-secondary)}
.hm-ans p{margin:0 0 var(--space-8)}
.hm-ans p:last-child{margin:0}
.hm-ans ul{margin:0 0 var(--space-8);padding-left:16px;display:flex;flex-direction:column;gap:3px}
.hm-ans b{font-weight:500;color:var(--text-primary)}
.hm-over{color:var(--danger-fg)}
.hm-ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-8)}
.hm-ol li{display:flex;align-items:flex-start;gap:var(--space-8)}
.hm-ol li>span:nth-child(2){flex:1;min-width:0}
.hm-ol .chip{flex:none;min-width:46px;justify-content:center}
.hm-ol .btn{flex:none}

/* live tenders, each row with its own read */
.hm-tl{list-style:none;margin:0;padding:0}
.hm-tl li{border-bottom:1px solid var(--border-subtle)}
.hm-tl li:last-child{border-bottom:0}
.hm-tl button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;width:100%;
  padding:var(--space-12) var(--space-16)}
.hm-tl button:hover{background:var(--bg-hover)}
.hm-tl button:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:-2px}
.hm-th{display:flex;flex-direction:column;gap:1px;min-width:0}
.hm-th b{font:500 14px/1.35 var(--font-sans)}
.hm-tm{display:flex;align-items:center;gap:var(--space-10);flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary)}
.hm-tr{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px var(--space-10) 4px 6px;border-radius:var(--radius-full);
  align-self:flex-start;background:var(--bg-subtle);color:var(--text-secondary)}
.hm-tr.is-bad{background:var(--danger-bg);color:var(--danger-fg)}
.hm-tr.is-warn{background:var(--warning-bg);color:var(--warning-hover)}
.hm-tr.is-ok{background:var(--success-bg);color:var(--success-fg)}
.hm-soon{color:var(--warning-hover);font-weight:500}

/* what lands next */
.hm-run{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hm-run button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:var(--space-12);width:100%;
  padding:var(--space-8) var(--space-10);border-radius:var(--radius-8)}
.hm-run button:hover{background:var(--bg-hover)}
.hm-run button:focus-visible{outline:1.5px solid var(--brand-solid);outline-offset:-1px}
.hm-rd{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-12);
  background:var(--bg-subtle);font:500 17px/1 var(--font-flex,var(--font-sans));font-variant-numeric:tabular-nums}
.hm-rd small{font-size:10px;font-weight:400;color:var(--text-muted)}
.hm-rd.is-hot{background:var(--warning-bg);color:var(--warning-hover)}
.hm-rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hm-rt b{font:500 13px/1.35 var(--font-sans);display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-rt>span{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-rb{flex:none;width:52px;height:5px;border-radius:var(--radius-full);background:var(--bg-muted);overflow:hidden}
.hm-rb i{display:block;height:100%;border-radius:inherit;background:var(--brand-solid)}

/* agents */
.hm-ag{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hm-ag li{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-8) 0;border-bottom:1px solid var(--border-subtle)}
.hm-ag li:last-child{border-bottom:0}
.hm-agav{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--bg-subtle)}
.hm-agav svg,.hm-agav .agav{width:100%;height:100%;display:block;border-radius:50%}
.hm-agt{flex:1;min-width:0;display:flex;flex-direction:column}
.hm-agt b{font:500 13px/1.35 var(--font-sans)}
.hm-agt span{font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-agm{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.hm-agm b{font:500 13px/1.3 var(--font-sans);font-variant-numeric:tabular-nums}
.hm-agm small{font-size:11px;color:var(--text-muted)}

/* ============================================================================
   Knowledge library — a file manager
   ----------------------------------------------------------------------------
   Three surfaces side by side: where files live, the files, and the assistant.
   Each is a real panel with its own outline and lift, and each starts at the
   same line, so the page reads as three things rather than one blur.
   ========================================================================== */
.kx-shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:var(--space-14);align-items:stretch;
  min-height:calc(100vh - 210px);transition:padding-right .26s cubic-bezier(.2,.8,.3,1)}
/* the assistant docks on the right: the manager keeps working, just narrower */
.kx-shell.is-ai{padding-right:460px}
.kx-shell.is-ai .kx-askbtn{display:none}
@media (max-width:1240px){.kx-shell.is-ai{padding-right:0}}
.kx-side,.kx-panel,.kx-ai{background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--radius-card);box-shadow:var(--elevation-2);overflow:hidden}
.kx-body{min-width:0;display:flex;flex-direction:column;gap:var(--space-12)}
.kx-panel{display:flex;flex-direction:column;min-height:0;flex:1;container-type:inline-size}
.kx-panel>.tw{flex:1;min-height:0;overflow:auto}
@media (max-width:1040px){.kx-shell{grid-template-columns:216px minmax(0,1fr)}}
@media (max-width:860px){.kx-shell{grid-template-columns:minmax(0,1fr)}}

/* the shared header bar across all three panels */
.kx-th,.kx-bar,.kx-aih{display:flex;align-items:center;gap:var(--space-10);min-height:56px;box-sizing:border-box;
  padding:var(--space-10) var(--space-14);border-bottom:1px solid var(--border-subtle);background:var(--bg-subtle)}
.kx-th b,.kx-aih b{font:500 14px/1.3 var(--font-sans)}
.kx-th{justify-content:space-between}
.kx-bar{justify-content:space-between;flex-wrap:nowrap;background:var(--bg-surface);overflow:hidden}
.kx-barl{display:flex;align-items:center;gap:var(--space-10);min-width:0;flex:1;overflow:hidden}
.kx-count{font-size:12px;color:var(--text-muted);white-space:nowrap}
@media (max-width:1500px){.kx-count{display:none}}
.kx-hact{display:flex;align-items:center;gap:var(--space-8);flex:none}

/* the tree: drives are the prominent thing in it */
.kx-tree{display:flex;flex-direction:column;min-height:0;height:100%}
.kx-tscroll{flex:1;min-height:0;overflow-y:auto;padding:var(--space-10);scrollbar-width:thin}
.kx-tree ul{list-style:none;margin:0;padding:0}
.kx-tall{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;flex:none;
  padding:var(--space-4) var(--space-10);border-radius:var(--radius-full);border:1px solid var(--border-subtle);
  font:400 12.5px/1.4 var(--font-sans);color:var(--text-secondary);background:var(--bg-surface)}
.kx-tall em{font-style:normal;font-size:11px;color:var(--text-muted)}
.kx-tall:hover{border-color:var(--border-strong);color:var(--text-primary)}
.kx-tall.on{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inverse);font-weight:500}
.kx-tall.on em{color:inherit;opacity:.75}
.kx-sect{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:var(--space-6) var(--space-8) var(--space-8);
  font:500 10.5px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.kx-sect span{font-size:10.5px;background:var(--bg-muted);border-radius:var(--radius-full);padding:2px 7px;letter-spacing:0}
.kx-drives{display:flex;flex-direction:column;gap:var(--space-2)}
.kx-dr{display:flex;align-items:center;gap:2px;border-radius:var(--radius-10,10px);border:1px solid transparent}
.kx-dr.on{background:var(--nav-sel-bg);border-color:color-mix(in srgb,var(--brand-solid) 26%,transparent)}
.kx-dr.on .kx-dtx b{color:var(--nav-sel-fg)}
.kx-dr:hover:not(.on){background:var(--bg-hover)}
.kx-db{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:var(--space-10);flex:1;min-width:0;
  padding:var(--space-8) var(--space-10) var(--space-8) 0}
.kx-dlogo{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:var(--radius-8);
  background:#fff;border:1px solid var(--border-subtle);padding:5px;box-sizing:border-box}
.kx-dlogo svg{width:100%;height:100%;display:block}
.kx-dtx{display:flex;flex-direction:column;min-width:0;flex:1}
.kx-dtx b{font:500 13.5px/1.3 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-dtx small{font-size:11px;color:var(--text-muted)}
.kx-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--success-fg);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--success-fg) 20%,transparent)}
.kx-sub{margin:var(--space-2) 0 var(--space-6) 0;padding-left:var(--space-10);
  border-left:1px solid var(--border-subtle);margin-left:var(--space-16)}
.kx-tn{display:flex;align-items:center;gap:2px;padding-left:calc(var(--d,0) * 11px);border-radius:var(--radius-8)}
.kx-tn.on{background:var(--nav-sel-bg)}
.kx-tn.on .kx-tb{color:var(--nav-sel-fg);font-weight:500}
.kx-tn:hover:not(.on){background:var(--bg-hover)}
.kx-tw{all:unset;cursor:pointer;flex:none;display:grid;place-items:center;width:20px;height:28px;color:var(--text-muted);border-radius:var(--radius-4)}
.kx-tw .ico{width:13px;height:13px;transition:transform .15s ease}
.kx-tw[aria-expanded=true] .ico{transform:rotate(90deg)}
.kx-tw.is-leaf{visibility:hidden}
.kx-tw:hover{color:var(--text-primary)}
.kx-tb{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:7px;flex:1;min-width:0;
  padding:var(--space-6) var(--space-8) var(--space-6) 0;font:400 12.5px/1.3 var(--font-sans);color:var(--text-secondary)}
.kx-tb:hover{color:var(--text-primary)}
.kx-tb .ico{width:14px;height:14px;flex:none;color:var(--text-muted)}
.kx-tb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx-tb em{font-style:normal;font-size:11px;color:var(--text-muted);flex:none}
.kx-slogo{display:inline-grid;place-items:center;width:15px;height:15px;flex:none}
.kx-slogo svg{width:100%;height:100%;display:block}
.kx-slogo.lg{width:34px;height:34px;border-radius:var(--radius-8);background:#fff;border:1px solid var(--border-subtle);padding:5px;box-sizing:border-box}
.kx-add{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;margin-top:var(--space-10);
  padding:var(--space-10);border-radius:var(--radius-10,10px);border:1px dashed var(--border-default);
  font:400 13px/1.3 var(--font-sans);color:var(--text-brand)}
.kx-add:hover{background:var(--brand-softer);border-color:var(--brand-solid)}
.kx-add .ico{width:15px;height:15px}
.kx-add em{margin-left:auto;font-style:normal;font-size:11px;color:var(--text-muted)}
.kx-tfoot{flex:none;padding:var(--space-10) var(--space-14);border-top:1px solid var(--border-subtle);
  background:var(--bg-subtle);font-size:11.5px;color:var(--text-muted)}

/* search inside the bar */
.kx-crumbs{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;overflow:hidden;font-size:13px;color:var(--text-muted);min-width:0}
.kx-crumbs button{all:unset;cursor:pointer;color:var(--text-secondary);padding:2px 6px;border-radius:var(--radius-6);white-space:nowrap;flex:none;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.kx-crumbs span{flex:none}
@container (max-width:620px){.kx-crumbs button:not(.on):not(:first-child),.kx-crumbs span:not(:first-of-type){display:none}}
@container (max-width:470px){.kx-crumbs button:first-child,.kx-crumbs span{display:none}}
